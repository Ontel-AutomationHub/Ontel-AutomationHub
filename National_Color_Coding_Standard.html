<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>National Color Coding Standard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

// Lightweight stand-ins for the lucide-react icons used in this tool
const Upload = ({ size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
  </svg>
);
const Download = ({ size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
  </svg>
);
const Camera = ({ size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" /><circle cx="12" cy="13" r="4" />
  </svg>
);

// Color mapping based on telecommunications standards
const SECTOR_COLORS = {
  '1': '#FF0000',     // Alpha - Red
  '2': '#006400',     // Beta - Dark Green
  '3': '#0000FF',     // Gamma - Blue
  '4': '#FFFF00',     // Delta - Yellow
  '5': '#FFFFFF',     // Epsilon - White
  '6': '#800080'      // Zeta - Purple
};

const FREQUENCY_COLORS = {
  '600': '#FFC0CB',   // Pink
  '700': '#FFFFFF',   // White
  '1900': '#FFA500',  // Orange
  '2100': '#006400',  // Dark Green
  '2500': '#FFFF00',  // Yellow
  '5000': '#800080',  // LAA-5GHz - Purple
  '28000': '#0000FF', // 28GHz - Blue
  '39000': '#FF0000', // 39GHz - Red
  'AWS3': '#8B4513'   // Brown
};

const TECHNOLOGY_COLORS = {
  'G': '#FFFFFF',     // GSM - White
  'U': '#0000FF',     // UMTS - Blue
  'L': '#FFA500',     // LTE - Orange
  'N': '#FFC0CB'      // 5G - Pink
};

const SPACING_COLOR = '#000000'; // Black for spacing

const RFDSCableVisualizer = () => {
  const [uploadedImage, setUploadedImage] = useState(null);
  const [extractedData, setExtractedData] = useState(null);
  const [isProcessing, setIsProcessing] = useState(false);
  const [error, setError] = useState(null);

  // Handle paste event for screenshots
  React.useEffect(() => {
    const handlePaste = async (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;

      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          e.preventDefault();
          const blob = items[i].getAsFile();
          if (blob) {
            setIsProcessing(true);
            setError(null);
            
            const reader = new FileReader();
            reader.onload = async (event) => {
              setUploadedImage(event.target.result);
              
              try {
                const analyzed = await analyzeRFDS(event.target.result);
                setExtractedData(analyzed);
              } catch (err) {
                setError("Failed to analyze image: " + err.message);
              } finally {
                setIsProcessing(false);
              }
            };
            reader.readAsDataURL(blob);
          }
          break;
        }
      }
    };

    window.addEventListener('paste', handlePaste);
    return () => window.removeEventListener('paste', handlePaste);
  }, []);

  const parseRFDSTechnology = (techString) => {
    // Parse technology strings like "L600", "N1900", "L2100", "LAWS3", etc.
    
    // Special case: Handle "LAWS3" as L + AWS3
    if (techString.toUpperCase() === 'LAWS3') {
      return { technology: 'L', frequency: 'AWS3' };
    }
    
    // Handle "NLAA" as N + LAA (5GHz)
    if (techString.toUpperCase() === 'NLAA') {
      return { technology: 'N', frequency: '5000' };
    }
    
    // Standard pattern: [Letter][Frequency]
    const match = techString.match(/^([GLUN])(\d+|AWS3|LAA)$/i);
    if (match) {
      const tech = match[1].toUpperCase();
      let freq = match[2];
      
      // Map frequency to standard values
      if (freq === '600') freq = '600';
      else if (freq === '700') freq = '700';
      else if (freq === '1900') freq = '1900';
      else if (freq === '2100') freq = '2100';
      else if (freq === '2500') freq = '2500';
      else if (freq.toUpperCase().includes('AWS')) freq = 'AWS3';
      else if (freq === '28000' || freq === '28') freq = '28000';
      else if (freq === '39000' || freq === '39') freq = '39000';
      else if (freq.toUpperCase().includes('LAA') || freq === '5000') freq = '5000';
      
      return { technology: tech, frequency: freq };
    }
    return null;
  };

  const isLowBand = (frequency) => {
    // Low band: 600, 700
    // High band: 1900, 2100, 2500, AWS3, 5000, 28000, 39000
    return frequency === '600' || frequency === '700';
  };

  const getAntennaType = (model) => {
    // Check if it's an AIR antenna (Active Antenna - Massive MIMO)
    if (model.toUpperCase().includes('AIR')) {
      return 'AIR';
    }
    // Check for Octo antenna
    if (model.toUpperCase().includes('OCTO')) {
      return 'OCTO';
    }
    // Check for Quad antenna
    if (model.toUpperCase().includes('QUAD')) {
      return 'QUAD';
    }
    // Check for Hex antenna
    if (model.toUpperCase().includes('HEX')) {
      return 'HEX';
    }
    // Check for AEHC antenna
    if (model.toUpperCase().includes('AEHC')) {
      return 'AEHC';
    }
    // Default
    return 'OTHER';
  };

  const getCableCount = (antennaModel, bandType = '') => {
    const antennaType = getAntennaType(antennaModel);
    // AIR antennas only have 2 cables
    if (antennaType === 'AIR') {
      return 2;
    }
    // HEX antennas: 2 cables for Low Band, 4 cables for High Band
    if (antennaType === 'HEX') {
      if (bandType === 'Low Band') {
        return 2;
      }
      return 4; // High Band or no band specified
    }
    // AEHC antennas: 4 cables regardless of band (dark tech or not)
    if (antennaType === 'AEHC') {
      return 4;
    }
    // All other antennas have 4 cables
    return 4;
  };

  const filterDarkTech = (technologies, antennaModel) => {
    const antennaType = getAntennaType(antennaModel);
    // AEHC antennas keep all technologies including dark tech
    if (antennaType === 'AEHC') {
      return technologies;
    }
    // For all other antennas, filter out dark tech
    return technologies.filter(tech => {
      const techUpper = tech.toUpperCase();
      // Filter out entries that contain "DARK"
      return !techUpper.includes('DARK');
    });
  };

  const splitAntennaByBand = (antenna) => {
    // First filter out dark tech (except for AEHC)
    const filteredTechnologies = filterDarkTech(antenna.technologies, antenna.model);
    
    const lowBandTechs = [];
    const highBandTechs = [];
    
    filteredTechnologies.forEach((tech) => {
      const parsed = parseRFDSTechnology(tech);
      if (parsed) {
        if (isLowBand(parsed.frequency)) {
          lowBandTechs.push(tech);
        } else {
          highBandTechs.push(tech);
        }
      }
    });
    
    const result = [];
    
    // Only create groups if they have technologies
    if (lowBandTechs.length > 0) {
      result.push({
        ...antenna,
        technologies: lowBandTechs,
        bandType: 'Low Band',
        displayNumber: `${antenna.number}L`
      });
    }
    
    if (highBandTechs.length > 0) {
      result.push({
        ...antenna,
        technologies: highBandTechs,
        bandType: 'High Band',
        displayNumber: `${antenna.number}H`
      });
    }
    
    // If only one band type exists, don't add suffix
    if (result.length === 1) {
      result[0].displayNumber = antenna.number.toString();
      result[0].bandType = '';
    }
    
    return result;
  };

  const handleImageUpload = async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    setIsProcessing(true);
    setError(null);
    
    const reader = new FileReader();
    reader.onload = async (e) => {
      setUploadedImage(e.target.result);
      
      try {
        const analyzed = await analyzeRFDS(e.target.result);
        setExtractedData(analyzed);
      } catch (err) {
        setError("Failed to analyze image: " + err.message);
      } finally {
        setIsProcessing(false);
      }
    };
    reader.readAsDataURL(file);
  };

  const analyzeRFDS = async (imageData) => {
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 2000,
          messages: [
            {
              role: "user",
              content: [
                {
                  type: "image",
                  source: {
                    type: "base64",
                    media_type: "image/png",
                    data: imageData.split(',')[1]
                  }
                },
                {
                  type: "text",
                  text: `Analyze this RFDS (Radio Frequency Design Sheet) screenshot carefully and extract:

1. Sector number (1=Alpha, 2=Beta, 3=Gamma, etc.) - Look at the title "Sector X (Proposed)"
2. For each antenna column (look for "Antenna" row with numbers 1, 2, 3, etc.):
   - Antenna number
   - Antenna model (from "Antenna Model" row)
   - All active technologies from the "Active Tech" row in their ports (P1, P2, P3, P4, P5, P6)
   - Technologies are formatted like: L600, N600, L700, L1900, L2100, N1900, N2500, etc.
   - List ALL technologies found in all ports for each antenna

IMPORTANT: 
- List technologies in the order they appear from left to right across the ports
- Include every technology shown, even if repeated
- Technologies use format: [Letter][Frequency] where Letter is L (LTE), N (5G), U (UMTS), G (GSM)

Return ONLY valid JSON in this exact format:
{
  "sector": 1,
  "antennas": [
    {
      "number": 1,
      "model": "FFFHH-65C-R3 (Octo)",
      "technologies": ["L600", "N600", "L700", "L1900", "L2100", "N1900"]
    },
    {
      "number": 2,
      "model": "AIR_6419_B41",
      "technologies": ["N2500"]
    }
  ]
}`
                }
              ]
            }
          ]
        })
      });

      const data = await response.json();
      const textContent = data.content.find(item => item.type === "text");
      
      if (textContent) {
        const cleanText = textContent.text.replace(/```json|```/g, '').trim();
        const jsonMatch = cleanText.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          return JSON.parse(jsonMatch[0]);
        }
      }
      
      throw new Error("Could not parse RFDS data");
    } catch (error) {
      console.error("Analysis error:", error);
      throw error;
    }
  };

  const generateCableColors = (sector, technologies, cableNumber) => {
    const colors = [];
    
    // Add sector colors based on cable number
    // Cable 1: 1 sector color, Cable 2: 2 sector colors, Cable 3: 3 sector colors, Cable 4: 4 sector colors
    const sectorColor = SECTOR_COLORS[sector.toString()] || '#808080';
    for (let i = 0; i < cableNumber; i++) {
      colors.push({ color: sectorColor, label: `Sector ${sector}` });
      // Add small spacing between sector colors (except after the last one)
      if (i < cableNumber - 1) {
        colors.push({ color: SPACING_COLOR, label: 'Small Spacing', isSpacing: true, isSmall: true });
      }
    }
    
    // Add WIDE spacing after all sector colors
    colors.push({ color: SPACING_COLOR, label: 'Wide Spacing', isSpacing: true, isWide: true });
    
    // Track used frequencies and technologies to avoid repetition
    const usedFrequencies = new Set();
    const usedTechnologies = new Set();
    
    // Collect unique frequencies first
    const uniqueFrequencies = [];
    technologies.forEach((tech) => {
      const parsed = parseRFDSTechnology(tech);
      if (parsed && !usedFrequencies.has(parsed.frequency)) {
        uniqueFrequencies.push(parsed);
        usedFrequencies.add(parsed.frequency);
      }
    });
    
    // Add frequency colors
    uniqueFrequencies.forEach((parsed, index) => {
      const freqColor = FREQUENCY_COLORS[parsed.frequency] || '#808080';
      colors.push({ color: freqColor, label: `${parsed.frequency}MHz`, type: 'frequency' });
      // Add small spacing between frequencies (except after the last one)
      if (index < uniqueFrequencies.length - 1) {
        colors.push({ color: SPACING_COLOR, label: 'Small Spacing', isSpacing: true, isSmall: true });
      }
    });
    
    // Add WIDE spacing between frequencies and technologies
    if (uniqueFrequencies.length > 0) {
      colors.push({ color: SPACING_COLOR, label: 'Wide Spacing', isSpacing: true, isWide: true });
    }
    
    // Collect unique technologies
    const uniqueTechnologies = [];
    technologies.forEach((tech) => {
      const parsed = parseRFDSTechnology(tech);
      if (parsed && !usedTechnologies.has(parsed.technology)) {
        uniqueTechnologies.push(parsed);
        usedTechnologies.add(parsed.technology);
      }
    });
    
    // Add technology colors
    uniqueTechnologies.forEach((parsed, index) => {
      const techColor = TECHNOLOGY_COLORS[parsed.technology] || '#808080';
      colors.push({ color: techColor, label: parsed.technology, type: 'technology' });
      // Add small spacing between technologies (except after the last one)
      if (index < uniqueTechnologies.length - 1) {
        colors.push({ color: SPACING_COLOR, label: 'Small Spacing', isSpacing: true, isSmall: true });
      }
    });
    
    return colors;
  };

  const CableColumn = ({ cableNumber, sector, technologies, antennaModel, antennaNumber, bandType }) => {
    const colors = generateCableColors(sector, technologies, cableNumber);
    const smallSpacingHeight = 4;   // Small black line between same-type colors (reduced from 6)
    const wideSpacingHeight = 13;   // Wide black line between different sections (reduced from 18)
    const colorHeight = 56;          // Color band height (reduced from 80)
    
    return (
      <div className="flex flex-col items-center">
        <div className="bg-white rounded-lg shadow-lg p-3 w-24">
          <div className="text-center font-semibold text-gray-700 mb-2 text-xs">
            Cable {cableNumber}
          </div>
          <div className="border-2 border-black rounded-lg overflow-hidden">
            {colors.map((colorItem, idx) => {
              let height = colorHeight;
              if (colorItem.isSpacing) {
                height = colorItem.isWide ? wideSpacingHeight : (colorItem.isSmall ? smallSpacingHeight : smallSpacingHeight);
              }
              
              return (
                <div
                  key={idx}
                  style={{
                    backgroundColor: colorItem.color,
                    height: `${height}px`,
                    borderBottom: idx < colors.length - 1 ? '2px solid black' : 'none',
                    border: colorItem.color === '#FFFFFF' ? '1px solid #ccc' : 'none'
                  }}
                  className="w-full"
                  title={colorItem.label}
                />
              );
            })}
          </div>
          <div className="text-xs text-gray-600 mt-2 text-center break-words">
            Ant {antennaNumber}
            {bandType && <div className="text-xs text-blue-600 font-semibold">{bandType}</div>}
          </div>
        </div>
      </div>
    );
  };

  const SmallCableColumn = ({ cableNumber, sector, technologies, antennaModel, antennaNumber, bandType }) => {
    const colors = generateCableColors(sector, technologies, cableNumber);
    const smallSpacingHeight = 3;   // Extra small spacing
    const wideSpacingHeight = 9;    // Smaller wide spacing
    const colorHeight = 40;          // Smaller color height
    
    return (
      <div className="flex flex-col items-center">
        <div className="bg-white rounded-lg shadow-md p-2 w-16">
          <div className="text-center font-semibold text-gray-700 mb-1 text-xs">
            C{cableNumber}
          </div>
          <div className="border-2 border-black rounded-md overflow-hidden">
            {colors.map((colorItem, idx) => {
              let height = colorHeight;
              if (colorItem.isSpacing) {
                height = colorItem.isWide ? wideSpacingHeight : (colorItem.isSmall ? smallSpacingHeight : smallSpacingHeight);
              }
              
              return (
                <div
                  key={idx}
                  style={{
                    backgroundColor: colorItem.color,
                    height: `${height}px`,
                    borderBottom: idx < colors.length - 1 ? '1px solid black' : 'none',
                    border: colorItem.color === '#FFFFFF' ? '1px solid #ccc' : 'none'
                  }}
                  className="w-full"
                  title={colorItem.label}
                />
              );
            })}
          </div>
          <div className="text-xs text-gray-600 mt-1 text-center break-words leading-tight">
            {antennaNumber}
          </div>
        </div>
      </div>
    );
  };

  const ColorLegend = () => {
    return (
      <div className="bg-white rounded-lg shadow-lg p-6 max-w-4xl mx-auto mb-6">
        <h3 className="text-xl font-bold mb-4 text-gray-800">Color Code Legend</h3>
        
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          {/* Sector Colors */}
          <div>
            <h4 className="font-semibold text-gray-700 mb-2">Sector (1st Band)</h4>
            <div className="space-y-1">
              {Object.entries({
                'Alpha (1)': SECTOR_COLORS['1'],
                'Beta (2)': SECTOR_COLORS['2'],
                'Gamma (3)': SECTOR_COLORS['3'],
                'Delta (4)': SECTOR_COLORS['4'],
                'Epsilon (5)': SECTOR_COLORS['5'],
                'Zeta (6)': SECTOR_COLORS['6']
              }).map(([label, color]) => (
                <div key={label} className="flex items-center gap-2">
                  <div 
                    className="w-6 h-6 rounded border border-gray-300" 
                    style={{ 
                      backgroundColor: color,
                      border: color === '#FFFFFF' ? '1px solid #333' : '1px solid #ccc'
                    }}
                  />
                  <span className="text-sm">{label}</span>
                </div>
              ))}
            </div>
          </div>
          
          {/* Frequency Colors */}
          <div>
            <h4 className="font-semibold text-gray-700 mb-2">Frequency (2nd Band)</h4>
            <div className="space-y-1">
              {Object.entries({
                '600 MHz': FREQUENCY_COLORS['600'],
                '700 MHz': FREQUENCY_COLORS['700'],
                '1900 MHz': FREQUENCY_COLORS['1900'],
                '2100 MHz': FREQUENCY_COLORS['2100'],
                '2500 MHz': FREQUENCY_COLORS['2500'],
                'LAA-5GHz': FREQUENCY_COLORS['5000'],
                '28GHz': FREQUENCY_COLORS['28000'],
                '39GHz': FREQUENCY_COLORS['39000'],
                'AWS3': FREQUENCY_COLORS['AWS3']
              }).map(([label, color]) => (
                <div key={label} className="flex items-center gap-2">
                  <div 
                    className="w-6 h-6 rounded border border-gray-300" 
                    style={{ backgroundColor: color }}
                  />
                  <span className="text-sm">{label}</span>
                </div>
              ))}
            </div>
          </div>
          
          {/* Technology Colors */}
          <div>
            <h4 className="font-semibold text-gray-700 mb-2">Technology (3rd Band)</h4>
            <div className="space-y-1">
              {Object.entries({
                'GSM (G)': TECHNOLOGY_COLORS['G'],
                'UMTS (U)': TECHNOLOGY_COLORS['U'],
                'LTE (L)': TECHNOLOGY_COLORS['L'],
                '5G (N)': TECHNOLOGY_COLORS['N']
              }).map(([label, color]) => (
                <div key={label} className="flex items-center gap-2">
                  <div 
                    className="w-6 h-6 rounded border border-gray-300" 
                    style={{ backgroundColor: color }}
                  />
                  <span className="text-sm">{label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
        
        <div className="mt-4 pt-4 border-t border-gray-200">
          <h4 className="font-semibold text-gray-700 mb-2">Black Spacing Guide</h4>
          <div className="space-y-2">
            <div className="flex items-center gap-2">
              <div 
                className="w-6 h-2 rounded border border-gray-300" 
                style={{ backgroundColor: SPACING_COLOR }}
              />
              <span className="text-sm">Small spacing: Between same-type colors (sector-to-sector, frequency-to-frequency, tech-to-tech)</span>
            </div>
            <div className="flex items-center gap-2">
              <div 
                className="w-6 h-4 rounded border border-gray-300" 
                style={{ backgroundColor: SPACING_COLOR }}
              />
              <span className="text-sm font-semibold">Wide spacing: Between different sections (sectors → frequencies → technologies)</span>
            </div>
          </div>
        </div>
      </div>
    );
  };

  const downloadVisualization = () => {
    // Create a canvas to render the visualization
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    
    // Calculate total band groups
    let totalBandGroups = 0;
    extractedData.antennas.forEach(antenna => {
      totalBandGroups += splitAntennaByBand(antenna).length;
    });
    
    // Set canvas size based on number of band groups (4 cables per group) - reduced by 30%
    const totalCables = totalBandGroups * 4;
    canvas.width = Math.max(560, totalCables * 84 + 70);  // reduced from 800, 120, 100
    canvas.height = 560;  // reduced from 800
    
    // Draw white background
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Add title
    ctx.fillStyle = 'black';
    ctx.font = 'bold 14px Arial';  // reduced from 20px
    ctx.fillText(`Sector ${extractedData.sector} Cable Visualization`, 14, 28);  // reduced from 20, 40
    
    // Draw cables - reduced dimensions by 30%
    const cableWidth = 70;  // reduced from 100
    const cableSpacing = 84;  // reduced from 120
    const startX = 35;  // reduced from 50
    const startY = 56;  // reduced from 80
    const smallSpacingHeight = 4;  // reduced from 6
    const wideSpacingHeight = 13;  // reduced from 18
    
    let cableIndex = 0;
    extractedData.antennas.forEach((antenna) => {
      const bandGroups = splitAntennaByBand(antenna);
      
      bandGroups.forEach((bandGroup) => {
        // Draw 4 cables for each band group
        for (let cableNum = 1; cableNum <= 4; cableNum++) {
          const x = startX + (cableIndex * cableSpacing);
          const colors = generateCableColors(extractedData.sector, bandGroup.technologies, cableNum);
          
          // Draw cable label - reduced font sizes
          ctx.font = '10px Arial';  // reduced from 14px
          ctx.fillText(`Cable ${cableNum}`, x + 18, startY - 21);  // adjusted positions
          ctx.font = '8px Arial';  // reduced from 12px
          ctx.fillText(`Ant ${bandGroup.displayNumber}`, x + 18, startY - 8);  // adjusted positions
          if (bandGroup.bandType) {
            ctx.font = '7px Arial';  // reduced from 10px
            ctx.fillStyle = '#2563eb';
            ctx.fillText(bandGroup.bandType, x + 7, startY - 1);  // adjusted positions
            ctx.fillStyle = 'black';
          }
          
          let currentY = startY;
          colors.forEach(colorItem => {
            ctx.fillStyle = colorItem.color;
            let height = 42;  // reduced from 60
            if (colorItem.isSpacing) {
              height = colorItem.isWide ? wideSpacingHeight : (colorItem.isSmall ? smallSpacingHeight : smallSpacingHeight);
            }
            ctx.fillRect(x, currentY, cableWidth, height);
            
            // Draw border
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1.4;  // reduced from 2
            ctx.strokeRect(x, currentY, cableWidth, height);
            
            currentY += height;
          });
          
          cableIndex++;
        }
      });
    });
    
    // Download
    canvas.toBlob((blob) => {

                          <h5 className="font-semibold text-gray-800 mb-4 text-center">
                            Antenna {bandGroup.displayNumber}
                            {bandGroup.bandType && ` - ${bandGroup.bandType}`}
                          </h5>
                          
                          {/* Connection Diagram */}
                          <div className="flex flex-col items-center">
                            {/* Antenna Box */}
                            <div className="border-4 border-black bg-white p-8 rounded-lg w-full max-w-3xl">
                              <div className="text-center text-gray-800 font-bold mb-6 text-lg">
                                {bandGroup.model}
                              </div>
                            </div>
                            
                            {/* Cables below antenna - equal spacing for all */}
                            <div className="flex gap-3 mt-0 justify-center">
                              {cableNumbers.map((cableNum) => (
                                <CableColumn
                                  key={cableNum}
                                  cableNumber={cableNum}
                                  sector={extractedData.sector}
                                  technologies={bandGroup.technologies}
                                  antennaModel={bandGroup.model}
                                  antennaNumber={bandGroup.displayNumber}
                                  bandType=""
                                />
                              ))}
                            </div>
                            
                            <div className="mt-4 text-xs text-gray-600 text-center max-w-2xl">
                              <strong>Port Configuration:</strong> {cableCount} cable{cableCount > 1 ? 's' : ''} connected to antenna ports
                              {getAntennaType(bandGroup.model) === 'AIR' && ' (AIR/Massive MIMO antenna)'}
                              {getAntennaType(bandGroup.model) === 'QUAD' && ' - Quad antenna'}
                            </div>
                          </div>
                        </div>
                      );
                    });
                  }
                })}
              </div>
            </div>
          </div>
        )}

        {/* Instructions */}
        {!extractedData && !isProcessing && (
          <div className="bg-white rounded-lg shadow-lg p-6">
            <h3 className="text-xl font-bold mb-4 text-gray-800">How to Use</h3>
            <ol className="list-decimal list-inside space-y-2 text-gray-700">
              <li>Upload an RFDS screenshot or paste it directly (Ctrl+V / ⌘+V)</li>
              <li>The system will analyze the image and extract sector and antenna information</li>
              <li>Antennas with both low band (600, 700) and high band (1900+) will be split:
                <ul className="list-disc list-inside ml-6 mt-1">
                  <li>Low Band group → 4 cables labeled with "L" (e.g., Ant 1L)</li>
                  <li>High Band group → 4 cables labeled with "H" (e.g., Ant 1H)</li>
                </ul>
              </li>
              <li>4 cables generated per band group with sector color progression:
                <ul className="list-disc list-inside ml-6 mt-1">
                  <li>Cable 1: 1 sector color band</li>
                  <li>Cable 2: 2 sector color bands</li>
                  <li>Cable 3: 3 sector color bands</li>
                  <li>Cable 4: 4 sector color bands</li>
                </ul>
              </li>
              <li>Each cable shows unique frequencies and technologies (no repeats)</li>
              <li>Download as PNG image or HTML file for documentation</li>
            </ol>
          </div>
        )}
      </div>
    </div>
  );
};


ReactDOM.createRoot(document.getElementById('root')).render(<RFDSCableVisualizer />);
</script>
</body>
</html>
