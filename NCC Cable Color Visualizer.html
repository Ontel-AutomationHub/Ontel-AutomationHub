<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumper Cable Color Coding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-section label {
            display: block;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .input-section input {
            width: 200px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        .button-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .button-section h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .section-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .color-btn {
            padding: 15px;
            border: 3px solid transparent;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 3px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .color-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .color-btn:active {
            transform: translateY(-1px);
            box-shadow: 
                inset 0 1px 3px rgba(0, 0, 0, 0.3),
                0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .color-btn.selected {
            border-color: #000;
            box-shadow: 
                0 0 0 3px rgba(255, 255, 255, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-red { background: #e74c3c; }
        .btn-green { background: #27ae60; }
        .btn-blue { background: #2D7EFF; }
        .btn-yellow { background: #F5F500; color: #333; text-shadow: none; }
        .btn-white { background: #ecf0f1; color: #333; border: 2px solid #bdc3c7; text-shadow: none; }
        .btn-purple { background: #9b59b6; }
        .btn-brown { background: #8b4513; }
        .btn-orange { background: #e67e22; }
        .btn-pink { background: #ff69b4; }

        .results-section {
            margin-top: 30px;
        }

        .cables-display {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .cable-card {
            width: 120px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .cable-header {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .cable-stripes-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #000;
            padding: 4px;
            border-radius: 8px;
        }

        .cable-stripe {
            height: 60px;
            display: block;
        }

        .cable-stripe.sector {
            border-radius: 4px 4px 0 0;
        }

        .cable-stripe.frequency {
            margin-top: 25px;
        }

        .cable-stripe.technology {
            margin-top: 25px;
            border-radius: 0 0 4px 4px;
        }

        .generate-btn {
            width: 100%;
            max-width: 300px;
            padding: 18px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .generate-btn:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .generate-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            width: 100%;
            max-width: 300px;
            padding: 18px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px auto;
            max-width: 650px;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
        }

        .selected-count {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 Jumper Cable Color Coding Tool</h1>
        <p class="subtitle">Configure your cable color sequence</p>

        <div class="input-section">
            <label for="cableCount">Number of Jumper Cables:</label>
            <input type="number" id="cableCount" min="1" max="20" value="1" placeholder="Enter number">
            <p class="error-message" id="errorMsg" style="display: none;"></p>
        </div>

        <div class="button-section">
            <h2>Sector <span class="selected-count" id="sectorCount">0 selected</span></h2>
            <p class="section-subtitle">Select one sector (or LMU + one sector)</p>
            <div class="button-grid">
                <button class="color-btn btn-red" data-category="sector" data-value="A" data-color="#e74c3c">A - Red</button>
                <button class="color-btn btn-green" data-category="sector" data-value="B" data-color="#27ae60">B - Green</button>
                <button class="color-btn btn-blue" data-category="sector" data-value="C" data-color="#2D7EFF">C - Blue</button>
                <button class="color-btn btn-yellow" data-category="sector" data-value="D" data-color="#F5F500">D - Yellow</button>
                <button class="color-btn btn-white" data-category="sector" data-value="E" data-color="#ecf0f1">E - White</button>
                <button class="color-btn btn-purple" data-category="sector" data-value="F" data-color="#9b59b6">F - Purple</button>
                <button class="color-btn btn-brown" data-category="sector" data-value="LMU" data-color="#8b4513">LMU - Brown</button>
            </div>
        </div>

        <div class="button-section">
            <h2>Frequency <span class="selected-count" id="frequencyCount">0 selected</span></h2>
            <p class="section-subtitle">Select multiple (no repeats)</p>
            <div class="button-grid">
                <button class="color-btn btn-brown" data-category="frequency" data-value="2.5Ghz" data-color="#8b4513">2.5Ghz - Brown</button>
                <button class="color-btn btn-red" data-category="frequency" data-value="39Ghz" data-color="#e74c3c">39Ghz - Red</button>
                <button class="color-btn btn-blue" data-category="frequency" data-value="28Ghz" data-color="#2D7EFF">28Ghz - Blue</button>
                <button class="color-btn btn-purple" data-category="frequency" data-value="LAA-5Ghz" data-color="#9b59b6">LAA-5Ghz - Purple</button>
                <button class="color-btn btn-yellow" data-category="frequency" data-value="2500" data-color="#F5F500">2500 - Yellow</button>
                <button class="color-btn btn-green" data-category="frequency" data-value="2100" data-color="#27ae60">2100 - Green</button>
                <button class="color-btn btn-orange" data-category="frequency" data-value="1900" data-color="#e67e22">1900 - Orange</button>
                <button class="color-btn btn-white" data-category="frequency" data-value="700" data-color="#ecf0f1">700 - White</button>
                <button class="color-btn btn-pink" data-category="frequency" data-value="600" data-color="#ff69b4">600 - Pink</button>
            </div>
        </div>

        <div class="button-section">
            <h2>Technology <span class="selected-count" id="technologyCount">0 selected</span></h2>
            <p class="section-subtitle">Select multiple (no repeats)</p>
            <div class="button-grid">
                <button class="color-btn btn-pink" data-category="technology" data-value="NR" data-color="#ff69b4">NR - Pink</button>
                <button class="color-btn btn-orange" data-category="technology" data-value="LTE" data-color="#e67e22">LTE - Orange</button>
                <button class="color-btn btn-blue" data-category="technology" data-value="UMTS" data-color="#2D7EFF">UMTS - Blue</button>
                <button class="color-btn btn-white" data-category="technology" data-value="GSM" data-color="#ecf0f1">GSM - White</button>
            </div>
        </div>

        <div class="button-group">
            <button class="generate-btn" id="generateBtn">Generate Cable Coding</button>
            <button class="clear-btn" id="clearBtn">Clear Selections</button>
        </div>

        <div class="results-section">
            <div class="cables-display" id="cablesDisplay"></div>
        </div>
    </div>

    <script>
        const frequencyOrder = ['2.5Ghz', '39Ghz', '28Ghz', 'LAA-5Ghz', '2500', '2100', '1900', '700', '600'];
        const technologyOrder = ['NR', 'LTE', 'UMTS', 'GSM'];

        let selections = {
            sector: [],
            frequency: [],
            technology: []
        };

        const buttons = document.querySelectorAll('.color-btn');
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const cablesDisplay = document.getElementById('cablesDisplay');
        const cableCountInput = document.getElementById('cableCount');
        const errorMsg = document.getElementById('errorMsg');

        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                const category = this.dataset.category;
                const value = this.dataset.value;
                const color = this.dataset.color;
                const item = { value, color };

                if (category === 'sector') {
                    const isLMU = value === 'LMU';
                    const hasLMU = selections.sector.some(s => s.value === 'LMU');
                    
                    if (this.classList.contains('selected')) {
                        this.classList.remove('selected');
                        selections.sector = selections.sector.filter(s => s.value !== value);
                    } else {
                        if (isLMU) {
                            if (selections.sector.length === 0 || hasLMU) {
                                document.querySelectorAll(`[data-category="sector"]`).forEach(b => {
                                    if (b.dataset.value === 'LMU') b.classList.remove('selected');
                                });
                                this.classList.add('selected');
                                selections.sector = selections.sector.filter(s => s.value !== 'LMU');
                                selections.sector.unshift(item);
                            } else {
                                this.classList.add('selected');
                                selections.sector.unshift(item);
                            }
                        } else {
                            if (hasLMU) {
                                document.querySelectorAll(`[data-category="sector"]`).forEach(b => {
                                    if (b.dataset.value !== 'LMU') b.classList.remove('selected');
                                });
                                this.classList.add('selected');
                                selections.sector = selections.sector.filter(s => s.value === 'LMU');
                                selections.sector.push(item);
                            } else {
                                document.querySelectorAll(`[data-category="sector"]`).forEach(b => {
                                    b.classList.remove('selected');
                                });
                                this.classList.add('selected');
                                selections.sector = [item];
                            }
                        }
                    }
                    document.getElementById('sectorCount').textContent = `${selections.sector.length} selected`;
                } else {
                    if (this.classList.contains('selected')) {
                        this.classList.remove('selected');
                        selections[category] = selections[category].filter(s => s.value !== value);
                    } else {
                        this.classList.add('selected');
                        selections[category].push(item);
                    }
                    document.getElementById(category + 'Count').textContent = `${selections[category].length} selected`;
                }
            });
        });

        generateBtn.addEventListener('click', generateCables);
        clearBtn.addEventListener('click', clearSelections);

        function clearSelections() {
            selections = { sector: [], frequency: [], technology: [] };
            buttons.forEach(btn => { btn.classList.remove('selected'); });
            document.getElementById('sectorCount').textContent = '0 selected';
            document.getElementById('frequencyCount').textContent = '0 selected';
            document.getElementById('technologyCount').textContent = '0 selected';
            cablesDisplay.innerHTML = '';
            errorMsg.style.display = 'none';
        }

        function generateCables() {
            const count = parseInt(cableCountInput.value);
            
            if (!count || count < 1) {
                errorMsg.textContent = 'Please enter a valid number of cables';
                errorMsg.style.display = 'block';
                return;
            }
            if (count > 20) {
                errorMsg.textContent = 'Maximum 20 cables allowed';
                errorMsg.style.display = 'block';
                return;
            }
            if (selections.sector.length === 0) {
                errorMsg.textContent = 'Please select at least one Sector';
                errorMsg.style.display = 'block';
                return;
            }
            if (selections.frequency.length === 0) {
                errorMsg.textContent = 'Please select at least one Frequency';
                errorMsg.style.display = 'block';
                return;
            }
            if (selections.technology.length === 0) {
                errorMsg.textContent = 'Please select at least one Technology';
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            cablesDisplay.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                const card = document.createElement('div');
                card.className = 'cable-card';
                
                const header = document.createElement('div');
                header.className = 'cable-header';
                header.textContent = `Cable ${i}`;
                
                const stripesContainer = document.createElement('div');
                stripesContainer.className = 'cable-stripes-container';
                
                const hasLMU = selections.sector.some(s => s.value === 'LMU');
                
                if (hasLMU && selections.sector.length === 2) {
                    const lmu = selections.sector.find(s => s.value === 'LMU');
                    const otherSector = selections.sector.find(s => s.value !== 'LMU');
                    
                    const lmuStripe = createStripe(lmu, 'sector');
                    stripesContainer.appendChild(lmuStripe);
                    
                    for (let j = 0; j < i; j++) {
                        const sectorStripe = createStripe(otherSector, '');
                        stripesContainer.appendChild(sectorStripe);
                    }
                } else {
                    const mainSector = selections.sector[selections.sector.length - 1];
                    for (let j = 0; j < i; j++) {
                        const sectorStripe = createStripe(mainSector, j === 0 ? 'sector' : '');
                        stripesContainer.appendChild(sectorStripe);
                    }
                }
                
                const sortedFrequencies = [...selections.frequency].sort((a, b) => {
                    return frequencyOrder.indexOf(a.value) - frequencyOrder.indexOf(b.value);
                });
                sortedFrequencies.forEach((freq, index) => {
                    const freqStripe = createStripe(freq, index === 0 ? 'frequency' : '');
                    stripesContainer.appendChild(freqStripe);
                });
                
                const sortedTechnologies = [...selections.technology].sort((a, b) => {
                    return technologyOrder.indexOf(a.value) - technologyOrder.indexOf(b.value);
                });
                sortedTechnologies.forEach((tech, index) => {
                    const techStripe = createStripe(tech, index === 0 ? 'technology' : '');
                    stripesContainer.appendChild(techStripe);
                });
                
                card.appendChild(header);
                card.appendChild(stripesContainer);
                cablesDisplay.appendChild(card);
            }
        }

        function createStripe(selection, category) {
            const stripe = document.createElement('div');
            stripe.className = `cable-stripe ${category}`;
            stripe.style.backgroundColor = selection.color;
            return stripe;
        }
    </script>
</body>
</html>
