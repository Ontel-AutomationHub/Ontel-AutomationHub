<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redline Notes Generator (Image upload)</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;


function Hexagon({ number, size = 36 }) {
  const h = size, w = size * 1.1547;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ flexShrink: 0 }}>
      <polygon
        points={`${w/2},0 ${w},${h/4} ${w},${h*3/4} ${w/2},${h} 0,${h*3/4} 0,${h/4}`}
        fill="none" stroke="#dc2626" strokeWidth="2"
      />
      <text x={w/2} y={h/2+1} textAnchor="middle" dominantBaseline="middle" fontSize="13" fontWeight="bold" fill="#dc2626">
        {number}
      </text>
    </svg>
  );
}

function Badge({ type }) {
  const c = {
    full: { bg: "#fef2f2", text: "#dc2626", border: "#fecaca", label: "Full Red" },
    partial: { bg: "#eff6ff", text: "#2563eb", border: "#bfdbfe", label: "Red Partial" },
    remove: { bg: "#fefce8", text: "#ca8a04", border: "#fde68a", label: "Strikethrough" },
  }[type];
  return (
    <span style={{
      fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 9999,
      background: c.bg, color: c.text, border: `1px solid ${c.border}`,
    }}>{c.label}</span>
  );
}

function Spinner() {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: 40, gap: 16 }}>
      <div style={{
        width: 40, height: 40, border: "4px solid #e5e7eb", borderTopColor: "#6366f1",
        borderRadius: "50%", animation: "spin 0.8s linear infinite",
      }} />
      <div style={{ color: "#6366f1", fontWeight: 600, fontSize: 14 }}>Extracting red text from image...</div>
      <div style={{ color: "#9ca3af", fontSize: 12 }}>Analyzing callouts with AI</div>
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

function App() {
  const [entries, setEntries] = useState([]);
  const [editIdx, setEditIdx] = useState(null);
  const [editText, setEditText] = useState("");
  const [newCallout, setNewCallout] = useState("");
  const [newText, setNewText] = useState("");
  const [newType, setNewType] = useState("partial");
  const [showAdd, setShowAdd] = useState(false);
  const [copiedEntries, setCopiedEntries] = useState(false);
  const [copiedOutput, setCopiedOutput] = useState(false);
  const [imagePreview, setImagePreview] = useState(null);
  const [imageBase64, setImageBase64] = useState(null);
  const [pasteActive, setPasteActive] = useState(false);
  const [extracting, setExtracting] = useState(false);
  const [error, setError] = useState(null);
  const pasteRef = useRef();

  useEffect(() => {
    const handler = (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.startsWith("image/")) {
          e.preventDefault();
          const blob = items[i].getAsFile();
          const reader = new FileReader();
          reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            setImagePreview(dataUrl);
            const b64 = dataUrl.split(",")[1];
            setImageBase64(b64);
            setEntries([]);
            setError(null);
          };
          reader.readAsDataURL(blob);
          break;
        }
      }
    };
    window.addEventListener("paste", handler);
    return () => window.removeEventListener("paste", handler);
  }, []);

  const extractRedText = async () => {
    if (!imageBase64) return;
    setExtracting(true);
    setError(null);
    setEntries([]);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              {
                type: "image",
                source: { type: "base64", media_type: "image/png", data: imageBase64 }
              },
              {
                type: "text",
                text: `Analyze this image of engineering/construction callouts. Each callout is numbered — the number appears inside a hexagon or circle shape. ALL numbers inside hexagons or circles are Callout numbers.

Your task: For each callout, identify ONLY the RED colored text. Ignore all black text.

Rules:
- If a callout's text is ENTIRELY red (like "ADDED IN SHEET 5"), output type "full" with the full red text.
- If a callout has a MIX of black and red text, output type "partial" with ONLY the red portion. Red portions are typically: station numbers (e.g. "7+13", "1+34", "8+74", "10+35"), PDB distances (e.g. "161'", "83'", "106'", "281'"), or other highlighted values.
- If an entire callout line has red strikethrough text (crossed out / line through it), output type "remove".
- Skip callouts that have NO red text at all (entirely black text).
- Make sure to check EVERY callout number (every hexagon/circle) in the image from top to bottom.

Respond ONLY with a JSON array, no other text, no markdown backticks. Each object must have:
{"callout": <number>, "type": "<full|partial|remove>", "text": "<red text or empty for remove>"}

Example:
[{"callout":1,"type":"full","text":"ADDED IN SHEET 5"},{"callout":2,"type":"partial","text":"1+34"},{"callout":5,"type":"partial","text":"83'"},{"callout":14,"type":"remove","text":""}]`
              }
            ]
          }]
        })
      });
      const data = await res.json();
      const txt = data.content?.map(b => b.text || "").join("") || "";
      const clean = txt.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      if (Array.isArray(parsed)) {
        setEntries(parsed.sort((a, b) => a.callout - b.callout));
      } else {
        setError("Unexpected response format. Please try again.");
      }
    } catch (err) {
      console.error(err);
      setError("Extraction failed: " + err.message);
    } finally {
      setExtracting(false);
    }
  };

  const handleEdit = (i) => { setEditIdx(i); setEditText(entries[i].text); };
  const saveEdit = (i) => {
    const u = [...entries]; u[i] = { ...u[i], text: editText };
    setEntries(u); setEditIdx(null);
  };
  const handleDelete = (i) => setEntries(entries.filter((_, idx) => idx !== i));
  const handleAdd = () => {
    if (!newCallout) return;
    const entry = { callout: parseInt(newCallout), type: newType, text: newType === "remove" ? "" : newText };
    setEntries([...entries, entry].sort((a, b) => a.callout - b.callout));
    setNewCallout(""); setNewText(""); setNewType("partial"); setShowAdd(false);
  };

  const formatOutput = useCallback(() => {
    return entries.map(e => {
      if (e.type === "remove") return `Remove Callout ${e.callout}`;
      return `Callout ${e.callout}: ${e.text}`;
    }).join("\n");
  }, [entries]);

  const copyText = (setter) => {
    const text = formatOutput();
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setter(true);
      setTimeout(() => setter(false), 2000);
    } catch (err) {
      console.error("Copy failed:", err);
    }
  };

  const clearAll = () => {
    setImagePreview(null); setImageBase64(null);
    setEntries([]); setError(null);
  };

  const s = {
    inp: {
      padding: "6px 10px", borderRadius: 6, border: "1px solid #d1d5db",
      fontSize: 14, outline: "none", width: "100%", boxSizing: "border-box",
    },
    btn: (bg, color = "#fff") => ({
      padding: "6px 14px", borderRadius: 6, border: "none", background: bg,
      color, fontSize: 13, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap",
    }),
  };

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #f8fafc 0%, #ede9fe 100%)", padding: 20, fontFamily: "'Segoe UI', system-ui, sans-serif" }}>
      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        {/* Header */}
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          <h1 style={{ fontSize: 24, fontWeight: 700, color: "#1e1b4b", margin: 0 }}>🔴 FTTH Redline Callout Extractor</h1>
          <p style={{ color: "#6b7280", fontSize: 14, marginTop: 4 }}>
            Use the Snip Tool, then paste the photo here—one column at a time. You may add, edit, or remove any callout.
          </p>
        </div>

        {/* Paste Image Area */}
        <div style={{
          background: "#fff", borderRadius: 12, padding: 16, marginBottom: 16,
          border: "1px solid #e5e7eb", boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
            <span style={{ fontWeight: 600, fontSize: 14, color: "#374151" }}>🔎 Source Image</span>
            <div style={{ display: "flex", gap: 8 }}>
              {imagePreview && !extracting && (
                <>
                  <button
                    style={{
                      ...s.btn("#6366f1"),
                      padding: "8px 20px", fontSize: 14,
                      boxShadow: "0 2px 8px rgba(99,102,241,0.3)",
                    }}
                    onClick={extractRedText}
                  >
                    🔍 Extract Red Text
                  </button>
                  <button style={s.btn("#ef4444")} onClick={clearAll}>Clear</button>
                </>
              )}
            </div>
          </div>
          {imagePreview ? (
            <div style={{ borderRadius: 8, overflow: "hidden", border: "1px solid #e5e7eb", maxHeight: 350, overflowY: "auto" }}>
              <img src={imagePreview} alt="Source" style={{ width: "100%", display: "block" }} />
            </div>
          ) : (
            <div
              tabIndex={0} ref={pasteRef}
              onFocus={() => setPasteActive(true)}
              onBlur={() => setPasteActive(false)}
              onClick={() => pasteRef.current?.focus()}
              style={{
                border: `2px dashed ${pasteActive ? "#6366f1" : "#d1d5db"}`,
                borderRadius: 8, padding: 40, textAlign: "center",
                color: pasteActive ? "#6366f1" : "#9ca3af", fontSize: 14,
                cursor: "pointer", transition: "all 0.2s",
                background: pasteActive ? "#eef2ff" : "transparent",
              }}
            >
              <div style={{ fontSize: 32, marginBottom: 8 }}>📋</div>
              <div style={{ fontWeight: 600 }}>Click here and press Ctrl+V / ⌘+V to paste an image</div>
              <div style={{ fontSize: 12, marginTop: 4, color: "#9ca3af" }}>Screenshots work great!</div>
            </div>
          )}
        </div>

        {/* Extracting Spinner */}
        {extracting && (
          <div style={{
            background: "#fff", borderRadius: 12, padding: 0, marginBottom: 16,
            border: "1px solid #e5e7eb", boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
          }}>
            <Spinner />
          </div>
        )}

        {/* Error */}
        {error && (
          <div style={{
            background: "#fef2f2", borderRadius: 12, padding: 14, marginBottom: 16,
            border: "1px solid #fecaca", color: "#dc2626", fontSize: 13, fontWeight: 500,
          }}>
            ⚠️ {error}
          </div>
        )}

        {/* Results */}
        {entries.length > 0 && (
          <>
            <div style={{
              background: "#fff", borderRadius: 12, padding: 16, marginBottom: 16,
              border: "1px solid #e5e7eb", boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
            }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <span style={{ fontWeight: 600, fontSize: 14, color: "#374151" }}>
                  📋 Extracted Callouts ({entries.length})
                </span>
                <div style={{ display: "flex", gap: 8 }}>
                  <button style={s.btn("#10b981")} onClick={() => setShowAdd(!showAdd)}>
                    {showAdd ? "Cancel" : "+ Add"}
                  </button>
                  <button style={s.btn("#3b82f6")} onClick={() => copyText(setCopiedEntries)}>
                    {copiedEntries ? "✓ Copied!" : "📋 Copy Text"}
                  </button>
                </div>
              </div>

              {showAdd && (
                <div style={{
                  background: "#f9fafb", borderRadius: 8, padding: 12, marginBottom: 12,
                  border: "1px solid #e5e7eb", display: "flex", gap: 8, alignItems: "flex-end", flexWrap: "wrap",
                }}>
                  <div style={{ width: 70 }}>
                    <label style={{ fontSize: 11, color: "#6b7280", fontWeight: 600 }}>Callout #</label>
                    <input style={s.inp} type="number" value={newCallout} onChange={e => setNewCallout(e.target.value)} />
                  </div>
                  <div style={{ flex: 1, minWidth: 120 }}>
                    <label style={{ fontSize: 11, color: "#6b7280", fontWeight: 600 }}>Red Text</label>
                    <input style={s.inp} value={newText} onChange={e => setNewText(e.target.value)} placeholder="e.g. 7+13" disabled={newType === "remove"} />
                  </div>
                  <div style={{ width: 130 }}>
                    <label style={{ fontSize: 11, color: "#6b7280", fontWeight: 600 }}>Type</label>
                    <select style={{ ...s.inp, cursor: "pointer" }} value={newType} onChange={e => setNewType(e.target.value)}>
                      <option value="partial">Red Partial</option>
                      <option value="full">Full Red</option>
                      <option value="remove">Strikethrough</option>
                    </select>
                  </div>
                  <button style={s.btn("#6366f1")} onClick={handleAdd}>Add</button>
                </div>
              )}

              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {entries.map((e, i) => (
                  <div key={i} style={{
                    display: "flex", alignItems: "center", gap: 10, padding: "8px 12px",
                    borderRadius: 8, background: editIdx === i ? "#eff6ff" : "#fafafa",
                    border: `1px solid ${editIdx === i ? "#93c5fd" : "#f3f4f6"}`,
                    transition: "all 0.15s",
                  }}>
                    <Hexagon number={e.callout} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      {editIdx === i ? (
                        <div style={{ display: "flex", gap: 6 }}>
                          <input style={{ ...s.inp, flex: 1 }} value={editText} onChange={ev => setEditText(ev.target.value)}
                            onKeyDown={ev => ev.key === "Enter" && saveEdit(i)} autoFocus />
                          <button style={s.btn("#10b981")} onClick={() => saveEdit(i)}>Save</button>
                          <button style={s.btn("#9ca3af")} onClick={() => setEditIdx(null)}>✕</button>
                        </div>
                      ) : (
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          {e.type === "remove" ? (
                            <span style={{ fontSize: 14, fontWeight: 600, color: "#ca8a04", textDecoration: "line-through" }}>
                              Remove Callout {e.callout}
                            </span>
                          ) : (
                            <span style={{ fontSize: 14, fontWeight: 500, color: e.type === "full" ? "#dc2626" : "#1f2937" }}>
                              {e.type === "full" ? e.text : <>Callout {e.callout}: <span style={{ color: "#dc2626", fontWeight: 700 }}>{e.text}</span></>}
                            </span>
                          )}
                          <Badge type={e.type} />
                        </div>
                      )}
                    </div>
                    {editIdx !== i && (
                      <div style={{ display: "flex", gap: 4 }}>
                        <button style={{ ...s.btn("transparent", "#6b7280"), padding: "4px 8px", fontSize: 16 }}
                          onClick={() => handleEdit(i)} title="Edit">✏️</button>
                        <button style={{ ...s.btn("transparent", "#ef4444"), padding: "4px 8px", fontSize: 16 }}
                          onClick={() => handleDelete(i)} title="Delete">🗑️</button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {/* Text Output */}
            <div style={{
              background: "#fff", borderRadius: 12, padding: 16,
              border: "1px solid #e5e7eb", boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
            }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                <span style={{ fontWeight: 600, fontSize: 14, color: "#374151" }}>📄 Text Output</span>
                <button style={s.btn("#3b82f6")} onClick={() => copyText(setCopiedOutput)}>
                  {copiedOutput ? "✓ Copied!" : "📋 Copy Text"}
                </button>
              </div>
              <pre style={{
                margin: 0, padding: 12, background: "#1e1b4b", color: "#c4b5fd",
                borderRadius: 8, fontSize: 13, lineHeight: 1.7, overflowX: "auto", whiteSpace: "pre-wrap",
              }}>
                {formatOutput()}
              </pre>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
