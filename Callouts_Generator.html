          // not just sheetObj.rows which is only the first sub-sheet's data.
          const rowsKey = annotateTableSource === 'redlined' ? 'redlinedRows' : 'rows';
          const syntheticSheet = { ...sheetObj, rows, redlinedRows: rows };
          const sheetSummary = computeSummary([syntheticSheet], rowsKey).sheetStats[0];

          // Total UG footage = all bore codes + TCMB7
          const totalUG = Object.values(sheetSummary.footage).reduce((a,b)=>a+b,0);

          // Build summary text lines
          const sumLines = [];
          sumLines.push('Bore Callouts:');
          const boreEntries = Object.entries(sheetSummary.footage).sort(([a],[b])=>a.localeCompare(b));
          if (boreEntries.length) boreEntries.forEach(([code,ft]) => sumLines.push(`${code}: ${ft.toLocaleString()}'`));
          // TCMB7 at the end
          if (sheetSummary.tcmb7 > 0) sumLines.push(`TCMB7: ${sheetSummary.tcmb7.toLocaleString()}'`);
          if (!boreEntries.length && !sheetSummary.tcmb7) sumLines.push('—');
          sumLines.push('');
          sumLines.push('Equipment Callouts:');
          const equipPairs = [
            ['FDH / Swing Arm (default)', 'TCMU4A', sheetSummary.fdh, sheetSummary.equipCodes['TCMU4A']],
            ['FDH/OLT - Vault Mounted', 'TCMU1', null, sheetSummary.equipCodes['TCMU1']],
            ['FDH/OLT - Pole Mounted', 'TCMU2', null, sheetSummary.equipCodes['TCMU2']],
            ['FDH/OLT - Wall / Rack Mounted', 'TCMU3', null, sheetSummary.equipCodes['TCMU3']],
            ['FDH/OLT - Vault / Sub Surface', 'TCMU4', null, sheetSummary.equipCodes['TCMU4']],
            ['FDT - Vault Mounted-FlexNap', 'TCMU5', null, sheetSummary.equipCodes['TCMU5']],
            ['FDT - Pole Mounted-FlexNap', 'TCMU6', null, sheetSummary.equipCodes['TCMU6']],
            ['FDT - Wall / Rack Mounted-FlexNap', 'TCMU7', null, sheetSummary.equipCodes['TCMU7']],
            ['FDT - Vault / Sub Surface-FlexNap', 'TCMU8', null, sheetSummary.equipCodes['TCMU8']],
            ['FDT - Building (SFU/MDU/MTU)', 'TCMU9', null, sheetSummary.equipCodes['TCMU9']],
            ['HH (24"x36"x24") (default)', 'TCMB3C', sheetSummary.hh, sheetSummary.equipCodes['TCMB3C']],

            ['HH (17"x30"x24")', 'TCMB3B', null, sheetSummary.equipCodes['TCMB3B']],
            ['HH (13"x24"x18")', 'TCMB3A', null, sheetSummary.equipCodes['TCMB3A']],

          equipPairs.forEach(([label, code, countVal, codeQty]) => {

          });

          // Summary box is taller to fit content — double height
          const sumBoxW = 100;
          const sumBoxH = 100;
          const totalBoxes = rows.length;
          const lastCol  = Math.floor((totalBoxes - 1) / maxRows);
          const lastRowI = (totalBoxes - 1) % maxRows;
          // Place summary in next slot after last regular box
          const nextI    = totalBoxes;
          const sCol     = Math.floor(nextI / maxRows);
          const sRowI    = nextI % maxRows;
          const svx  = gridL + sCol  * (boxW + gapX);
          const svyT = gridT + sRowI * (boxH + gapY);

          const fc = [1, 1, 0]; // yellow fill (255,255,0) — matches DAP style
          const ap = buildAppearance(sumLines, sumBoxW, sumBoxH, fc, pageRot);
          const apStream = ctx.stream(ap, {
            Type: 'XObject', Subtype: 'Form', FormType: 1,
            BBox: [0, 0, sumBoxW, sumBoxH], Resources: fontRes,
          });
          const apRef = ctx.register(apStream);

          const corners = [
            visToPdf(svx,          svyT),
            visToPdf(svx+sumBoxW,  svyT),
            visToPdf(svx,          svyT+sumBoxH),
            visToPdf(svx+sumBoxW,  svyT+sumBoxH),
          ];
          const xs = corners.map(c=>c[0]), ys = corners.map(c=>c[1]);
          const [r,g,b] = fc;
          const annotDict = ctx.obj({
            Type:    'Annot', Subtype: 'FreeText',
            Rect:    [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)],
            Contents: PDFString.of(sumLines.join('\n')),
            Rotate:  pageRot,
            DA:      PDFString.of('/F1 6 Tf 1 0 0 rg'),
            DS:      PDFString.of(`font: Helvetica,sans-serif 6pt; color: #ff0000; background-color: rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`),
            IC:      fc, C: fc,
            BS:      ctx.obj({ W: 1, S: 'S' }),
            MK:      ctx.obj({ BG: ctx.obj(fc) }),
            F: 4, Q: 0,
            AP: ctx.obj({ N: apRef }),
          });
          annotsArray.push(ctx.register(annotDict));
          totalPlaced++;
        })();
      }

      if (totalPlaced === 0) throw new Error('No annotations placed — check sheet/page mapping.');

      // ── Global summary box on Page 1 (always, regardless of whether it has callouts) ──
      (() => {
        const page1 = pages[0];
        if (!page1) return;

        const { width: RW, height: RH } = page1.getSize();
        const pageRot = page1.getRotation()?.angle ?? 0;
        const swapped = pageRot === 90 || pageRot === 270;
        const VW = swapped ? RH : RW;
        const VH = swapped ? RW : RH;

        const visToPdf = (vx, vy) => {
          if (pageRot === 0)   return [vx,       RH - vy];
          if (pageRot === 90)  return [RW - vy,  vx];
          if (pageRot === 180) return [RW - vx,  vy];
          /* 270 */            return [vy,        RH - vx];
        };

        const pageNode = page1.node;
        let annotsArray = pageNode.lookupMaybe(PDFName.of('Annots'), PDFArray);
        if (!annotsArray) {
          annotsArray = ctx.obj([]);
          pageNode.set(PDFName.of('Annots'), annotsArray);
        }

        // Use all sheets for grand total (respecting annotateTableSource)
        const { total: grandTotal } = computeSummary(sheets, annotateTableSource === 'redlined' ? 'redlinedRows' : 'rows');
        const totalUG = Object.values(grandTotal.footage).reduce((a,b)=>a+b,0);

        const sumLines = [];
        sumLines.push(`Total UG Footage: ${totalUG > 0 ? totalUG.toLocaleString()+"'" : "—"}`);
        sumLines.push('');
        sumLines.push('Bore Callouts:');
        const boreEntries = Object.entries(grandTotal.footage).sort(([a],[b])=>a.localeCompare(b));
        if (boreEntries.length) boreEntries.forEach(([code,ft]) => sumLines.push(`${code}: ${ft.toLocaleString()}'`));
        // TCMB7 at the end
        if (grandTotal.tcmb7 > 0) sumLines.push(`TCMB7: ${grandTotal.tcmb7.toLocaleString()}'`);
        if (!boreEntries.length && !grandTotal.tcmb7) sumLines.push('—');
        sumLines.push('');
        sumLines.push('Equipment Callouts:');
        const equipPairs = [
          ['FDH / Swing Arm (default)', 'TCMU4A', grandTotal.fdh, grandTotal.equipCodes['TCMU4A']],
            ['FDH/OLT - Vault Mounted', 'TCMU1', null, grandTotal.equipCodes['TCMU1']],
            ['FDH/OLT - Pole Mounted', 'TCMU2', null, grandTotal.equipCodes['TCMU2']],
            ['FDH/OLT - Wall / Rack Mounted', 'TCMU3', null, grandTotal.equipCodes['TCMU3']],

            ['FDT - Pole Mounted-FlexNap', 'TCMU6', null, grandTotal.equipCodes['TCMU6']],
            ['FDT - Wall / Rack Mounted-FlexNap', 'TCMU7', null, grandTotal.equipCodes['TCMU7']],

        const ap = buildAppearance(sumLines, sumBoxW, sumBoxH, fc, pageRot);

        const apRef = ctx.register(apStream);

          visToPdf(svx,          svyT),
          visToPdf(svx+sumBoxW,  svyT),

      const xlsxSrc = annotateTableSource === 'redlined'
        ? sheets.map(s => ({ name: s.name, rows: s.redlinedRows || s.rows }))
        : sheets.map(s => ({ name: s.name, rows: s.rows }));
      const xlsxLabel = annotateTableSource === 'redlined' ? 'Redlined' : 'Proposed';
      const xlsxFileName = `${site} - ${xlsxLabel} Callouts.xlsx`;
      const xlsxBlob = buildXlsxBlob(xlsxSrc);

      const zipFileName = `${site} - Redlined Package.zip`;
      const zipBlob = await packZip([
        { name: pdfFileName,  data: new Uint8Array(await pdfBlob.arrayBuffer()) },

  // ── Manual Placement annotation ──
  const runCalloutAnnotation = async () => {
    const { allItems, siteName: sn, pageCache } = calloutModalRef.current;
    setCalloutModal(prev => ({ ...prev, saving: true, error: null }));
    try {
      if (!window.PDFLib) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
          s.onload = () => window.PDFLib ? res() : rej(new Error('PDFLib not defined'));
          s.onerror = () => rej(new Error('Failed to load pdf-lib'));
          document.head.appendChild(s);
        });
      }
      const { PDFDocument, PDFName, PDFArray, PDFString } = window.PDFLib;

      const pdfU8 = new Uint8Array(await annotatePdfRef.current.arrayBuffer());
      const pdfDoc = await PDFDocument.load(pdfU8, { ignoreEncryption: true });
      const ctx    = pdfDoc.context;
      const pages  = pdfDoc.getPages();

      // Fill color as [r,g,b] array (0-1 range) for AP stream
      const fillColor = (bt) => {
        if (/\bHH\b|\bFDH\b/i.test(bt||''))                                return [0, 1, 0];
        if (/\bDAP\b|\bTOBY\s*BOX\b/i.test(bt||''))                        return [0, 1, 1];
        if (/\bBORE\s*&\s*PLACE\b|\bMISSILE\s*&\s*PLACE\b/i.test(bt||'')) return [1, 1, 170/255];
        if (/\bHAND\s*DIG\b/i.test(bt||''))                                return [1, 191/255, 170/255];
        return [0.85, 0.85, 0.85];
      };

      // Shared font resource dict
      const fontRes = ctx.obj({
        Font: ctx.obj({
          F1: ctx.obj({ Type: 'Font', Subtype: 'Type1', BaseFont: 'Helvetica', Encoding: 'WinAnsiEncoding' }),
        })
      });

      // Build AP appearance stream (same as runPdfAnnotation)
      const buildAppearance = (lines, boxW, boxH, fc, pageRot) => {
        const [r,g,b] = fc;
        const pad=1, fontSize=6, lineH=7;
        const maxLinesInBox = Math.floor((boxH - pad * 2) / lineH);
        let cm = null;
        if      (pageRot === 90)  cm = `0 1 -1 0 ${boxH} 0`;
        else if (pageRot === 180) cm = `-1 0 0 -1 ${boxW} ${boxH}`;
        else if (pageRot === 270) cm = `0 -1 1 0 0 ${boxW}`;
        let ap = 'q\n';
        if (cm) ap += `${cm} cm\n`;
        ap += `${r.toFixed(4)} ${g.toFixed(4)} ${b.toFixed(4)} rg\n`;
        ap += `0 0 ${boxW.toFixed(2)} ${boxH.toFixed(2)} re f\n`;
        ap += `1 0 0 RG\n1 w\n`;
        ap += `0 0 ${boxW.toFixed(2)} ${boxH.toFixed(2)} re S\n`;
        ap += `BT\n1 0 0 rg\n`;
        let drawn = 0;
        lines.forEach((line) => {
          if (!line || drawn >= maxLinesInBox) return;
          const safe = line.substring(0,40).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
          const lx = pad;
          const ly = boxH - pad - (drawn + 1) * lineH + 2;
          if (ly < pad) return;
          ap += `/F1 ${fontSize} Tf\n`;
          ap += `1 0 0 1 ${lx.toFixed(2)} ${ly.toFixed(2)} Tm\n`;
          ap += `(${safe}) Tj\n`;
          drawn++;
        });
        ap += 'ET\nQ\n';
        return ap;
      };

      const placed = allItems.filter(it => it.placed && it.anchorX !== null);
      if (placed.length === 0) throw new Error('No items placed. Click on callout numbers first.');

      let totalPlaced = 0;

      for (const item of placed) {
        const sheetNum   = parseInt(item.sheetName?.match(/\d+/)?.[0] || '1');

        const page = pages[pdfPageIdx];
        if (!page) { console.warn('[callout] no page', pdfPageIdx); continue; }

        const { width: pageW, height: pageH } = page.getSize();

        const cached = pageCache[item.pageIdx];
        if (!cached?.transform) { console.warn('[callout] no cache for pageIdx', item.pageIdx); continue; }

        // Invert pdf.js viewport transform: canvas pixels → PDF user-space
        const [ma,mb,mc,md,me,mf] = cached.transform;
        const det = ma*md - mb*mc;
        const canvasToPdf = (cx, cy) => {
          const dx = cx - me, dy = cy - mf;
          return [(md*dx - mc*dy)/det, (ma*dy - mb*dx)/det];
        };

        const cx = item.anchorX * cached.vw;
        const cy = item.anchorY * cached.vh;
        const [anchorPdfX, anchorPdfY] = canvasToPdf(cx, cy);

        const boxW = 70, boxH = 70;

  const importXlsx = async (file) => {
    if (!file) return;
    try {
      // Dynamically load SheetJS
      if (!window.XLSX) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
      }
      const ab = await file.arrayBuffer();
      const wb = window.XLSX.read(ab, { type: 'array' });

      // Parse rows from a single worksheet, returns { rows, colMap } or null
      const parseWorksheet = (ws) => {
        const raw = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (!raw.length) return null;
        let headerRowIdx = -1, colMap = {};
        for (let ri = 0; ri < Math.min(raw.length, 5); ri++) {
          const row = raw[ri].map(c => String(c).trim());
          const matched = {};
          const HEADER_ALIASES = {
            'item number': ['item no.', 'item no', 'item #', 'item'],
            'block type':  ['block', 'type'],
            'equipment callout': ['equipment', 'equip callout', 'equip. callout'],
            'bore callout': ['bore', 'bore call out'],
            'line type':   ['linetype'],
            'line type code': ['line type cd', 'linetype code', 'lt code'],
          };
          HEADERS.forEach((h, hi) => {
            const hLow = h.toLowerCase();
            const aliases = HEADER_ALIASES[hLow] || [];
            const ci = row.findIndex(cell => {
              const cLow = cell.toLowerCase();
              return cLow === hLow || aliases.includes(cLow);
            });
            if (ci !== -1) matched[hi] = ci;
          });
          if (Object.keys(matched).length >= 3) { headerRowIdx = ri; colMap = matched; break; }
        }
        if (headerRowIdx === -1) return null;
        const rows = [];
        for (let ri = headerRowIdx + 1; ri < raw.length; ri++) {
          const xlRow = raw[ri];
          if (xlRow.every(c => String(c).trim() === '')) continue;
          const row = {};
          FIELDS.forEach((f, fi) => {
            const ci = colMap[fi];
            const val = ci !== undefined ? String(xlRow[ci] ?? '').trim() : '';
            row[f] = val.replace(/\r\n|\r/g, '\n');
          });
          rows.push(row);
        }
        return rows.length ? rows : null;
      };

      // Group worksheet names using same logic as image filename grouping:
      // "Page 5.1", "Page 5.2" → sheetKey "Page 5", subNum 1/2
      const groupMap = new Map(); // sheetKey → [{subNum, sheetName}]
      for (const sheetName of wb.SheetNames) {
        const { sheetKey, subNum } = parseSheetKey(sheetName);
        if (!groupMap.has(sheetKey)) groupMap.set(sheetKey, []);
        groupMap.get(sheetKey).push({ subNum, sheetName });
      }

      const built = [];
      let idBase = Date.now();

      for (const [sheetKey, entries] of groupMap) {
        // Sort sub-sheets by sub-number so rows merge in order (5.1 before 5.2)
        entries.sort((a, b) => a.subNum - b.subNum || a.sheetName.localeCompare(b.sheetName));
        const mergedRows = [];
        for (const { sheetName } of entries) {
          const ws = wb.Sheets[sheetName];
          if (!ws) continue;
          const rows = parseWorksheet(ws);
          if (rows) mergedRows.push(...rows);
        }
        if (!mergedRows.length) continue;
        applyCoordRules(mergedRows);
        built.push({ id: idBase++, name: sheetKey, rows: mergedRows, dupWarning: recomputeDup(mergedRows), images: [], source: 'xlsx' });
      }

      if (!built.length) {
        alert('No sheets with matching column headers found in this Excel file.\nExpected headers: ' + HEADERS.join(', '));
        return;
      }

      setSheets(prev => {
        const existingNames = new Set(prev.map(s => s.name.trim().toLowerCase()));
        const dupIds = new Set(built.filter(s => existingNames.has(s.name.trim().toLowerCase())).map(s => s.id));
        if (dupIds.size) setDupTabIds(prev2 => new Set([...prev2, ...dupIds]));
        const merged = [...prev, ...built].sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
        setActiveSheet(merged.findIndex(s => s.id === built[0].id));
        return merged;
      });
    } catch (err) {
      console.error('[importXlsx]', err);
      alert('Failed to import Excel file: ' + err.message);
    } finally {
      if (xlsxImportRef.current) xlsxImportRef.current.value = '';
    }
  };

  const startExtraction = async () => {
    if (!staging) return;
    setStaging(prev=>({...prev,processing:true}));
    const setFS = (gi,fi,st) => setStaging(prev=>({...prev,progress:prev.progress.map((p,pi)=>pi!==gi?p:{...p,files:p.files.map((f,fii)=>fii!==fi?f:{...f,status:st})})}));
    const builtGroups = await Promise.all(staging.groups.map(async ({sheetKey,files},gi) => {
      const loaded=await Promise.all(files.map(readFileAsBase64));
      const results=await extractAll(loaded,(fi,st)=>setFS(gi,fi,st));
      const combined=results.filter(f=>f._text).map(f=>f._text).join("\n");
      const parsed=combined.trim()?parseImageText(combined):{rows:[],dupWarning:""};
      return {id:Date.now()+gi,name:sheetKey,rows:parsed.rows,dupWarning:parsed.dupWarning,images:results};
    }));
    setSheets(prev=>{const merged=[...prev,...builtGroups].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));setActiveSheet(merged.findIndex(s=>s.id===builtGroups[0]?.id));return merged;}); setStaging(null);
  };

  // Retry only errored images in staging modal
  const retryErrors = async () => {

    await Promise.all(staging.groups.map(async ({sheetKey,files},gi) => {
      const errorIdxs = files.map((f,i)=>f.status==='error'?i:-1).filter(i=>i>=0);
      if (!errorIdxs.length) return;
      const errorFiles = errorIdxs.map(i=>files[i]);
      const loaded = await Promise.all(errorFiles.map(readFileAsBase64));
      const results = await extractAll(loaded,(li,st,tx)=>setFS(gi,errorIdxs[li],st,tx));
      // Merge results back into staging progress
      setStaging(prev=>({...prev,progress:prev.progress.map((p,pi)=>{
        if (pi!==gi) return p;
        const newFiles=[...p.files];
        results.forEach((r,li)=>{ newFiles[errorIdxs[li]]={...newFiles[errorIdxs[li]],...r}; });
        return {...p,files:newFiles};
      })}));
    }));

    setStaging(prev => prev ? {...prev, processing:false} : prev);
  };

  // Add Sheet modal handlers
  const getSheetBase = name => name.replace(/\.[^/.]+$/,"").replace(/\.\d+$/,"").trim();

  // Parse a filename into { pageNum, sheetLabel } hints for pre-filling the form fields.
  // Rules (per Q4 clarification):
  //   "Sheet 5.1" / "Sheet 12" — numeric (with optional .sub) → page number hint
  //   "Page 7" / "Page 7.1"   → page number hint
  //   "Sheet C-14"             → sheet label hint (non-numeric identifier)
  //   "C-14 Page 7"            → both: sheet label C-14, page 7
  const parseFilenameHint = fname => {
    const base = fname.replace(/\.[^/.]+$/, "").trim(); // strip extension
    let pageNum = "", sheetLabel = "";

    // "Page N" or "Page N.N" anywhere in filename
    const pageM = base.match(/\bpage\s*(\d+(?:\.\d+)?)\b/i);
    if (pageM) pageNum = `Page ${pageM[1]}`;

    // "Sheet N" or "Sheet N.N" (purely numeric) — treat as page number
    const sheetNumM = base.match(/\bsheet\s*(\d+(?:\.\d+)?)\b/i);
    if (sheetNumM) {
      if (!pageNum) pageNum = `Page ${sheetNumM[1]}`; // only if no explicit Page N found
    } else {
      // "Sheet <alphanumeric>" e.g. "Sheet C-14" — treat as sheet label
      const sheetLabelM = base.match(/\bsheet\s+([A-Za-z][A-Za-z0-9\-]*)\b/i);
      if (sheetLabelM) sheetLabel = sheetLabelM[1];
    }

    return { pageNum, sheetLabel };
  };

  const handleImageUpload = async (e,idx) => {
    const files=Array.from(e.target.files||[]).filter(f=>f.type.startsWith("image/")); if(!files.length) return;
    const loaded=await Promise.all(files.map(readFileAsBase64));
    const exNames=new Set(newSheets[idx].images.map(f=>f.name));
    const dups=loaded.filter(f=>exNames.has(f.name)).map(f=>f.name);
    if(dups.length){updateNew(idx,{error:`Duplicate file${dups.length>1?"s":""} already uploaded: ${dups.join(", ")}`});if(e.target?.value!==undefined)e.target.value="";return;}
    const allF=[...newSheets[idx].images,...loaded.map(f=>({...f,status:"ready"}))];
    // Only enforce cross-sheet guard when filenames actually follow page naming (e.g. Page5.1.png)
    const isSheetNamed = f => /sheet\s*\d/i.test(f.name);

      const bases=[...new Set(allF.filter(isSheetNamed).map(f=>getSheetBase(f.name)))];

    const cur = newSheets[idx];

    const autoLabel = cur.sheetLabel.trim() || hint.sheetLabel;

  // automatically create one tab per group sorted by sheet key.
  const handleMultiSheetUpload = async files => {

    if (!imgFiles.length) return;

    if (groups.length === 1) {

    const existing = newSheets.filter(ns => ns.name.trim() || ns.images.length || ns.pastedText.trim());
    const builtNS = groups.map(({ sheetKey, files: gFiles }) => {
      const hint = parseFilenameHint(gFiles[0].name);
      return {
        ...EMPTY_NS,
        name:       hint.pageNum   || "",   // auto-fill Page # from filename
        sheetLabel: hint.sheetLabel || "",  // auto-fill Sheet label from filename
        images: gFiles.map(f => ({ ...(fileMap.get(f.name) || {}), status: 'ready' })),
        parsing: true,
      };
    });

    await Promise.all(builtNS.map(async (ns, gi) => {

    setSheets(prev=>{const merged=[...prev,...built].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));setActiveSheet(merged.findIndex(s=>s.id===built[0]?.id));return merged;}); closeModal();
  };

  return (
    <div style={{ fontFamily:"Arial,sans-serif",background:"#f0f4f8",minHeight:"100vh",display:"flex",flexDirection:"column" }}>

            {hasSheets && <button onClick={()=>setShowSummary(true)} style={{...btn(C.navyDk),border:"1px solid #81C784",padding:"4px 10px",fontSize:"12px"}}>📊 Summary</button>}

        </div>
      </div>

      {/* Sheet tabs */}
      {hasSheets && (

          onClick={()=>tabCtxMenu&&setTabCtxMenu(null)}>
          {sheets.map((s,i) => (

                  <div style={{border:"1px solid #ddd",borderRadius:"6px",overflow:"hidden"}}>

                          const errorDetail = p.status === "error" && p.errorMsg ? p.errorMsg : null;

            <div style={{padding:"16px 20px",overflowY:"auto",flex:1}}>

              {staging.progress.map((group,gi)=>{
                const allDone=group.files.every(f=>f.status==="done"); const anyError=group.files.some(f=>f.status==="error"); const anyBusy=group.files.some(f=>f.status==="extracting");
                const hBg=anyError?"#ffebee":allDone?"#e8f5e9":anyBusy?"#fff3e0":"#f5f5f5";
                const hColor=anyError?C.red:allDone?C.green:"#333";
                const icon=anyError?"❌":allDone?"✅":anyBusy?"⏳":"📁";
                return(
                  <div key={gi} style={{marginBottom:"10px",border:`1px solid ${anyError?"#f44336":allDone?"#4CAF50":"#ddd"}`,borderRadius:"7px",overflow:"hidden"}}>

                      <span style={{fontWeight:"bold",fontSize:"13px",color:hColor}}>{icon} {group.sheetKey}</span>
                      <span style={{fontSize:"11px",color:"#888"}}>{group.files.length} image{group.files.length!==1?"s":""}</span>
                    </div>
                    {group.files.map((f,fi)=>(
                      <div key={fi} style={{display:"flex",alignItems:"center",padding:"4px 14px",gap:"8px",background:fi%2===0?"#fafafa":"#fff",borderTop:"1px solid #f0f0f0"}}>
                        <span style={{fontSize:"12px",flex:1,color:"#444",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>🖼 {f.name}</span>
                        <span style={{fontSize:"11px",fontWeight:"bold",color:ST_COLOR[f.status],whiteSpace:"nowrap"}}>{ST_LABEL[f.status]}</span>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
            <div style={{...mftr,justifyContent:"flex-end"}}>
              {staging.processing?(
                <span style={{fontSize:"13px",color:"#666",fontStyle:"italic"}}>Processing — do not close this window…</span>

                  <button onClick={()=>setStaging(null)} style={{background:"#ccc",border:"none",padding:"8px 18px",borderRadius:"5px",cursor:"pointer",fontSize:"13px"}}>Cancel</button>

                  )}

                </>

            </div>
          </div>

      {/* Main content */}
      <div style={{padding:"12px 20px",display:"flex",flexDirection:"column",flex:1,position:"relative"}} onDragOver={!staging?onMainDragOver:undefined} onDragLeave={!staging?onMainDragLeave:undefined} onDrop={!staging?onMainDrop:undefined}>
        {curSheet?.dupWarning&&<div style={{background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:"6px",padding:"8px 14px",marginBottom:"10px",fontSize:"13px",color:"#b45309",fontWeight:"bold"}}>{curSheet.dupWarning}</div>}
        {redlineMode&&<div style={{background:"#fff0f0",border:"1px solid #ef9a9a",borderRadius:"6px",padding:"8px 14px",marginBottom:"10px",fontSize:"13px",color:"#c62828",fontWeight:"bold",display:"flex",alignItems:"center",gap:"10px"}}>🔴 Redline Mode — edits here are tracked against the Proposed table. Cells differing from Proposed show in <span style={{color:"#cc0000",fontDecoration:"underline"}}>red bold</span>. Switch back to <strong>📋 Proposed</strong> to edit the reference.<button onClick={toggleRedlineMode} style={{marginLeft:"auto",...btn("#c62828"),fontSize:"12px",padding:"3px 10px"}}>📋 Back to Proposed</button></div>}

        {dropHover&&(
          <div style={{position:"absolute",inset:0,background:"rgba(31,78,121,0.15)",border:`4px dashed ${C.navy}`,borderRadius:"10px",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <div style={{background:"white",padding:"24px 44px",borderRadius:"10px",boxShadow:"0 4px 24px rgba(0,0,0,0.18)",textAlign:"center"}}>
              <div style={{fontSize:"44px",marginBottom:"10px"}}>🗂</div>
              <div style={{fontSize:"16px",fontWeight:"bold",color:C.navy}}>Drop PDF or images here</div>
              <div style={{fontSize:"13px",color:"#666",marginTop:"4px"}}>PDF pages auto-grouped by sheet ID · Images auto-grouped by filename</div>
            </div>
          </div>
        )}

        {!hasSheets ? (
          <div style={{textAlign:"center",padding:"60px 20px",background:"white",border:`2px dashed ${dropHover?C.navy:"#c0c8d0"}`,borderRadius:"10px",transition:"all 0.2s",boxShadow:dropHover?`0 0 0 4px rgba(31,78,121,0.1)`:"none"}}>
            <div style={{fontSize:"52px",marginBottom:"14px"}}>📂</div>
            <p style={{fontSize:"18px",fontWeight:"bold",color:C.navy,margin:"0 0 10px"}}>Drop Files Here to Begin</p>
            <p style={{fontSize:"13px",margin:"0 0 16px",color:"#555",maxWidth:"480px",display:"inline-block"}}>
              Drop a <strong>PDF construction drawing</strong> to extract callouts, drop <strong>sheet images</strong> to group by filename, or drop an <strong>Excel file</strong> (.xlsx/.xls) to import existing callout data.
            </p>
            <div style={{display:"flex",gap:"12px",justifyContent:"center",flexWrap:"wrap"}}>
              <button onClick={()=>pdfFileRef.current?.click()} style={{...btn(C.purple),display:"flex",alignItems:"center",gap:"6px"}}>📄 Browse PDF</button>
              <button onClick={()=>mainFileRef.current?.click()} style={{...btn(C.navy),display:"flex",alignItems:"center",gap:"6px"}}>🖼 Browse Images</button>
              <button onClick={()=>xlsxImportRef.current?.click()} style={{...btn("#217346"),display:"flex",alignItems:"center",gap:"6px"}}>📥 Import Excel</button>
            </div>
            <p style={{fontSize:"11px",color:"#aaa",margin:"14px 0 0"}}>Images: e.g. <code style={{background:"#f0f0f0",padding:"1px 4px",borderRadius:"3px"}}>Page 5.1, Page 5.2</code> → auto-grouped by page number &nbsp;·&nbsp; Excel: must have matching column headers</p>
            <input ref={mainFileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{handleMainFileDrop(e.target.files);e.target.value="";}} />
            <input ref={pdfFileRef} type="file" accept="application/pdf,.pdf" style={{display:"none"}} onChange={e=>{handleMainFileDrop(e.target.files);e.target.value="";}} />
            <input ref={xlsxImportRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>{importXlsx(e.target.files[0]);e.target.value="";}} />
          </div>
        ) : (
          <div style={{overflowX:"scroll",overflowY:"auto",background:"white",flex:1}}>
            {!curSheet||curSheet.rows.length===0 ? (
              <div style={{padding:"40px",textAlign:"center",color:"#888"}}>No data yet.</div>
            ) : (
              <table style={{borderCollapse:"collapse",tableLayout:"fixed",width:"100%",fontSize:"12px",fontFamily:"Calibri,Arial,sans-serif"}}>
                <thead>
                  <tr>
                    {curSheet.dupWarning&&<th style={{background:"#1F4E79",padding:"5px 6px",borderRight:"1px solid #2E6DA4",borderBottom:"3px solid #0F2D4A",width:"28px",minWidth:"28px",maxWidth:"28px",position:"sticky",top:0,zIndex:2}}></th>}
                    <th style={{background:"#1F4E79",padding:"5px 6px",borderRight:"1px solid #2E6DA4",borderBottom:"3px solid #0F2D4A",width:"28px",minWidth:"28px",maxWidth:"28px",position:"sticky",top:0,zIndex:2,textAlign:"center"}} title="Select rows to merge (max 2)">☑</th>
                    {HEADER_LABELS.map((h,i)=><th key={i} style={{background: redlineMode?"#7f1010":"#1F4E79",color:"#ffffff",padding:"5px 8px",textAlign:"center",verticalAlign:"middle",fontWeight:"bold",fontSize:"14px",whiteSpace:i===0?"normal":"nowrap",wordBreak:i===0?"break-word":"normal",width:COL_W[i],maxWidth:COL_W[i],borderRight:"1px solid #2E6DA4",borderBottom:"3px solid #0F2D4A",position:"sticky",top:0,zIndex:2,letterSpacing:"0.3px"}}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {(()=>{
                    // In redline mode, show redlinedRows; compare against proposed rows for diff highlighting
                    const REDLINE_FIELDS = new Set(["equipmentCallout","coordinates","boreCallout","lineType"]);
                    const displayRows = redlineMode ? (curSheet.redlinedRows || curSheet.rows) : curSheet.rows;
                    const proposedRows = curSheet.rows; // always the reference
                    const dupItems=new Set([...displayRows.reduce((m,r)=>m.set(r.item,(m.get(r.item)||0)+1),new Map())].filter(([,c])=>c>1).map(([n])=>n));
                    return displayRows.map((row,ri)=>{
                      const proposedRow = proposedRows[ri]; // same index reference
                      const isDup=dupItems.has(row.item);
                      const isMerged=!!row._mergedFrom;
                      const isEven=ri%2===1;
                      const rowBg=isDup?"#fff8e1":isMerged?"#F3EAF8":isEven?"#EEF4FB":"#ffffff";

                      const border="1px solid #D0DCE8";
                      return(
                        <tr key={ri}
                          onClick={e=>{ if(!e.ctrlKey && !e.metaKey) return; e.preventDefault(); toggleRow(ri); }}
                          style={{background:selectedRows.has(ri)?"#E8F0FE":rowBg,outline:selectedRows.has(ri)?"2px solid #4A90D9":isMerged?"2px solid #9C27B0":"none",outlineOffset:"-2px",cursor:"default"}}>
                          {curSheet.dupWarning&&<td style={{padding:"2px 4px",borderRight:border,borderBottom:border,textAlign:"center",verticalAlign:"middle",width:"28px",maxWidth:"28px",background:isDup?"#fff8e1":rowBg}}>
                            {isDup&&<button onClick={()=>deleteRow(ri)} title="Delete duplicate row" style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:"14px",lineHeight:1,padding:"0 2px"}}>✕</button>}
                          </td>}
                          <td style={{padding:"2px 4px",borderRight:border,borderBottom:border,textAlign:"center",verticalAlign:"middle",width:"28px",maxWidth:"28px",background:selectedRows.has(ri)?"#E8F0FE":rowBg}} onClick={e=>e.stopPropagation()}>
                            <input type="checkbox" checked={selectedRows.has(ri)} onChange={()=>toggleRow(ri)} style={{cursor:"pointer",accentColor:"#4A90D9",width:"14px",height:"14px"}}/>
                          </td>
                          {FIELDS.map((f,ci)=>{
                            const isEqCallout=ci===3;
                            const isBoreCallout=ci===5;
                            const isItem=ci===0;
                            const isBlockType=ci===1;
                            const btBg=isBlockType?blockTypeBg(row.blockType):null;
                            const usesBtBg=isBlockType||isEqCallout||isBoreCallout;
                            const cellBg=isDup?(usesBtBg?btBg||"#fff8e1":"#fff8e1"):usesBtBg&&btBg?btBg:rowBg;
                            // Redline diff: red text if this field differs from proposed
                            // For lineType (ci===6): per-line diff handled separately below
                            const isLineType = ci === 6;
                            const isRedlineDiff = redlineMode && REDLINE_FIELDS.has(f) && !isLineType && proposedRow
                              && String(row[f]??"").trim() !== String(proposedRow[f]??"").trim();

                            // Per-line diff data for Line Type cell
                            const lineTypeDiffLines = (redlineMode && isLineType && proposedRow) ? (() => {
                              const redLines = String(row[f]??"").split("\n").map(l=>l.trim()).filter(Boolean);
                              const propLines = String(proposedRow[f]??"").split("\n").map(l=>l.trim()).filter(Boolean);

                              // Multiset diff: count occurrences, match greedily
                              const redPool = new Map();
                              for (const l of redLines) redPool.set(l, (redPool.get(l)||0) + 1);

                              const result = [];
                              // Pass 1: walk proposed lines — consume from redPool to mark same/removed
                              for (const l of propLines) {
                                const avail = redPool.get(l) || 0;
                                if (avail > 0) { redPool.set(l, avail - 1); result.push({ text: l, status: "same" }); }
                                else result.push({ text: l, status: "removed" });
                              }
                              // Pass 2: remaining redPool entries are added lines
                              for (const [l, cnt] of redPool) {
                                for (let i = 0; i < cnt; i++) result.push({ text: l, status: "added" });
                              }

                              const hasDiff = result.some(l => l.status !== "same");
                              return hasDiff ? result : null;
                            })() : null;
                            // Shared cell style properties
                            const cellTextStyle = {
                              padding:"3px 8px",
                              whiteSpace:(ci===2||ci===3||ci===5||ci===6)?"pre-wrap":"normal",
                              wordBreak:"break-word", minHeight:"22px",
                              width:"100%", boxSizing:"border-box",
                              outline:"none", cursor:"text", display:"block",
                              textAlign:(isItem||isBlockType)?"center":"left",
                              fontWeight: isRedlineDiff?"bold":((isItem||isBlockType)?"bold":"normal"),
                              color: isRedlineDiff?"#cc0000":undefined,
                            };
                            return(
                            <td key={ci}
                              onClick={e=>{
                                // Click on td focuses the contenteditable (hide display, show editor)
                                const ce = e.currentTarget.querySelector('div[contenteditable]');
                                const disp = e.currentTarget.querySelector('.lt-disp');
                                if(ce){ if(disp) disp.style.display="none"; ce.style.display="block"; ce.focus(); }
                              }}
                              onMouseEnter={e=>{
                                const handle = e.currentTarget.querySelector('.fill-handle');
                                if (handle) handle.style.opacity = "1";
                                if (!dragFill.current || dragFill.current.ci !== ci) return;
                                dragFill.current.toRi = ri;
                                setDragFillRange({ ci, fromRi: dragFill.current.fromRi, toRi: ri });
                              }}
                              onMouseLeave={e=>{
                                const handle = e.currentTarget.querySelector('.fill-handle');
                                if (handle && !dragFill.current) handle.style.opacity = "0";
                              }}
                              data-cell={`${ri}-${ci}`}
                              style={{
                                position:"relative",
                                padding:"0",borderRight:border,borderBottom:border,
                                verticalAlign:(isItem||isBlockType)?"middle":"top",
                                width:COL_W[ci],maxWidth:COL_W[ci],
                                background: dragFillRange && dragFillRange.ci===ci && ri>=Math.min(dragFillRange.fromRi,dragFillRange.toRi) && ri<=Math.max(dragFillRange.fromRi,dragFillRange.toRi) && ri!==dragFillRange.fromRi
                                  ? "#c7e3ff" : cellBg,
                              }}
                            >
                              {/* Static per-line diff display for Line Type in redline mode */}
                              {lineTypeDiffLines && (
                                <div className="lt-disp" style={{...cellTextStyle, cursor:"text"}}
                                  onClick={e=>{ e.stopPropagation(); const ce=e.currentTarget.parentElement.querySelector('div[contenteditable]'); if(ce){e.currentTarget.style.display="none";ce.style.display="block";ce.focus();} }}>
                                  {lineTypeDiffLines.map((l,k)=>(
                                    <React.Fragment key={k}>
                                      <span style={{
                                        color: l.status==="same"?"inherit":"#cc0000",
                                        fontWeight: l.status!=="same"?"bold":"normal",
                                        textDecoration: l.status==="removed"?"line-through":"none",
                                        opacity: l.status==="removed"?0.65:1,
                                      }}>{l.text}</span>
                                      {k<lineTypeDiffLines.length-1&&"\n"}
                                    </React.Fragment>
                                  ))}
                                </div>
                              )}
                              <div
                                contentEditable suppressContentEditableWarning
                                onBlur={e=>{
                                  updateCell(ri,f,e.currentTarget.innerText.trim());
                                  // After blur: if lt-disp exists, hide editor and restore display
                                  const disp=e.currentTarget.parentElement?.querySelector('.lt-disp');
                                  if(disp){ e.currentTarget.style.display="none"; disp.style.display="block"; }
                                }}
                                onInput={isItem ? e => {
                                  const typed = e.currentTarget.innerText.trim();
                                  setSheets(prev => prev.map((s,si) => {
                                    if (si !== activeSheet) return s;
                                    const tempRows = s.rows.map((r,j) => j===ri ? {...r, item:typed} : r);
                                    return {...s, dupWarning: recomputeDup(tempRows)};
                                  }));
                                } : undefined}
                                onFocus={e=>{
                                  e.currentTarget.style.background="#dbeeff";
                                  const el = e.currentTarget;
                                  const range = document.createRange();
                                  const sel = window.getSelection();
                                  range.selectNodeContents(el);
                                  range.collapse(false);
                                  sel.removeAllRanges();
                                  sel.addRange(range);
                                }}
                                onBlurCapture={e=>e.currentTarget.style.background=""}
                                onKeyDown={e=>{
                                  const TR=displayRows.length, TC=FIELDS.length;
                                  if(e.key==="Enter"&&e.altKey){e.preventDefault();const sel=window.getSelection();const range=sel.getRangeAt(0);range.deleteContents();range.insertNode(document.createTextNode("\n"));range.collapse(false);sel.removeAllRanges();sel.addRange(range);return;}
                                  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();updateCell(ri,f,e.currentTarget.innerText.trim());document.querySelector(`[data-cell="${Math.min(ri+1,TR-1)}-${ci}"] div[contenteditable]`)?.focus();return;}
                                  if(e.key==="Enter"&&e.shiftKey){e.preventDefault();updateCell(ri,f,e.currentTarget.innerText.trim());document.querySelector(`[data-cell="${Math.max(ri-1,0)}-${ci}"] div[contenteditable]`)?.focus();return;}
                                  if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();updateCell(ri,f,e.currentTarget.innerText.trim());const nci=ci+1<TC?ci+1:0;const nri=ci+1<TC?ri:Math.min(ri+1,TR-1);document.querySelector(`[data-cell="${nri}-${nci}"] div[contenteditable]`)?.focus();return;}
                                  if(e.key==="Tab"&&e.shiftKey){e.preventDefault();updateCell(ri,f,e.currentTarget.innerText.trim());const pci=ci-1>=0?ci-1:TC-1;const pri=ci-1>=0?ri:Math.max(ri-1,0);document.querySelector(`[data-cell="${pri}-${pci}"] div[contenteditable]`)?.focus();return;}
                                  if(e.key==="Escape"){e.preventDefault();e.currentTarget.innerText=String(row[f]??"");e.currentTarget.blur();}
                                }}
                                style={{
                                  ...cellTextStyle,
                                  // Hide contenteditable when static diff display is shown
                                  display: lineTypeDiffLines ? "none" : "block",
                                }}
                              >{row[f]}</div>
                              {/* Fill handle — outside contentEditable div to avoid removeChild conflict */}
                              <span
                                className="fill-handle"
                                onMouseDown={e=>{
                                  e.preventDefault();
                                  e.stopPropagation();
                                  dragFill.current = { ci, field: f, fromRi: ri, toRi: ri, value: String(row[f]??"") };
                                  setDragFillRange({ ci, fromRi: ri, toRi: ri });
                                }}
                                style={{position:"absolute",bottom:0,right:0,width:8,height:8,background:"#0078d4",cursor:"crosshair",zIndex:5,opacity:0,transition:"opacity 0.1s"}}
                              />
                              {/* "Add to callout" / "Revert" button — shown in redline mode for bore-type rows on the Block Type cell */}
                              {redlineMode && isBlockType && /\bBORE\s*&\s*PLACE\b|\bMISSILE\s*&\s*PLACE\b|\bHAND\s*DIG\b/i.test(row.blockType) && (
                                row._addedToCallout ? (
                                  <button
                                    onClick={e=>{ e.stopPropagation(); revertAddToCallout(ri); }}
                                    title="Revert — restore original content, bore callout, line type, line type code, and depth"
                                    style={{display:"block",width:"100%",marginTop:"4px",padding:"2px 4px",fontSize:"10px",background:"#B71C1C",color:"white",border:"none",borderRadius:"3px",cursor:"pointer",fontWeight:"bold",letterSpacing:"0.2px"}}>
                                    ↩ Revert
                                  </button>
                                ) : (
                                  <button
                                    onClick={e=>{ e.stopPropagation(); setAddToCalloutModal({ ri, rowItem: row.item }); }}
                                    title="Mark as added to another callout"
                                    style={{display:"block",width:"100%",marginTop:"4px",padding:"2px 4px",fontSize:"10px",background:"#7B1FA2",color:"white",border:"none",borderRadius:"3px",cursor:"pointer",fontWeight:"bold",letterSpacing:"0.2px"}}>
                                    ＋ Add to Callout
                                  </button>
                                )
                              )}
                            </td>
                            );
                          })}
                        </tr>
                      );
                    });
                  })()}
                </tbody>
              </table>
            )}
            {curSheet && (
              <div style={{padding:"8px 4px"}}>
                <button onClick={()=>addRow(null)} style={{...btn(C.blue),fontSize:"12px",padding:"5px 14px"}}>＋ Add Row</button>
              </div>
            )}
          </div>
      )}
      {/* ── Annotation mode picker ── */}
      {annotateMode === 'pick' && (
        <div style={{...overlay, zIndex:200}}>
          <div style={{...mbox("480px")}}>
            <div style={mhdr}>
              <span style={{fontWeight:"bold",fontSize:"15px"}}>🗺 Choose Annotation Mode</span>
              <CloseBtn onClick={()=>setAnnotateMode(null)}/>
            </div>
            <div style={{padding:"24px 20px"}}>
              {/* Table source selector — only shown when at least one sheet has redlined rows */}
              {sheets.some(s => s.redlinedRows) && (
                <div style={{marginBottom:"20px",padding:"12px 14px",background:"#f8f9fa",borderRadius:"8px",border:"1px solid #dee2e6"}}>
                  <div style={{fontSize:"12px",color:"#555",marginBottom:"8px",fontWeight:"600"}}>Data Source</div>
                  <div style={{display:"flex",gap:"8px"}}>
                    {[{val:'proposed',label:'📋 Proposed Table'},{val:'redlined',label:'✏️ Redlined Table'}].map(opt=>(
                      <div key={opt.val}
                        onClick={()=>setAnnotateTableSource(opt.val)}
                        style={{flex:1,padding:"8px 10px",borderRadius:"6px",cursor:"pointer",textAlign:"center",fontSize:"12px",fontWeight:"600",
                          border: annotateTableSource===opt.val ? "2px solid #1565C0" : "1px solid #ccc",
                          background: annotateTableSource===opt.val ? "#e3f2fd" : "white",
                          color: annotateTableSource===opt.val ? "#1565C0" : "#555",
                          transition:"all .15s"}}>
                        {opt.label}
                      </div>
                    ))}
                  </div>
                  <div style={{fontSize:"11px",color:"#888",marginTop:"6px"}}>
                    {annotateTableSource==='redlined'
                      ? "Annotations will use field-verified redlined data. Sheets without redlines fall back to proposed data."
                      : "Annotations will use original proposed (OCR-extracted) data."}
                  </div>
                </div>
              )}
              <p style={{margin:"0 0 20px",fontSize:"13px",color:"#555"}}>How would you like to annotate the PDF?</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px"}}>

                  onMouseEnter={e=>e.currentTarget.style.background="#f3e5f5"}

      )}

      {/* ── Manual Placement modal ── */}
      {calloutModal && !calloutModal.done && !calloutModal.minimized && (
        <div style={{...overlay, zIndex:200}}>
          <div
            tabIndex={-1}
            style={{background:"white",borderRadius:"0",width:"100vw",height:"100vh",display:"flex",flexDirection:"column",boxShadow:"none",outline:"none"}}
            ref={el=>{ if(el && document.activeElement !== el) el.focus(); }}
            onKeyDown={e=>{
              if (calloutModal.saving) return;
              if (e.key === "Backspace" || e.key === "Delete") {
                e.preventDefault();
                // Unplace the most recently placed item on the current page
                setCalloutModal(prev => {
                  if (!prev) return prev;
                  const pageItems = prev.allItems.map((it,i)=>({...it,_idx:i})).filter(it=>it.placed && it.pageIdx===prev.currentPageIdx);
                  if (pageItems.length === 0) return prev;
                  const last = pageItems[pageItems.length - 1];
                  const newItems = prev.allItems.map((it,i)=>i===last._idx?{...it,placed:false,anchorX:null,anchorY:null}:it);
                  return {...prev, allItems:newItems, currentItemIdx:last._idx, currentPageIdx:last.pageIdx};
                });
              }
            }}>
            {/* Header */}
            <div style={mhdr}>
              <span style={{fontWeight:"bold",fontSize:"15px"}}>📍 Manual Placement — {calloutModal.fileName}</span>
              {!calloutModal.saving && <CloseBtn onClick={()=>setCalloutModal(prev=>prev?({...prev,minimized:true}):null)} title="Minimize"/>}
            </div>

            {calloutModal.saving ? (
              <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"15px",color:"#555",fontStyle:"italic"}}>⏳ Saving annotated PDF…</div>
            ) : (
              <div style={{flex:1,display:"flex",overflow:"hidden"}}>

                {/* Left: page tabs + item list */}
                <div style={{width:"260px",flexShrink:0,borderRight:"1px solid #ddd",display:"flex",flexDirection:"column",overflow:"hidden"}}>
                  {/* Overall count */}
                  <div style={{padding:"10px 12px",background:"#f5f5f5",borderBottom:"1px solid #ddd",fontSize:"12px",fontWeight:"bold",color:"#333"}}>
                    Callouts ({calloutModal.allItems.filter(it=>it.placed).length}/{calloutModal.allItems.length} placed)
                  </div>
                  {/* Page selector buttons */}
                  {(() => {
                    const pages = [...new Set(calloutModal.allItems.map(it=>it.pageIdx))].sort((a,b)=>a-b);
                    return (
                      <>
                        <div style={{padding:"8px 10px",borderBottom:"1px solid #ddd",background:"#fafafa",display:"flex",flexWrap:"wrap",gap:"5px"}}>
                          {pages.map(pgIdx => {
                            const pageItems = calloutModal.allItems.filter(it=>it.pageIdx===pgIdx);
                            const pagePlaced = pageItems.filter(it=>it.placed).length;
                            const pageAllDone = pagePlaced === pageItems.length;
                            const isActive = calloutModal.currentPageIdx === pgIdx;
                            return (
                              <button key={pgIdx}
                                onClick={()=>setCalloutModal(prev=>({...prev, currentPageIdx:pgIdx}))}
                                title={`Page ${pgIdx+1} — ${pagePlaced}/${pageItems.length} placed`}
                                style={{
                                  padding:"4px 9px",fontSize:"11px",fontWeight:"bold",cursor:"pointer",
                                  borderRadius:"5px",border: isActive ? "2px solid #0078d4" : "2px solid #ccc",
                                  background: isActive ? "#0078d4" : pageAllDone ? "#e8f5e9" : "white",
                                  color: isActive ? "white" : pageAllDone ? "#388e3c" : "#444",
                                  position:"relative",
                                }}>
                                {pageAllDone && !isActive ? "✅" : ""}{pgIdx+1}
                                {!pageAllDone && <span style={{
                                  position:"absolute",top:"-5px",right:"-5px",
                                  background: isActive ? "white" : "#e53935",
                                  color: isActive ? "#0078d4" : "white",
                                  borderRadius:"50%",width:"14px",height:"14px",
                                  fontSize:"8px",fontWeight:"bold",lineHeight:"14px",textAlign:"center",
                                  display:"flex",alignItems:"center",justifyContent:"center",
                                }}>{pageItems.length - pagePlaced}</span>}
                              </button>
                            );
                          })}
                        </div>
                        {/* Item list for active page */}
                        <div style={{flex:1,overflowY:"auto"}}>
                          {(() => {
                            const pageItems = calloutModal.allItems.map((it,i)=>({...it,_idx:i})).filter(it=>it.pageIdx===calloutModal.currentPageIdx);
                            const pagePlaced = pageItems.filter(it=>it.placed).length;
                            return (
                              <>
                                <div style={{padding:"6px 12px",background:"#f0f4ff",borderBottom:"1px solid #ddd",fontSize:"11px",color:"#555",fontWeight:"bold"}}>
                                  Page {calloutModal.currentPageIdx+1} — {pagePlaced}/{pageItems.length} placed
                                </div>
                                {pageItems.length === 0
                                  ? <div style={{padding:"20px 12px",color:"#aaa",fontSize:"12px",textAlign:"center"}}>No items on this page</div>
                                  : pageItems.map(item => (
                                    <div key={item._idx}
                                      onClick={()=>setCalloutModal(prev=>({...prev, currentItemIdx:item._idx, currentPageIdx:item.pageIdx}))}
                                      style={{
                                        padding:"7px 12px",cursor:"pointer",fontSize:"12px",borderBottom:"1px solid #eee",
                                        background: item._idx === calloutModal.currentItemIdx ? "#e3f2fd" : item.placed ? "#f1f8e9" : "white",
                                        borderLeft: item._idx === calloutModal.currentItemIdx ? "3px solid #0078d4" : item.placed ? "3px solid #388e3c" : "3px solid transparent",
                                      }}>
                                      <div style={{fontWeight:"bold",color: item.placed ? "#388e3c" : "#333"}}>
                                        {item.placed ? "✅" : "⬜"} Callout {item.item}
                                      </div>
                                      <div style={{color:"#666",marginTop:"2px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{item.blockType || "—"}</div>
                                      <div style={{color:"#999",fontSize:"11px"}}>{item.sheetName}</div>
                                    </div>
                                  ))
                                }
                              </>
                            );
                          })()}
                        </div>
                      </>
                    );
                  })()}
                </div>

                {/* Right: PDF page preview with click-to-place */}
                <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
                  {/* Page info bar */}
                  <div style={{padding:"8px 14px",background:"#f9f9f9",borderBottom:"1px solid #ddd",fontSize:"12px",color:"#555",display:"flex",alignItems:"center",gap:"12px"}}>
                    <span>📄 Page {calloutModal.currentPageIdx+1}</span>
                    <span style={{color:"#0078d4",fontWeight:"bold"}}>
                      {(() => {
                        const cur = calloutModal.allItems[calloutModal.currentItemIdx];
                        return cur ? `Placing: Callout ${cur.item} — ${cur.blockType || "unknown"} (${cur.sheetName})` : calloutModal.allItems.every(it=>it.placed) ? "✅ All callouts placed — ready to save!" : "Click a callout on the left to select it";
                      })()}
                    </span>
                    <span style={{color:"#999",fontSize:"11px",fontStyle:"italic"}}>Backspace / Delete to undo last placement</span>

                    <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:"6px"}}>
                      <button onClick={()=>setCalloutModal(prev=>({...prev,zoom:Math.max(0.25,((prev.zoom||1)-0.25))}))}
                        style={{background:"#e0e0e0",border:"none",borderRadius:"4px",width:"26px",height:"26px",cursor:"pointer",fontSize:"16px",lineHeight:"1",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                      <span style={{fontSize:"12px",color:"#555",minWidth:"38px",textAlign:"center"}}>{Math.round((calloutModal.zoom||1)*100)}%</span>
                      <button onClick={()=>setCalloutModal(prev=>({...prev,zoom:Math.min(4,((prev.zoom||1)+0.25))}))}
                        style={{background:"#e0e0e0",border:"none",borderRadius:"4px",width:"26px",height:"26px",cursor:"pointer",fontSize:"16px",lineHeight:"1",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                      <button onClick={()=>setCalloutModal(prev=>({...prev,zoom:1}))}
                        style={{background:"#e0e0e0",border:"none",borderRadius:"4px",padding:"0 8px",height:"26px",cursor:"pointer",fontSize:"11px"}}>Reset</button>
                      <span style={{color:"#aaa",fontSize:"11px",marginLeft:"4px"}}>Ctrl+scroll to zoom</span>
                    </div>
                  </div>

                  {/* Canvas area */}
                  <div
                    ref={canvasScrollRef}
                    style={{flex:1,overflow:"auto",position:"relative",background:"#888",padding:"12px"}}
                  >
                    {(() => {
                      const cached = calloutModal.pageCache[calloutModal.currentPageIdx];
                      if (!cached) return <div style={{color:"white",fontSize:"14px",padding:"40px",fontStyle:"italic"}}>⏳ Loading page {calloutModal.currentPageIdx+1}…</div>;
                      const curItem = calloutModal.allItems[calloutModal.currentItemIdx];
                      const zoom = calloutModal.zoom || 1;
                      return (
                        <div style={{width:`${cached.vw*zoom}px`,height:`${cached.vh*zoom}px`,position:"relative",flexShrink:0}}>
                        <div
                          style={{position:"absolute",top:0,left:0,transformOrigin:"top left",transform:`scale(${zoom})`,cursor: curItem ? "crosshair" : "default"}}
                          onMouseMove={e=>{
                            if (!curItem) return;
                            const img = e.currentTarget.querySelector('img');
                            const imgRect = img.getBoundingClientRect();
                            const scaleX = img.naturalWidth  / imgRect.width;
                            const scaleY = img.naturalHeight / imgRect.height;
                            const px = (e.clientX - imgRect.left) * scaleX;
                            const py = (e.clientY - imgRect.top)  * scaleY;
                            setCalloutModal(prev => prev ? ({...prev, _mouseX: px, _mouseY: py}) : prev);
                          }}
                          onMouseLeave={()=>setCalloutModal(prev => prev ? ({...prev, _mouseX:null, _mouseY:null}) : prev)}
                          onClick={e=>{
                            if (!curItem) return;
                            const img = e.currentTarget.querySelector('img');
                            const imgRect = img.getBoundingClientRect();
                            // Convert screen click to natural image pixel coords (undo CSS zoom scale)
                            const scaleX = img.naturalWidth  / imgRect.width;
                            const scaleY = img.naturalHeight / imgRect.height;
                            const px = (e.clientX - imgRect.left) * scaleX;
                            const py = (e.clientY - imgRect.top)  * scaleY;
                            // Store as normalized (0-1) of natural image size for dot rendering
                            const nx = px / img.naturalWidth;
                            const ny = py / img.naturalHeight;
                            setCalloutModal(prev=>{
                              const newItems = prev.allItems.map((it,i)=>i===prev.currentItemIdx?{...it,placed:true,anchorX:nx,anchorY:ny}:it);
                              const nextSamePage = newItems.findIndex((it,i)=>i>prev.currentItemIdx&&!it.placed&&it.pageIdx===prev.currentPageIdx);
                              const nextAny = newItems.findIndex((it,i)=>i>prev.currentItemIdx&&!it.placed);
                              const allPlaced = newItems.every(it=>it.placed);
                              const nextIdx = nextSamePage !== -1 ? nextSamePage : nextAny !== -1 ? nextAny : allPlaced ? -1 : prev.currentItemIdx;
                              const nextPageIdx = nextIdx !== -1 ? (newItems[nextIdx]?.pageIdx ?? prev.currentPageIdx) : prev.currentPageIdx;
                              return {...prev, allItems:newItems, currentItemIdx:nextIdx, currentPageIdx:nextPageIdx};
                            });
                          }}>
                          <img src={cached.dataUrl} alt={`Page ${calloutModal.currentPageIdx+1}`} style={{display:"block"}} draggable={false}/>
                          {/* Ghost boxes for placed anchors on this page */}
                          {calloutModal.allItems.filter(it=>it.placed && it.pageIdx===calloutModal.currentPageIdx).map((it,ii)=>{
                            const bt = it.blockType || '';
                            let r=0.85,g=0.85,b=0.85;
                            if (/\bHH\b|\bFDH\b/i.test(bt))                                        { r=0;  g=1;        b=0; }
                            else if (/\bDAP\b|\bTOBY\s*BOX\b/i.test(bt))                          { r=0;  g=1;        b=1; }
                            else if (/\bBORE\s*&\s*PLACE\b|\bMISSILE\s*&\s*PLACE\b/i.test(bt)) { r=1;  g=1;        b=170/255; }
                            else if (/\bHAND\s*DIG\b/i.test(bt))                                   { r=1;  g=191/255;  b=170/255; }
                            const css = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
                            const boxPx = 105;
                            // Anchor is always visual bottom-right → ghost top-left is always (-boxPx, -boxPx)
                            const ax = it.anchorX * cached.vw;
                            const ay = it.anchorY * cached.vh;
                            const left = ax - boxPx;
                            const top  = ay - boxPx;
                            return (
                              <div key={`ghost-${ii}`} style={{
                                position:"absolute",
                                left:`${(left/cached.vw)*100}%`,
                                top:`${(top/cached.vh)*100}%`,
                                width:`${(boxPx/cached.vw)*100}%`,
                                height:`${(boxPx/cached.vh)*100}%`,
                                background:css.replace(')', ',0.10)').replace('rgb(', 'rgba('),
                                border:`2px dashed ${css}`,
                                boxSizing:"border-box",
                                pointerEvents:"none",
                              }}/>
                            );
                          })}
                          {/* Draw placed anchors on this page */}
                          {calloutModal.allItems.filter(it=>it.placed && it.pageIdx===calloutModal.currentPageIdx).map((it,ii)=>(
                            <div key={ii} style={{position:"absolute",left:`calc(${it.anchorX*100}% - 10px)`,top:`calc(${it.anchorY*100}% - 10px)`,width:"20px",height:"20px",borderRadius:"50%",background:"rgba(255,80,80,0.85)",border:"2px solid white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",color:"white",fontWeight:"bold",pointerEvents:"none",boxShadow:"0 1px 4px rgba(0,0,0,0.4)"}}>
                              {(it.item||'').toString().split('&')[0].trim()}
                            </div>
                          ))}
                          {/* Highlight current item's anchor if already placed */}
                          {(() => {
                            const cur = calloutModal.allItems[calloutModal.currentItemIdx];
                            if (!cur?.placed || cur.pageIdx!==calloutModal.currentPageIdx) return null;
                            return <div style={{position:"absolute",left:`calc(${cur.anchorX*100}% - 12px)`,top:`calc(${cur.anchorY*100}% - 12px)`,width:"24px",height:"24px",borderRadius:"50%",border:"2px solid #0078d4",pointerEvents:"none",boxShadow:"0 0 0 2px white"}}/>;
                          })()}
                          {/* Ghost preview box showing callout size at cursor */}
                          {(() => {
                            if (!curItem || calloutModal._mouseX == null || calloutModal._mouseY == null) return null;
                            const bt = curItem.blockType || '';
                            let r=0.85,g=0.85,b=0.85;
                            if (/\bHH\b|\bFDH\b/i.test(bt))                                         { r=0;   g=1;         b=0; }
                            else if (/\bDAP\b|\bTOBY\s*BOX\b/i.test(bt))                           { r=0;   g=1;         b=1; }
                            else if (/\bBORE\s*&\s*PLACE\b|\bMISSILE\s*&\s*PLACE\b/i.test(bt))  { r=1;   g=1;         b=170/255; }
                            else if (/\bHAND\s*DIG\b/i.test(bt))                                    { r=1;   g=191/255;   b=170/255; }
                            const cssColor = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
                            const boxPx = 105;
                            // Anchor is always visual bottom-right → ghost top-left is always (-boxPx, -boxPx)
                            const left = calloutModal._mouseX - boxPx;
                            const top  = calloutModal._mouseY - boxPx;
                            return (
                              <div style={{
                                position:"absolute",
                                left:`${(left/cached.vw)*100}%`,
                                top:`${(top/cached.vh)*100}%`,
                                width:`${(boxPx/cached.vw)*100}%`,
                                height:`${(boxPx/cached.vh)*100}%`,
                                background:cssColor.replace(')', ',0.10)').replace('rgb(', 'rgba('),
                                border:`2px dashed ${cssColor}`,
                                boxSizing:"border-box",
                                pointerEvents:"none",
                              }}/>
                            );
                          })()}
                        </div>
                        </div>
                      );
                    })()}
                  </div>
                </div>
              </div>
            )}

            {/* Footer */}
            {!calloutModal.saving && (
              <div style={{...mftr,justifyContent:"space-between"}}>
                <div style={{fontSize:"12px",color:"#666"}}>
                  {(() => {
                    const total = calloutModal.allItems.length;
                    const placed = calloutModal.allItems.filter(it=>it.placed).length;
                    const allDone = placed === total;
                    return (
                      <span style={{color: allDone ? "#388e3c" : "#666"}}>
                        {allDone ? "✅" : "⬜"} {placed} of {total} items placed
                        {!allDone && (() => {
                          const pages = [...new Set(calloutModal.allItems.map(it=>it.pageIdx))].sort((a,b)=>a-b);
                          const incomplete = pages.filter(p=>calloutModal.allItems.filter(it=>it.pageIdx===p).some(it=>!it.placed));
                          return <span style={{color:"#b45309",marginLeft:"8px"}}>— pending: page{incomplete.length>1?"s":""} {incomplete.map(p=>p+1).join(", ")}</span>;
                        })()}
                      </span>
                    );
                  })()}
                  {calloutModal.error && <span style={{color:C.red,marginLeft:"12px"}}>⚠️ {calloutModal.error}</span>}
                </div>
                <div style={{display:"flex",gap:"8px"}}>
                  <button onClick={runCalloutAnnotation}
                    disabled={!calloutModal.allItems.every(it=>it.placed)}
                    style={btn(!calloutModal.allItems.every(it=>it.placed)?"#aaa":"#0078d4",!calloutModal.allItems.every(it=>it.placed))}
                    title={!calloutModal.allItems.every(it=>it.placed)?"Place all items before saving":"Save annotated PDF"}>
                    💾 Save & Download PDF
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Minimized Manual Placement restore chip */}
      {cancelManualConfirm && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"10px",padding:"28px 32px",maxWidth:"400px",width:"90%",boxShadow:"0 8px 32px rgba(0,0,0,0.25)"}}>
            <div style={{fontWeight:"bold",fontSize:"15px",color:"#333",marginBottom:"10px"}}>⚠️ Manual Placement in Progress</div>
            <div style={{fontSize:"13px",color:"#555",lineHeight:"1.6",marginBottom:"22px"}}>
              A manual placement session is currently active. Do you want to cancel it and start a new annotation?
            </div>
            <div style={{display:"flex",gap:"10px",justifyContent:"flex-end"}}>
              <button onClick={()=>{ setCancelManualConfirm(false); }}
                style={{padding:"8px 18px",borderRadius:"6px",border:"1px solid #ccc",background:"#f5f5f5",cursor:"pointer",fontSize:"13px",fontWeight:"bold",color:"#333"}}>
                No, Keep It
              </button>
              <button onClick={()=>{ setCancelManualConfirm(false); setCalloutModal(null); setAnnotateMode('pick'); }}
                style={{padding:"8px 18px",borderRadius:"6px",border:"none",background:"#7B1FA2",cursor:"pointer",fontSize:"13px",fontWeight:"bold",color:"#fff"}}>
                Yes, Cancel &amp; Start New
              </button>
            </div>
          </div>
        </div>
      )}

      {calloutModal && !calloutModal.done && calloutModal.minimized && (
        <div
          onClick={()=>setCalloutModal(prev=>prev?({...prev,minimized:false}):null)}
          style={{
            position:"fixed",bottom:"24px",right:"24px",zIndex:300,
            display:"flex",alignItems:"center",gap:"10px",
            background:"#0078d4",color:"white",
            padding:"10px 18px",borderRadius:"30px",
            boxShadow:"0 4px 16px rgba(0,0,0,0.3)",
            cursor:"pointer",fontSize:"13px",fontWeight:"bold",
            userSelect:"none",
          }}
          title="Restore Manual Placement"
        >
          <span>📍</span>
          <span>Manual Placement</span>
          <span style={{
            background:"rgba(255,255,255,0.25)",borderRadius:"12px",
            padding:"1px 8px",fontSize:"11px",fontWeight:"bold",
          }}>
            {calloutModal.allItems.filter(it=>it.placed).length}/{calloutModal.allItems.length}
          </span>
          <span style={{fontSize:"16px",marginLeft:"2px"}}>↑</span>
        </div>
      )}

      {/* Callout done modal */}
      {calloutModal?.done && (
        <div style={{...overlay,zIndex:200}}>
          <div style={mbox("440px")}>
            <div style={mhdr}><span style={{fontWeight:"bold",fontSize:"15px"}}>✅ PDF Annotated</span></div>
            <div style={{padding:"24px 20px",textAlign:"center"}}>
              <div style={{fontSize:"40px",marginBottom:"12px"}}>✅</div>
              <div style={{fontSize:"15px",fontWeight:"bold",color:C.green,marginBottom:"8px"}}>PDF annotated with {calloutModal.placed} callout{calloutModal.placed!==1?"s":""}!</div>
              <div style={{fontSize:"13px",color:"#555"}}>Downloaded as <strong>{calloutModal.outFileName}</strong></div>
              <div style={{fontSize:"12px",color:"#888",marginTop:"4px"}}>Contains annotated PDF + Excel spreadsheet</div>
            </div>
            <div style={{...mftr,justifyContent:"flex-end",gap:"8px"}}><button onClick={()=>{ if(calloutModal?.outUrl) triggerDownload(calloutModal.outUrl, calloutModal.outFileName); }} style={btn(C.green)}>⬇ Re-download</button><button onClick={()=>{ const u=calloutModal?.outUrl; setCalloutModal(null); if(u) URL.revokeObjectURL(u); }} style={btn(C.navy)}>Close</button></div>
          </div>
        </div>
      )}

      {/* Annotate PDF modal */}
      {annotateModal && (
        <div style={{...overlay, zIndex:200}}>
          <div style={{...mbox("440px")}}>
            <div style={mhdr}>
              <span style={{fontWeight:"bold",fontSize:"15px"}}>
                {annotateModal.done ? "✅ PDF Annotated" : "🗺 Annotating PDF…"}
              </span>
              {!annotateModal.annotating && !annotateModal.done && <CloseBtn onClick={()=>setAnnotateModal(null)}/>}
            </div>

            <div style={{padding:"24px 20px", textAlign:"center"}}>
              {annotateModal.annotating && (
                <div style={{fontSize:"14px",color:"#555",fontStyle:"italic"}}>⏳ Processing {annotateModal.fileName}…</div>
              )}
              {annotateModal.done && (
                <>
                  <div style={{fontSize:"40px",marginBottom:"12px"}}>✅</div>
                  <div style={{fontSize:"15px",fontWeight:"bold",color:C.green,marginBottom:"8px"}}>
                    PDF annotated with {annotateModal.placed} annotation{annotateModal.placed!==1?"s":""}!
                  </div>
                  <div style={{fontSize:"13px",color:"#555"}}>Downloaded as <strong>{annotateModal.outFileName}</strong></div>
                  <div style={{fontSize:"12px",color:"#888",marginTop:"4px"}}>Contains annotated PDF + Excel spreadsheet</div>
                </>
              )}
              {annotateModal.error && (
                <div style={{color:C.red,background:"#fff0f0",border:"1px solid #ffcdd2",borderRadius:"6px",padding:"10px 14px",fontSize:"13px",textAlign:"left"}}>{annotateModal.error}</div>
              )}
            </div>

            {!annotateModal.annotating && (
              <div style={{...mftr,justifyContent:"flex-end",gap:"8px"}}>
                <button onClick={()=>{ if(annotateModal?.outUrl) triggerDownload(annotateModal.outUrl, annotateModal.outFileName); }} style={btn(C.green)}>⬇ Re-download</button>
                <button onClick={()=>{ const u=annotateModal?.outUrl; setAnnotateModal(null); if(u) URL.revokeObjectURL(u); }} style={btn(C.navy)}>Close</button>
              </div>
            )}
          </div>
        </div>
      )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
