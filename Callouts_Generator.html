// Row background color based on block type — used in both table and PDF annotation
function blockTypeBg(bt) {
  if (!bt) return null;
  if (/\bHH\b|\bFDH\b/i.test(bt))                                         return "#CCFFCC"; // green
  if (/\bDAP\b|\bTOBY\s*BOX\b|\bMARKER\/CAP\b/i.test(bt))                return "#CCF5FF"; // cyan
  if (/\bBORE\s*&\s*PLACE\b|\bMISSILE\s*&\s*PLACE\b|\bD-BORE\b/i.test(bt)) return "#FFFFCC"; // yellow
  if (/\bHAND\s*DIG\b/i.test(bt))                                         return "#FFD9CC"; // salmon
  return "#E8E8E8";
}

// Sort rows by Item No. ascending (numeric-aware)
function sortKeyForItem(item) {
  // Extract all numbers from item (handles merged "3 & 7" -> use minimum)
  const nums = String(item).match(/\d+(\.\d+)?/g);
  if (!nums) return 0;
  return Math.min(...nums.map(Number));
}

function sortRowsByItem(rows) {
  return [...rows].sort((a, b) => sortKeyForItem(a.item) - sortKeyForItem(b.item));
}

// ── Filename grouping ──
function parseSheetKey(filename) {
  const base = filename.replace(/\.[^/.]+$/, "");
  const m = base.match(/^(.*?page\s*\d+)\.(\d+)\s*$/i);
  if (m) return { sheetKey: m[1].trim(), subNum: parseFloat(m[2]) };
  const m2 = base.match(/^(.*?page\s*\d+)\s*$/i);
  if (m2) return { sheetKey: m2[1].trim(), subNum: 0 };
  // Fallback: also match legacy "Sheet N" filenames
  const ms = base.match(/^(.*?sheet\s*\d+)\.(\d+)\s*$/i);
  if (ms) return { sheetKey: ms[1].trim(), subNum: parseFloat(ms[2]) };
  const ms2 = base.match(/^(.*?sheet\s*\d+)\s*$/i);
  if (ms2) return { sheetKey: ms2[1].trim(), subNum: 0 };
  return { sheetKey: base, subNum: 0 };
}
function naturalCompare(a, b) {
  const nA = parseFloat((a.match(/(\d+(?:\.\d+)?)$/) || [0,0])[1]);
  const nB = parseFloat((b.match(/(\d+(?:\.\d+)?)$/) || [0,0])[1]);
  return nA !== nB ? nA - nB : a.localeCompare(b);
}
function groupFilesBySheet(files) {
  const map = new Map();
  for (const file of files) {
    const { sheetKey, subNum } = parseSheetKey(file.name);
    if (!map.has(sheetKey)) map.set(sheetKey, []);
    map.get(sheetKey).push({ file, subNum });
  }
  return [...map.keys()].sort(naturalCompare).map(sk => ({
    sheetKey: sk,
    files: map.get(sk).sort((a,b) => a.subNum-b.subNum || a.file.name.localeCompare(b.file.name)).map(x=>x.file),
  }));
}

// ── OCR normalisation ──
function normalizeContent(line) {
  // FEEDER [letter(s)] N-N.N" → N-N.N" CONDUIT  (e.g. "FEEDER B 1-1.5"" → "1-1.5" CONDUIT")
  // FEEDER [letter(s)] N.N"   → N.N" CONDUIT     (e.g. "FEEDER A 1.5""   → "1.5" CONDUIT")
  // Handles optional hyphen/space between FEEDER and label: FEEDER-B, FEEDER B
  line = line.replace(
    /^FEEDER[-\s]+[A-Z]+\s+(\d+)-([\d.]+)"/i,
    (_, n, m) => n === "1" ? `${parseFloat(m)}" CONDUIT` : `${n}-${parseFloat(m)}" CONDUIT`
  ).replace(
    /^FEEDER[-\s]+[A-Z]+\s+([\d.]+)"/i,
    (_, m) => `${parseFloat(m)}" CONDUIT`
  );
  // Normalize double-apostrophe used as inch symbol: 1.5'' → 1.5"  (OCR artefact)
  line = line.replace(/(\d)''(?=[\s"\w,)]|$)/g, '$1"');
  let s = line
    .replace(/\bHFX\b/gi,"HEX").replace(/\bRTA-/gi,"RT4-").replace(/\bRTI-HEX\b/gi,"RT1-HEX")
    .replace(/\bRTZ-HEX\b/gi,"RT2-HEX").replace(/\bRTS-HEX\b/gi,"RT5-HEX")
    .replace(/HEX-1Z\b/gi,"HEX-12-WAY").replace(/HEX-Z4\b/gi,"HEX-24").replace(/HEX-Z\b/gi,"HEX-2-WAY")
    .replace(/(RT\d+-HEX-(?:24|12|2|1))\s+WAY/gi,"$1-WAY").replace(/(RT\d+-HEX-(?:24|12|2|1))WAY/gi,"$1-WAY")
    // R#-HEX-... → RT#-HEX-... (OCR drops the T)
    .replace(/\bR(\d+-HEX-(?:24|12|2|1)-WAY)\b/gi,"RT$1")
    .replace(/\bVPD8\b/gi,"PDB").replace(/\bPD8\b/gi,"PDB")
    // #F FIBER - #" CONDUIT → #F FIBER #" CONDUIT (remove erroneous hyphen separator)
    // Handles both: 48F FIBER - 1.5" CONDUIT and 48F FIBER - 1.5-2.5" CONDUIT
    .replace(/(\d+F\s+FIBER)\s*-\s*([\d.]+-[\d.]+")/gi,"$1 $2")
    .replace(/(\d+F\s+FIBER)\s*-\s*([\d.]+")/gi,"$1 $2")
    .replace(/\bLAT\s+(\d+)\s+(\d+)\s*,?\s*LONG\s+(-?\d+)\s+(\d+)/gi,
      (_,latInt,latDec,lngInt,lngDec)=>`LAT:${latInt}.${latDec}, LONG:${lngInt}.${lngDec}`);
  // Normalize all coordinate format variants to canonical LAT:xx.x, LONG:-xx.x
  // Handles: missing LAT/LONG labels, slash separators, extra spaces
  s = s.replace(
    /(?:LAT\s*[:/]?\s*)?(-?\d{1,3}\.\d{4,})\s*[,/]\s*(?:LONG\s*[:/]?\s*)?(-?\d{1,3}\.\d{4,})/gi,
    (_, lat, lng) => `LAT:${lat}, LONG:${lng}`
  );
  return s;
}

// ── Business logic ──
function getLineDiameter(line) {
  const hm = line.match(/HEX-(24|12|2|1)-WAY/i);
  if (hm) return DIAMETER_MAP[`${hm[1]}-WAY`] || 0;
  // "2X1.5 CONDUITS WITH 144 FIBER" → count * size
  const nxm = line.match(/(\d+)[xX]([\d.]+)\s*CONDUITS?\s+WITH/i);
  if (nxm) return parseInt(nxm[1]) * parseFloat(nxm[2]);
  // TFC normalized: "2-1.5 CONDUIT" (no quote) → count * size
  const nDash = line.match(/^(\d+)-([\d.]+)\s*CONDUIT$/i);
  if (nDash) return parseInt(nDash[1]) * parseFloat(nDash[2]);
  const cm = line.match(/^(\d+)[x\-]([\d.]+)"\s*CONDUITS?/i);
  if (cm) return parseInt(cm[1]) * parseFloat(cm[2]);
  const sc = line.match(/^([\d.]+)"\s*CONDUITS?/i);
  if (sc) return parseFloat(sc[1]);
  return 0;
}
function getLineTypeCode(lineTypes, boreCallout, isRock, depth) {
  if (!lineTypes) return "";
  const lines = lineTypes.split("\n");
  const total = lines.reduce((s,l) => s + getLineDiameter(l), 0);
  const hasConduit = lines.some(l => /CONDUITS?/i.test(l));
  const isBore = /BORE\s*&\s*PLACE/i.test(boreCallout);
  const isMissile = /MISSILE/i.test(boreCallout);
  const isHand = /HAND DIG|\bHD\b/i.test(boreCallout);
  // D-BORE format: extract max diameter from range (e.g. "3.5"-4.5"" → 4.5)
  const dBoreMatch = boreCallout?.match(/D-BORE\s+(?:UP\s+TO\s+)?([\d.]+)"?(?:\s*-\s*([\d.]+)")?/i);
  const isDbore = isBore || !!dBoreMatch;
  let boreDia = total; // default: use line type total diameter
  if (dBoreMatch && total === 0) {
    // No line types to calculate from — use D-BORE diameter directly
    boreDia = parseFloat(dBoreMatch[2] || dBoreMatch[1]);
  }
  // Select directional bore code based on diameter and rock flag:
  //   Standard: TCBDB2 (≤4"), TCBDB4 (>4"–7"), TCBDB5 (>7")
  //   Rock:     TCBDB8 (≤4"), TCBDB9 (>4")
  function dboreCode(dia) {
    if (dia <= 4) return isRock ? "TCBDB8" : "TCBDB2";
    if (dia <= 7) return isRock ? "TCBDB9" : "TCBDB4";
    if (isRock) return "TCBDB9"; // rock caps at TCBDB9 for >7"
    return "TCBDB5"; // >7" standard (no upper cap)
  }
  // Select hand dig code based on depth:
  //   TCBHD1: ≤ 0.5'   TCBHD2: ≤ 1'   TCBHD3: ≤ 1.5'   TCBHD4: ≤ 2'
  //   TCBHD5: ≤ 3' (default when no depth)   TCBHD6: ≤ 4'   TCBHD7: > 4'
  function handDigCode() {
    const depthStr = String(depth || "").trim();
    const dm = depthStr.match(/([\d.]+)/);
    if (!dm) return "TCBHD5"; // no depth indicated → default
    const d = parseFloat(dm[1]);
    if (d <= 0.5) return "TCBHD1";
    if (d <= 1)   return "TCBHD2";
    if (d <= 1.5) return "TCBHD3";
    if (d <= 2)   return "TCBHD4";
    if (d <= 3)   return "TCBHD5";
    if (d <= 4)   return "TCBHD6";
    return "TCBHD7";
  }
  const codes = [];
  if (isHand) codes.push(handDigCode());
  else if (isMissile) codes.push(boreDia <= 4 ? "TCBMB1" : "TCBMB2");
  else if (isDbore) codes.push(dboreCode(boreDia));
  if (hasConduit) codes.push("TCMB7");
  return codes.join(", ");
}
// Normalize conduit label: "2x2.5" CONDUITS" → "2-2.5" CONDUIT", "1.5" CONDUIT" → "1.5" CONDUIT"
function normConduit(s) {
  // Normalize R#-HEX-... → RT#-HEX-... (missing T prefix from OCR misread)
  s = s.replace(/^R(\d+-HEX-)/i, "RT$1");
  // TFC format: "2X1.5 CONDUIT WITH 144 FIBER" (CONDUITS already replaced) → "2-1.5 CONDUIT"
  s = s.replace(/^(\d+)[xX]([\d.]+)\s*CONDUITS?\s+WITH\s+\d+\s*FIBER$/i, (_, n, m) => {
    const mN = parseFloat(m);
    return n === "1" ? `${mN} CONDUIT` : `${n}-${mN} CONDUIT`;
  });
  // TFC format: "2X1.5 CONDUITS" (no WITH FIBER) → "2-1.5 CONDUIT"
  s = s.replace(/^(\d+)[xX]([\d.]+)\s*CONDUITS?$/i, (_, n, m) => {
    const mN = parseFloat(m);
    return n === "1" ? `${mN} CONDUIT` : `${n}-${mN} CONDUIT`;
  });
  return s
    .replace(/^(\d+)[\-x]([\d.]+)"\s*CONDUITS?$/i, (_, a, b) => {
      const bN = parseFloat(b);
      return a === "1" ? `${bN}" CONDUIT` : `${a}-${bN}" CONDUIT`;
    })
    .replace(/^([\d.]+)"\s*CONDUITS?$/i, (_, n) => `${parseFloat(n)}" CONDUIT`);
}

// Format a raw length token into (90') canonical form
function fmtLen(s) {
  if (!s) return "";
  const num = s.replace(/[()'']/g, "").trim();
  return `(${num}')`;
}

function processRow(r) {
  const all = r.content.join(" ");
  const hasDAP       = r.content.some(l => /\bDAP\w*/i.test(l.trim()));
  // MARKER/CAP: matches "NEW LOCATOR MARKER/CAP", "MARKER/CAP", "LOCATOR MARKER/CAP" and variations
  const hasMarkerCap = /MARKER\s*\/\s*CAP|LOCATOR\s+MARKER/i.test(all);
  const hasToby      = /\bTOBY BOX\b|\bTB\b/i.test(all);
  const hasFDH       = /\bFDH\b|\bFDT\b/i.test(all);
  // HH: match "HH" standalone, or "PLACE NEW...HH", or "HH (TIER" patterns
  const hasHH        = /\bHH\b/i.test(all);
  const hasReamer    = /\bREAMER\b/i.test(all);
  // If content has REAMER but no explicit BORE keyword, the model dropped the BORE & PLACE line.
  // Infer hasBore so Block Type, Bore Callout, Line Type Code and Depth still populate correctly.
  const hasAdder   = /\bROCK\s+ADDER\b|\bROCK\b|\bADDER\b/i.test(all);
  const hasBore    = /\bPDB\b|\bBORE\b|\bD-BORE\b/i.test(all) || (hasReamer && !/\bHAND\b|\bHD\b|\bMISSILE\b|\bMB\b/i.test(all)) || hasAdder;
  const hasHand    = /\bHAND\b|\bHD\b/i.test(all);
  const hasMissile = /\bMISSILE\b|\bM-BORE\b|\bMB\b/i.test(all);
  const hasRock    = /\bROCK\b/i.test(all) || hasAdder;
  const has4x4     = /4'?\s*[xX]\s*4'?/.test(all);
  const hasEquipment = hasDAP || hasMarkerCap || hasToby || hasFDH || hasHH;
  const hasBorePit = /\bBORE\s*PIT\b|\bBOREPIT\b|\bPIT\b/i.test(all);
  // TFC-style: STA line with BOREPIT (no equipment) — treat as bore
  const isTFCBorePit = /\bBOREPIT\b/i.test(all) && !hasEquipment;
  // Pure pit callout: content is essentially just "BOREPIT" or "BORE PIT" with no bore footage,
  // no reamer, no cable types — blockType should be PIT, not BORE & PLACE.
  // Matches: "BOREPIT", "BORE PIT", "DIG BORE PIT", "DIG BORE PIT TO ACCESS VAULT", etc.
  // Does NOT match TFC STA lines like "STA: 3+19 BOREPIT LAT:..." which have bore context.
  const isPureBorePit = (() => {
    if (hasEquipment || hasHand || hasMissile) return false;
    const hasBoreFootage = /\b\d+'/.test(all); // any footage → real bore action
    if (hasBoreFootage) return false;
    // Must contain BOREPIT or BORE PIT as the primary action
    if (!/\bBORE\s*PIT\b|\bBOREPIT\b/i.test(all)) return false;
    // Exclude TFC STA lines that happen to contain BOREPIT — they have STA: prefix
    if (/\bSTA[.:]\s*[\d+]+/i.test(all)) return false;
    return true;
  })();


  // Equipment callout lines
  const callouts = [];
  // Detect TCSSM from DAP WAY-count:
  //   DAP-##-WAY or DAP##-##-WAY → WAY number is TCSSM
  //   Plain DAP → TCSSM 0 (displayed as empty parens)
  const dapWayM = all.match(/\bDAP\w*[-\s]+(\d+)-WAY/i);
  const dapTcssm = dapWayM ? parseInt(dapWayM[1]) : 0;
  const dapTcssmStr = dapTcssm > 0 ? `TCSSM(${dapTcssm})` : "TCSSM()";
  if (hasDAP && hasToby) {
    callouts.push("TB/DAP", "TCM8(1), TMBT(1)"); // TCSSM excluded for now
  } else {
    if (hasDAP && hasMarkerCap) callouts.push("MC/DAP, TCM8(1)"); // TCSSM excluded for now
    else if (hasDAP)            callouts.push("DAP, TCM8(1)"); // TCSSM excluded for now
    else if (hasMarkerCap)      callouts.push("MC");
    if (hasToby) callouts.push("TOBY BOX, TMBT(1)");
  }
  if (hasFDH) {
    // Detect FDH/FDT mount type from keywords
    const fdhCode =
      /\bFDT\b.*\bBUILD\b|\bBUILD.*\bFDT\b|\bSFU\b|\bMDU\b|\bMTU\b/i.test(all)  ? "TCMU9"  :
      /\bFDT\b.*\bVAULT\b|\bVAULT.*\bFDT\b/i.test(all)                              ? "TCMU5"  :
      /\bFDT\b.*\bPOLE\b|\bPOLE.*\bFDT\b/i.test(all)                                ? "TCMU6"  :
      /\bFDT\b.*\bWALL\b|\bFDT\b.*\bRACK\b|\bWALL.*\bFDT\b|\bRACK.*\bFDT\b/i.test(all) ? "TCMU7"  :
      /\bFDT\b.*\bSUB\b|\bSUB.*\bFDT\b/i.test(all)                                  ? "TCMU8"  :
      /\bFDT\b/i.test(all)                                                             ? "TCMU5"  :  // FDT default
      /\bVAULT\b.*\bFDH\b|\bFDH\b.*\bVAULT\b/i.test(all)                           ? "TCMU1"  :
      /\bPOLE\b.*\bFDH\b|\bFDH\b.*\bPOLE\b/i.test(all)                             ? "TCMU2"  :
      /\bWALL\b.*\bFDH\b|\bFDH\b.*\bWALL\b|\bRACK\b.*\bFDH\b|\bFDH\b.*\bRACK\b/i.test(all) ? "TCMU3" :
      /\bSUB.?SURFACE\b.*\bFDH\b|\bFDH\b.*\bSUB.?SURFACE\b/i.test(all)             ? "TCMU4"  :
      "TCMU4A";  // default: Swing Arm FDH / plain FDH
    // Use FDT label if FDT keyword present, otherwise FDH
    const fdhLabel = /\bFDT\b/i.test(all) ? "FDT" : "FDH";
    // Detect TCSSM count from FDH content: "SWING ARM-96", "96-FDH", "144 FDH", etc. Default 96.
    const fdhFiberM = all.match(/(?:SWING[-\s]*ARM[-\s]*(\d+)|(\d+)[-\s]*FDH|(\d+)\s+FDH)/i);
    const fdhTcssm = fdhFiberM ? parseInt(fdhFiberM[1] || fdhFiberM[2] || fdhFiberM[3]) : 96;
    callouts.push(`${fdhLabel}, ${fdhCode} (1)`); // TCSSM excluded for now
  }
  if (hasHH) {
    // Detect HH size from keywords; default to TCMB3C (24"x36"x24")
    const hhCode =
      /36["']?\s*[xX×]\s*48|48["']?\s*[xX×]\s*36/i.test(all)  ? "TCMB4"  :
      /17["']?\s*[xX×]\s*30|30["']?\s*[xX×]\s*24.*17|TIER\s*1[89]|TIER\s*2[01]/i.test(all) ? "TCMB3B" :
      /13["']?\s*[xX×]\s*24|24["']?\s*[xX×]\s*18.*13|TIER\s*[1-9](?![0-9])/i.test(all)    ? "TCMB3A" :
      "TCMB3C";  // default: 24"x36"x24"
    callouts.push(`HH, ${hhCode} (1)`);
  }
  if (hasFDH || hasHH) callouts.push("TCMB10(3'), TCMB11(1)");

  // Coordinates — always populate from GPS if equipment type includes MARKER/CAP or DAP
  const latLong    = all.match(LAT_LONG_RE);
  const coordLine  = r.content.find(l => COORD_REGEX.test(l.trim()));
  const degreeLine = r.content.find(l => DEGREE_REGEX.test(l.trim()));
  const degreeMatch = degreeLine?.match(DEGREE_REGEX);
  // skipCoords: skip for plain pit/borepit rows that have no equipment and no inline coords
  const skipCoords = (has4x4 && !hasEquipment) || (hasBorePit && !hasEquipment && !latLong && !degreeLine);
  const coordinates = skipCoords ? ""
    : latLong    ? `${latLong[1]}, ${latLong[2]}`
    : degreeMatch ? `${degreeMatch[1]}, ${degreeMatch[2]}`
    : coordLine  ? coordLine.trim() : "";

  // Length extraction — prefer explicit (90') form, fall back to bare number
  // Also handle TFC format: "PDB 60' 2X1.5 CONDUITS WITH 144 FIBER"
  const lenM  = all.match(/(\(\d+'\))/) || all.match(/\b(\d+)'(?!\))/)
              || all.match(/(\(\d+\))/) || all.match(/\bPDB\s+(\d+)'\b/i)
              || all.match(/\bPDB\s+(\d+)\b/i);
  const rawLen = lenM ? lenM[1] : null;
  const lenSfx = rawLen ? ` ${fmtLen(rawLen)}` : "";

  // SEE SHEET override
  const seeSheetMatch = all.match(/\bSEE\s+SHEET\s+(\d+)\b/i);

  // Bore callout
  let boreCallout;
  if (seeSheetMatch) {
    boreCallout = `SEE SHEET ${seeSheetMatch[1]}`;
  } else {
    const boreParts = [];
    // Check for D-BORE format (diameter embedded in action line) — normalize to BORE & PLACE
    const dBoreMatch = all.match(/D-BORE\s+(UP\s+TO\s+[\d.]+"|[\d.]+-[\d.]+")\s*DIA\.?\s*\((\d+)'\)/i);
    if (dBoreMatch) {
      boreParts.push(`BORE & PLACE (${dBoreMatch[2]}')`);
    } else if (!isPureBorePit && (hasBore || isTFCBorePit)) {
      boreParts.push(`BORE & PLACE${lenSfx}`);
    }
    if (hasHand)    boreParts.push(`HAND DIG${lenSfx}`);
    if (hasMissile) boreParts.push(`MISSILE & PLACE${lenSfx}`);
    boreCallout = boreParts.join(", ");
  }

  // Line types
  const lineTypes = seeSheetMatch ? "" : r.content
    .flatMap(l => [...l.matchAll(CABLE_RE)].map(m =>
      normConduit(m[0].toUpperCase().replace(/CONDUITS\b/g, "CONDUIT"))
    ))
    .join("\n");

  const lineTypeList   = lineTypes ? lineTypes.split("\n").map(l => l.trim()).filter(Boolean) : [];

  // Block type
  const bt = [];
  if (hasDAP && hasMarkerCap) bt.push("MARKER/CAP, DAP");
  else if (hasDAP)            bt.push("DAP");
  else if (hasMarkerCap)      bt.push("MARKER/CAP");
  if (hasToby) bt.push("TOBY BOX");
  if (hasHH)   bt.push("HH");
  if (hasFDH)  bt.push("FDH");
  // Distinguish D-BORE from standard BORE & PLACE; append ROCK if detected
  const dBoreActionMatch = all.match(/D-BORE\s+(UP\s+TO\s+[\d.]+"|[\d.]+-[\d.]+")\s*DIA\./i);
  if (isPureBorePit) bt.push("PIT");
  else if (dBoreActionMatch || hasBore || isTFCBorePit) bt.push(hasRock ? "BORE & PLACE (ROCK)" : "BORE & PLACE");
  if (hasHand)    bt.push("HAND DIG & PLACE");
  if (hasMissile) bt.push("MISSILE & PLACE");

  const finalBoreCallout = seeSheetMatch ? `SEE SHEET ${seeSheetMatch[1]}`
    : boreCallout;

  const initialDepth = (seeSheetMatch || isPureBorePit) ? "" : finalBoreCallout ? "3'" : "";
  return {
    item:             r.item,
    blockType:        bt.join(", "),
    content:          r.content.join("\n"),
    equipmentCallout: callouts.join("\n"),
    coordinates,
    boreCallout:      finalBoreCallout,
    lineType:         lineTypes,
    lineTypeCode:     seeSheetMatch ? "" : getLineTypeCode(lineTypes, finalBoreCallout, hasRock, initialDepth),
    eop:              "",
    depth:            initialDepth,
    date:             "",
  };
}

function applyCoordRules(rows) {
  const isFDH = r => /\bFDH\b/i.test(r.blockType);
  const isHHonly = r => /\bHH\b/i.test(r.blockType) && !isFDH(r);
  const fdhCoords = new Set(rows.filter(r => isFDH(r) && r.coordinates.trim()).map(r => r.coordinates.trim()));
  for (const row of rows) {
    if (isHHonly(row) && row.coordinates.trim() && fdhCoords.has(row.coordinates.trim())) {
      row.equipmentCallout = ""; row.coordinates = "";
    }
  }
  const isToby = r => /\bTOBY BOX\b/i.test(r.blockType);
  const isDAPonly = r => /\bDAP\b|\bMARKER\/CAP\b/i.test(r.blockType) && !isToby(r);
  const tobyByCoord = new Map();
  for (const row of rows) { if (isToby(row) && row.coordinates.trim()) tobyByCoord.set(row.coordinates.trim(), row); }
  for (const row of rows) {
    if (!isDAPonly(row) || !row.coordinates.trim()) continue;
    const tobyRow = tobyByCoord.get(row.coordinates.trim());
    if (!tobyRow) continue;
    // Merge into TB/DAP format regardless of order
    tobyRow.blockType = tobyRow.blockType.replace(/\bTOBY BOX\b/i, "TOBY BOX, DAP").replace(/\bDAP\b,?\s*/i, "");
    tobyRow.blockType = "TOBY BOX, DAP"; // normalize
    tobyRow.equipmentCallout = "TB/DAP\nTCM8(1), TMBT(1)";
    row.equipmentCallout = ""; row.coordinates = "";
  }
}

// ── Merge detection & splitting ──
// A callout is either EQUIPMENT type (DAP/TOBY BOX/FDH/HH + pit info) OR BORE type
// (BORE & PLACE / HAND DIG / MISSILE + cable/reamer info). They never coexist in a
// single callout unless the user manually merges rows. If the AI merges two adjacent
// callouts into one, we split them here before processing.

const BORE_ACTION_RE  = /^(BORE\s*&\s*PLACE|HAND\s*DIG\s*&?\s*(?:PLACE)?|MISSILE\s*&\s*PLACE|PDB\b|D-BORE\b|M-BORE\b)/i;
const EQUIP_SIGNAL_RE = /\b(DAP[-\d]*\s*-?\s*WAY|DAP\b|TOBY\s*BOX|FDH\b|HH\b|MARKER\s*\/\s*CAP|LOCATOR\s+MARKER)\b/i;
const DIG_PIT_RE      = /^DIG\s+4'?\s*[xX]\s*4'?\s*PIT/i;

function splitMergedRow(item, content) {
  // Strategy 1: Find a bore action line that appears AFTER equipment signals (or vice versa).
  // E.g.: ["BORE & PLACE (98')", "REAMER...", "RT1-HEX-24-WAY", "DIG 4'X4' PIT", "DAP-8-WAY IN PIT", ...]
  let equipStart = -1, boreStart = -1;
  for (let j = 0; j < content.length; j++) {
    const l = content[j].trim();
    if (boreStart === -1 && BORE_ACTION_RE.test(l)) boreStart = j;
    if (equipStart === -1 && EQUIP_SIGNAL_RE.test(l)) equipStart = j;
  }

  let splitAt = -1;

  if (equipStart !== -1 && boreStart !== -1) {
    // Both types present — split at whichever starts second
    splitAt = boreStart < equipStart ? equipStart : boreStart;
  }

  // Strategy 2: A "DIG 4'X4' PIT" line embedded AFTER the first line of content
  // signals the start of a new equipment callout — split there.
  // (The first line may itself be a DIG PIT, so only look from index 1 onward)
  if (splitAt === -1) {
    for (let j = 1; j < content.length; j++) {
      if (DIG_PIT_RE.test(content[j].trim())) {
        splitAt = j;
        break;
      }
    }
  }

  // No merge detected or can't split at start — return as-is
  if (splitAt <= 0) return [{ item, content }];

  const part1 = content.slice(0, splitAt);
  const part2 = content.slice(splitAt);
  if (!part1.length || !part2.length) return [{ item, content }];

  // Use the same item number for both — duplicate warning will surface to user
  return [
    { item, content: part1 },
    { item, content: part2, _splitFrom: item },
  ];
}

function parseImageText(text) {
  // Strip AI meta-commentary lines before parsing — these should never appear in output
  // but occasionally slip through (column headers, markdown markers, list-of-numbers commentary)
  const JUNK_LINE_RE = /^\*\*|^#{1,3}\s|^-{3,}$|sub-column|^left\s|^middle\s|^right\s|^column\s|^this\s+is\s+a\s+type\s|^i['']ll\s|^i\s+will\s|^here\s+are\s|^i\s+can\s|^i\s+see\s|^i\s+notice\s|^reading\s+all\s|^let\s+me\s|^based\s+on\s|^the\s+following\s|^below\s+are\s|^these\s+are\s|^now\s+i\s|^extracting\s/i;
  const COMMENTARY_RE = /^(?:this\s+is\s+a\s+type|i['']ll\s+extract|i\s+will\s+extract|reading\s+(?:all\s+)?column|here\s+are\s+the|let\s+me\s+read|now\s+(?:reading|extracting)|the\s+page\s+(?:is|has|contains)|extracting\s+all)/i;
  const lines = text.split("\n").map(l => l.trim()).filter(l => l && !JUNK_LINE_RE.test(l));
  const rows = []; let i = 0;
  while (i < lines.length) {
    const m = lines[i].match(/^[（(]?(\d+)[)）]\s*(.*)/);
    if (m) {
      const item = parseInt(m[1]);
      const content = m[2].trim() ? [m[2].trim()] : [];
      i++;
      while (i < lines.length && !lines[i].match(/^[（(]?\d+[)）]/)) {
        const cl = lines[i];
        // Skip lines that are AI meta-commentary absorbed as content
        if (!/^[,\s]*[\(\（]\d+[\)\）]/.test(cl) && !COMMENTARY_RE.test(cl)) content.push(cl);
        i++;
      }
      if (content.length) {
        // Split any illegally merged equipment+bore rows
        const split = splitMergedRow(item, content);
        rows.push(...split);
      }
    } else i++;
  }
  const seen = new Map();
  for (const r of rows) seen.set(r.item, (seen.get(r.item)||0)+1);
  const dupes = [...seen.entries()].filter(([,c]) => c>1).map(([n]) => `(${n})`);
  const dupWarning = dupes.length ? `⚠️ Duplicate item number${dupes.length>1?"s":""} detected: ${dupes.join(", ")}` : "";
  const processed = rows.sort((a,b) => a.item-b.item).map(r => { r.content = r.content.map(normalizeContent); return r; }).map(processRow);
  applyCoordRules(processed);
  return { rows: processed, dupWarning };
}

// ── I/O helpers ──
function readFileAsBase64(file) {
  return new Promise((res,rej) => {
    const reader = new FileReader();
    reader.onload = e => res({ base64: e.target.result.split(",")[1], mediaType: file.type||"image/jpeg", name: file.name });
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}
async function extractFromImage(img) {

    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:8000, messages:[{ role:"user", content:[

// Concurrency-limited pool — runs up to `limit` tasks simultaneously
async function withConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

// Global semaphore — caps simultaneous OCR extractions at 5 across all concurrent calls
function makeSemaphore(max) {
  let active = 0;
  const queue = [];
  return async function acquire() {
    if (active < max) { active++; return () => { active--; if (queue.length) queue.shift()(); }; }
    return new Promise(resolve => queue.push(() => { active++; resolve(() => { active--; if (queue.length) queue.shift()(); }); }));
  };
}
const extractSemaphore = makeSemaphore(3);

// Retry wrapper — retries on 429, 529, 500, timeout up to 3 times with backoff
async function fetchWithRetry(url, options, maxRetries = 3, timeoutMs = 45000) {
  let lastErr;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(timer);
      if ((res.status === 429 || res.status === 529 || res.status >= 500) && attempt < maxRetries) {
        const retryAfter = res.status === 429
          ? parseInt(res.headers.get("retry-after") || "10", 10)
          : Math.pow(2, attempt + 1) * 3; // exponential backoff: 6s, 12s, 24s
        console.warn(`[fetchWithRetry] HTTP ${res.status}, retrying in ${retryAfter}s (attempt ${attempt+1}/${maxRetries+1})`);
        await new Promise(r => setTimeout(r, retryAfter * 1000));
        continue;
      }
      return res;
    } catch(e) {
      clearTimeout(timer);
      lastErr = e;
      if (attempt < maxRetries) {
        const delay = Math.pow(2, attempt + 1) * 3; // 6s, 12s, 24s
        console.warn(`[fetchWithRetry] ${e.name} on attempt ${attempt+1}, retrying in ${delay}s`);
        await new Promise(r => setTimeout(r, delay * 1000));
        continue;
      }
    }
  }
  throw lastErr || new Error("fetchWithRetry: all attempts exhausted");
}

async function extractAll(imgs, onProgress) {
  return Promise.all(imgs.map(async (img, i) => {
    const release = await extractSemaphore();
    onProgress(i, "extracting", null, Date.now());  // pass startedAt
    try {
      const text = await extractFromImage(img);
      onProgress(i, "done", text);
      return { ...img, status: "done", _text: text };
    } catch {
      onProgress(i, "error");
      return { ...img, status: "error" };
    } finally {
      release();
    }
  }));
}

// ── Text layer cleaning ──
// Strip known noise patterns from PDF text layers before sending to the model.
// These patterns appear on layout plan pages but are NOT callout content:
//   - Route/duct service labels:  "ROUTE: DUCT: COLOR: 18101 03 21 BROWN"
//   - Compound route labels:      "14834 ROUTE:02 DUCT:13 COLOR:ROSE"
//   - Road/survey labels:         "BORE", "BOC", "C/L", "R/W", "PL", "E/P"
//   - Dimension values:           "50'", "15'", "10'" on their own line
//   - FCU table rows:             "D-BORE UP TO 2.5" DIA  601'"
//   - BOM / material list rows    "HEX-2-WAY  MPB302782UV8  2x7/3.5mm ..."
//   - Profile references:         "SEE PROFILE-01 ON SHEET-16"
const NOISE_LINE_RE = [
  /ROUTE\s*[:.]?\s*\d/i,                               // any line containing ROUTE: followed by number
  /DUCT\s*[:.]?\s*\d/i,                                // any line containing DUCT: followed by number
  /COLOR\s*[:.]?\s*[A-Z]/i,                            // any line containing COLOR: followed by text
  /^\s*(BOC|C\/L|R\/W|PL|E\/P|BORE|TRENCH)\s*$/i,   // survey line labels on their own
  /^\s*\d+'\s*$/,                                      // bare dimension like "50'"
  /^\s*[\d.]+'\s+[\d.]+'\s*$/,                         // "15' 10'"
  /^D-BORE\s+(UP\s+TO\s+[\d."]+\s+DIA|[\d.]+"-[\d."]+\s+DIA)/i,  // FCU table rows
  /^HAND\s+DIG\s+\d+"-\d+"\s+COVER/i,
  /^HEX-(1|2|12|24)-WAY\s+\d+['"]?/i,
  /^MARKER\s+BALL\s+\d+/i,
  /^\d+\s+STINGRAY\s+\d+['"]?/i,
  /^FIBER\s+\d+F\s+\d+/i,
  /^LOCATOR\s+MARKER\/CAP\s+\d+/i,
  /^SPLICE\s+DAP\s+\d+/i,
  /^SEE\s+PROFILE[-\s]\d+\s+ON\s+SHEET/i,
  /^MATCH\s+TO\s+SHEET\s+\d+/i,
  /^\s*\d{4,6}\s+\d{2,3}\s+\d{2,3}\s*$/,             // raw numeric route-duct-duct triplets
  /^\(CONTINUED\s+(TO|FROM)\s+SHEET\s+\d+\)$/i,       // BHUD: "(CONTINUED TO SHEET 06)"
  /^CONTINUED\s+(TO|FROM)\s+SHEET\s+\d+/i,             // BHUD: "CONTINUED FROM SHEET 05"
  /^DUCT\s+\d\s*:\s*\d+\s*FIBER/i,                    // BHUD: "DUCT 1: 144 FIBER"
  /^DEAD\s*,\s*\d+-\d+/i,                              // BHUD fiber label: "DEAD, 1-46"
  /^[A-Z]{2,6}\d{2}[A-Z]{2,6}\d{2,3}\s*,\s*(TX|RX)/i,// BHUD fiber label: "LF03LF01, RX (E)"
  /^FLF-\d{2}-[EW][-\d]*\s+\d+\s*FIBER/i,             // BHUD fiber assignment: "FLF-01-E-2 144 FIBER"
  /^SURFACE\s+TYPE\s+/i,                               // BHUD: "SURFACE TYPE DIRT / SOD"
  /^\d+\s+SQ\.\s*FT\.?$/i,                            // BHUD: "16 SQ. FT."
  /^\(#\d+\)\s+BORE\s+PIT\s+\(\d+'X\d+'\)/i,         // BHUD: "(#2) BORE PIT (4'X4')"
];
function cleanTextLayer(rawText) {
  if (!rawText) return "";
  return rawText
    .split("\n")
    .filter(line => {
      const t = line.trim();
      if (!t) return false;
      if (NOISE_LINE_RE.some(re => re.test(t))) return false;
      return true;
    })
    .join("\n");
}

// ── PDF skip filter ──
// Skip cover/legend/reference pages that never contain numbered construction callouts.
// Layout prints (Sheet 05, 5A, 06–15 and their supplements like 8A, 10A, 13A) DO have callouts.
// We detect skippable pages by title-block content, not by page index, because supplement
// sheets (5A, 8A, 10A, 13A) come right after their base sheet and MUST be processed.
const SKIP_TITLE_PATTERNS = [
  // Pure reference/detail pages — confirmed no numbered callouts
  /^bore\s*profiles?\s*$/im,                   // page title is exactly "BORE PROFILE(S)" — not a reference phrase
  /^bp\d+\s*$/im,                              // "BP1", "BP2" etc. — bore profile diagram labels
  /looking\s*(east|west|north|south)/i,         // "TIMBERCREST DR LOOKING EAST" — bore profile diagram captions
  /minimum\s*standards?\s*for\s*boring/i,       // "MINIMUM STANDARDS FOR BORING"
  /hexatronic\s*methods?\s*\(/i,
  /hexatronic\s*pre.?configured\s*underground\s*fdh/i,
  /typical\s*handhole\s*details?/i,
  /toby\s*box\s*details?/i,
  /typical\s*bore\s*details?/i,
  /bill\s*of\s*materials?/i,
  /splice\s*details?\s*#/i,
  /general\s*abbreviations?\s*&\s*legends?/i,
  /this\s*print\s*is\s*for\s*reference\s*only/i,  // BHUD adjacent-site reference pages
  /^splice\s*details?\s*$/im,                      // "SPLICE DETAILS" title page
  /^typical\s*details?\s*$/im,                     // "TYPICAL DETAILS" title page
  /^temporary\s*traffic\s*control\s*plan\s*$/im,  // "TEMPORARY TRAFFIC CONTROL PLAN" title page
];

// Sheet IDs that are purely reference sheets (no callouts)
function shouldSkipPage(pageIndex, pageText) {
  if (!pageText) return false;
  // Check title patterns in the first ~800 chars of text (title may not be first due to NOTE blocks)
  const head = pageText.slice(0, 800);
  if (SKIP_TITLE_PATTERNS.some(re => re.test(head))) return true;
  // First 4 pages are always cover/legends/notes/hexatronic methods (0-indexed)
  if (pageIndex < 4) return true;
  return false;
}

// ── PDF helpers ──
// Correct common OCR misreads in sheet IDs from the title block.
// The title block font can cause digit confusion (5↔6, 0↔6, 8↔6 etc).
// We cross-check against the known sheet list for this project and snap
// to the closest valid sheet when the raw read doesn't match.



// Keywords that must appear in at least one callout line for it to be a real callout.
const CALLOUT_ACTION_RE = /D-BORE\s+UP|BORE\s*[&(]|BORE\s*&\s*PLACE|HAND\s*DIG|DIG\s*4'?\s*[Xx]|PL\.\s*NEW|PL\.\s*TOBY|TOBY\s*BOX|\bDAP\b|\bFDH\b|\bHH\b|MISSILE\s*&|\bMB\b|BOREPIT|BORE\s*PIT|STA[.:]\s*\d|PDB\s+\d+|DIG\s+BORE\s+PIT|EXISTING\s+ACCESS\s+POINT|PDB\s+\d+'?\s*RT|REAMER\s+UP\s+TO|REAMER\s+[\d.]+\"|REMOVE\s+AND\s+RESTORE|NEW\s+LOCATOR\s+MARKER|SERVES\s+\d{4,5}/i;

function parsePdfPageResult(text) {
  if (/NO_CALLOUTS/i.test(text)) return { hasCallouts:false, calloutsText:"" };
  const calloutsText = text.trim();
  const CALLOUT_NUM_RE = /^\s*\((\d{1,3})\)\s*(.*)$/;
  const lines = calloutsText.split("\n");
  const hasRealCallout = lines.some((line, i) => {
    const m = line.match(CALLOUT_NUM_RE);
    if (!m) return false;
    if (CALLOUT_ACTION_RE.test(m[2])) return true;
    const next1 = lines[i + 1] || "";
    const next2 = lines[i + 2] || "";
    return CALLOUT_ACTION_RE.test(next1) || CALLOUT_ACTION_RE.test(next2);
  });
  return { hasCallouts: hasRealCallout && calloutsText.length > 0, calloutsText };
}

function groupPdfPages(pageResults) {
  // Each page with callouts becomes its own entry — user sets the sheet name after extraction
  return [...pageResults]
    .filter(p => p.hasCallouts)
    .sort((a, b) => a.pageIndex - b.pageIndex)
    .map(p => ({
      tabName: `Page ${p.pageIndex + 1}`,
      pages: [p],
    }));
}
async function extractPdfPage(base64, pageIndex, onProgress, preSkipped, pageText) {
  // Fast path: skip API call entirely for known non-callout page types
  if (preSkipped) {
    onProgress(pageIndex, "skipped", { hasCallouts:false, calloutsText:"" });
    return { pageIndex, hasCallouts:false, calloutsText:"" };
  }
  onProgress(pageIndex, "extracting");
  try {
    const cleaned = cleanTextLayer(pageText);
    const textLayerBlock = cleaned?.trim()
      ? { type:"text", text:`TEXT LAYER (raw PDF text, sorted top-to-bottom then left-to-right; route/duct labels and FCU table rows have been pre-filtered but multi-column sidebar text may still be interleaved with drawing-area text on the same row. Use this ONLY to verify exact spelling of callout text you can already see in the image — do NOT use it to determine callout structure, order, or which items exist. The IMAGE is the sole authoritative source for structure):\n${cleaned.trim()}` }
      : null;
    const res = await fetchWithRetry("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:8000, messages:[{ role:"user", content:[
        { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:base64 } },
        ...(textLayerBlock ? [textLayerBlock] : []),
        { type:"text", text:PDF_PROMPT }
      ]}]}),
    });
    // Guard against res.json() hanging — wrap with a 15s race
    const data = await Promise.race([
      res.json(),
      new Promise((_,rej) => setTimeout(() => rej(new Error("json() timeout")), 15000))
    ]);
    // Check for API-level error response (e.g. overloaded, invalid request)
    if (data.error) {
      const errMsg = data.error.message || data.error.type || JSON.stringify(data.error);
      console.warn(`[extractPdfPage] Page ${pageIndex} API error: ${errMsg}`);
      onProgress(pageIndex, "error", null, errMsg);
      return { pageIndex, hasCallouts:false, calloutsText:"", errorMsg: errMsg };
    }
    const text = (data.content || []).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const result = parsePdfPageResult(text);
    onProgress(pageIndex, result.hasCallouts ? "done" : "skipped", result);
    return { pageIndex, ...result };
  } catch(e) {
    const errMsg = e.message || "Unknown error";
    console.warn(`[extractPdfPage] Page ${pageIndex} failed: ${errMsg}`);
    onProgress(pageIndex, "error", null, errMsg);
    return { pageIndex, hasCallouts:false, calloutsText:"", errorMsg: errMsg };
  }
}
async function splitPdfToPages(file) {
  if (!window.pdfjsLib) {
    await new Promise((res,rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const ab = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: ab }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);

    // Extract text layer for skip detection and OCR reference
    let pageText = "";
    try {
      const tc = await page.getTextContent();
      const vp0 = page.getViewport({ scale: 1.0 });
      const pageW = vp0.width;
      const items = tc.items.filter(it => it.str.trim());

      // ── Column-aware text extraction ──
      // Goal: produce a text layer where all callout panel content arrives contiguous and
      // top-to-bottom, separated from the far-right title block noise.
      //
      // Strategy:
      // 1. Group all text items into horizontal rows by Y proximity (±4px).
      // 2. Within each row, sort items left-to-right by X.
      // 3. Split each row at 78% of page width:
      //    LEFT ZONE  (x < 78%): captures all callout panel locations —
      //      • Normal left sidebar (≤25% X)
      //      • Multi-column bottom panels spanning up to ~75% X (Sheet 10 style)
      //      • Right-side continuation panels (~65-80% X, Sheet 06 style)
      //      • Route/duct drawing labels scattered across the drawing area
      //    RIGHT ZONE (x ≥ 78%): far-right title block, permitting agency box,
      //      excavation data table — none of which contain callout content.
      // 4. Output left-zone rows top-to-bottom first, right-zone rows after.
      //    The model prompt instructs it to ignore drawing-area noise within the left zone.

      const LINE_SNAP = 4;    // px — items within this Y distance are on the same row
      // 78% split: captures left sidebars, multi-column bottom panels (up to ~75% X),
      // and right-side continuation panels, while excluding only the far-right title block.
      const SPLIT_X   = pageW * 0.78;

      // Sort all items top-to-bottom, left-to-right
      items.sort((a, b) => {
        const dy = b.transform[5] - a.transform[5]; // PDF Y is bottom-up, so b-a = top-down
        if (Math.abs(dy) > LINE_SNAP) return dy;
        return a.transform[4] - b.transform[4];

      // Group into rows by Y proximity
      const rows = [];
      let curRow = null, curY = null;
      for (const it of items) {
        const y = it.transform[5];
        if (curY === null || Math.abs(y - curY) > LINE_SNAP) {
          curRow = [];
          rows.push({ y, items: curRow });
          curY = y;
        }
        curRow.push(it);
      }

      // Build left-zone and right-zone line arrays separately
      const leftLines = [];
      const rightLines = [];
      for (const row of rows) {
        const leftItems  = row.items.filter(it => it.transform[4] <  SPLIT_X);
        const rightItems = row.items.filter(it => it.transform[4] >= SPLIT_X);
        if (leftItems.length)  leftLines.push(leftItems.map(it => it.str).join(" "));
        if (rightItems.length) rightLines.push(rightItems.map(it => it.str).join(" "));

    const t = setInterval(() => setNow(Date.now()), 2000);
    return () => clearInterval(t);
  }, [images]);

  const STUCK_MS = 20000; // show retry button after 20s
  return (
    <div style={{ border:"1px solid #ddd",borderRadius:"6px",marginBottom:"10px",overflow:"hidden" }}>
      {images.map((img,ii) => {
        if (img._placeholder) {
          return (
            <div key={ii} style={{ display:"flex",alignItems:"center",padding:"6px 10px",background:"#EEF4FF",borderBottom:ii<images.length-1?"1px solid #eee":"none",borderLeft:"3px solid #1F4E79" }}>
              <span style={{ fontSize:"12px",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#1F4E79" }}>
                🔒 {img.name}
              </span>
              <span style={{ fontSize:"11px",color:"#1F4E79",marginLeft:"8px",whiteSpace:"nowrap",fontStyle:"italic" }}>
                PDF source — {img._rows?.length || 0} entries preserved
              </span>
            </div>
          );
        }
        const isStuck = img.status === "extracting" && img._startedAt && (now - img._startedAt) > STUCK_MS;
        return (
          <div key={ii} style={{ display:"flex",alignItems:"center",padding:"6px 10px",background:img.status==="mismatch"?"#FFF3E0":ii%2===0?"#f9f9f9":"#fff",borderBottom:ii<images.length-1?"1px solid #eee":"none",borderLeft:img.status==="mismatch"?"3px solid #E65100":"3px solid transparent" }}>
            <span style={{ fontSize:"12px",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>🖼 {img.name}</span>
            {isStuck && onRetry ? (
              <button onClick={() => onRetry(ii)} title="Taking too long — click to retry this image" style={{ marginLeft:"8px",background:"#E65100",border:"none",color:"white",borderRadius:"4px",padding:"2px 7px",fontSize:"11px",fontWeight:"bold",cursor:"pointer",whiteSpace:"nowrap" }}>🔄 Retry</button>

function parseCableFootage(lineType, boreFootage) {
  // Given a row's lineType (newline-separated) and its bore footage,
  // return an object: { "HEX-2-WAY": feet, "1.5\" CONDUIT": feet, ... }
  const result = {};
  if (!lineType || !boreFootage) return result;

  const lines = lineType.split("\n").map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    const upper = line.toUpperCase();

    // HEX categories — match RT#-HEX-N-WAY, extract N-WAY bucket
    const hexM = upper.match(/HEX-(24|12|2|1)-WAY/);
    if (hexM) {
      const key = `HEX-${hexM[1]}-WAY`;
      result[key] = (result[key] || 0) + boreFootage;
      continue;
    }

    // Conduit — e.g. "2-1.5" CONDUIT" or "1.5" CONDUIT"

      const size = parseFloat(conduitM[2]);
      const key = `${size}" CONDUIT`;
      result[key] = (result[key] || 0) + boreFootage * multiplier;
    }

      // Footage by line type code (TCMB7 tracked separately)
      if (feet > 0 && ltc) {
        ltc.split(/[,\n]/).map(c => c.trim()).filter(Boolean).forEach(code => {
          if (code.toUpperCase() === "TCMB7") {
            s.tcmb7 = (s.tcmb7 || 0) + feet;
          } else {
            s.footage[code] = (s.footage[code] || 0) + feet;
          }
        });
      }

      // Footage by cable category (HEX type / conduit size)
      if (feet > 0 && lt) {
        const cableMap = parseCableFootage(lt, feet);
        for (const [k, v] of Object.entries(cableMap)) {
          s.cable[k] = (s.cable[k] || 0) + v;
        }
      }
    }
    return { name: sheet.name, ...s };
  });

  // Grand total
  const total = blankSheet();
  for (const s of sheetStats) {
    total.dap += s.dap; total.toby += s.toby;
    total.markerCap += s.markerCap; total.hh += s.hh; total.fdh += s.fdh;
    total.tcmb7 = (total.tcmb7 || 0) + (s.tcmb7 || 0);
    for (const [k, v] of Object.entries(s.footage))    total.footage[k]    = (total.footage[k]    || 0) + v;
    for (const [k, v] of Object.entries(s.cable))      total.cable[k]      = (total.cable[k]      || 0) + v;
    for (const [k, v] of Object.entries(s.equipCodes)) total.equipCodes[k] = (total.equipCodes[k] || 0) + v;
  }

  return { sheetStats, total };
}

// ── Redline diff helpers ──────────────────────────────────────────────────────

// Extract bore length from boreCallout, e.g. "BORE & PLACE (140')" → 140
function parseBoreLength(s) {
  if (!s) return null;
  // Parenthesized: "BORE & PLACE (140')" → 140
  let m = s.match(/\((\d+)'\)/);
  if (m) return parseInt(m[1], 10);
  // Bare (PDB format): "PDB 90' RT5-HEX-12-WAY" → 90
  m = s.match(/\b(\d+)'/);
  return m ? parseInt(m[1], 10) : null;
}

// Extract bore method (without the footage), e.g. "BORE & PLACE (140')" → "BORE & PLACE"
function parseBoreMethod(s) {
  if (!s) return "";
  return s.replace(/\s*\(\d+'\)/, "").trim();
}

// Normalize a station string to display format, e.g. "STA. 04+52" → "Station 4+52"
function formatStation(s) {
  if (!s) return null;
  // Match STA. / STA / STATION followed by optional space and station number
  const m = s.match(/(?:STA\.?|STATION)\s*([\d+]+)/i);
  if (m) {
    // Strip leading zeros from the station number part before the +
    const raw = m[1]; // e.g. "04+52" or "2+11"
    const normalized = raw.replace(/^0+(\d)/, '$1'); // "04+52" → "4+52"
    return `Station ${normalized}`;
  }
  return null;
}

// Build all change tokens for a row diff — returns array of strings to join with ", "
function buildChangeTokens(prop, red) {
  const tokens = [];

  // ── Added to callout ──
  if (red._addedToCallout) {
    const bc = String(red.boreCallout ?? "").trim();
    const m = bc.match(/callout\s+(\d+)/i);
    tokens.push(m ? `Added in Callout ${m[1]}` : bc || "Added to callout");
    return tokens;
  }

  // ── Bore callout change ──
  const propBore = String(prop?.boreCallout ?? "").trim();
  const redBore  = String(red.boreCallout  ?? "").trim();
  if (propBore !== redBore) {
    const propMethod = parseBoreMethod(propBore);
    const redMethod  = parseBoreMethod(redBore);
    const redLen     = parseBoreLength(redBore);

    if (propMethod === redMethod && redLen !== null) {
      // Same method, length changed — just show the new footage
      tokens.push(`${redLen}'`);
    } else if (redBore) {
      // Different method or entirely new bore — show full bore callout
      tokens.push(redBore);
    }
  }

  // ── Coordinates change (station) ──
  const propCoord = String(prop?.coordinates ?? "").trim();
  const redCoord  = String(red.coordinates  ?? "").trim();
  if (propCoord !== redCoord && redCoord) {
    const sta = formatStation(redCoord);
    if (sta) tokens.push(sta);
    // If not a station format, don't emit raw lat/long — skip silently
  }

  // ── Line type (hex / conduit) changes ──
  // Rules:
  //   Hex → Hex (same count):      replacement → no "Removed"
  //   Hex → Hex (fewer):           surplus are truly removed → "Removed X"
  //   Conduit → Conduit (any):     replacement/resize → no "Removed", just show new size
  //   Conduit ↔ Hex (cross-type):  always show "Removed" for the dropped line
  const propLines = String(prop?.lineType ?? "").split("\n").map(l => l.trim()).filter(Boolean);
  const redLines  = String(red.lineType   ?? "").split("\n").map(l => l.trim()).filter(Boolean);

  const isConduit = l => /CONDUIT/i.test(l);
  const isHex     = l => /HEX/i.test(l);

  // Build multiset pools
  const propPool = new Map();
  for (const l of propLines) propPool.set(l, (propPool.get(l) || 0) + 1);
  const redPool = new Map();
  for (const l of redLines)  redPool.set(l,  (redPool.get(l)  || 0) + 1);

  // First pass: consume exact matches from both pools
  const propRem = new Map(propPool);
  const redRem  = new Map(redPool);
  for (const [l, cnt] of propPool) {
    const matched = Math.min(cnt, redPool.get(l) || 0);
    if (matched > 0) {
      propRem.set(l, cnt - matched);
      redRem.set(l,  (redPool.get(l) || 0) - matched);
    }
  }

  // Remaining unmatched lines split by type
  const unmatched_prop_hex      = [];
  const unmatched_prop_conduit  = [];
  const unmatched_prop_other    = [];
  for (const [l, cnt] of propRem) {
    for (let i = 0; i < cnt; i++) {
      if (isHex(l))     unmatched_prop_hex.push(l);
      else if (isConduit(l)) unmatched_prop_conduit.push(l);
      else              unmatched_prop_other.push(l);
    }
  }

  const unmatched_red_hex      = [];
  const unmatched_red_conduit  = [];
  const unmatched_red_other    = [];
  for (const [l, cnt] of redRem) {
    for (let i = 0; i < cnt; i++) {
      if (isHex(l))     unmatched_red_hex.push(l);
      else if (isConduit(l)) unmatched_red_conduit.push(l);
      else              unmatched_red_other.push(l);
    }
  }

  // All new redlined lines are always shown (added / replaced-into)
  for (const l of [...unmatched_red_hex, ...unmatched_red_conduit, ...unmatched_red_other]) {
    tokens.push(l);
  }

  // Hex removals: only surplus (same count = replacement, no "Removed")
  const hexTrueRemovals = unmatched_prop_hex.length - unmatched_red_hex.length;
  if (hexTrueRemovals > 0) {
    for (let i = unmatched_prop_hex.length - hexTrueRemovals; i < unmatched_prop_hex.length; i++) {
      tokens.push(`Removed ${unmatched_prop_hex[i]}`);
    }
  }

  // Conduit removals:
  //   - Conduit → Conduit (same count): size change → no "Removed"
  //   - Conduit truly deleted (surplus vs other conduits): show "Removed"
  //   - Conduit replaced by hex (cross-type): show "Removed"
  const conduitTrueRemovals = unmatched_prop_conduit.length - unmatched_red_conduit.length;
  if (conduitTrueRemovals > 0) {
    for (let i = unmatched_prop_conduit.length - conduitTrueRemovals; i < unmatched_prop_conduit.length; i++) {
      tokens.push(`Removed ${unmatched_prop_conduit[i]}`);
    }
  }

  // Other line type removals (same surplus logic)
  const otherTrueRemovals = unmatched_prop_other.length - unmatched_red_other.length;
  if (otherTrueRemovals > 0) {
    for (let i = unmatched_prop_other.length - otherTrueRemovals; i < unmatched_prop_other.length; i++) {
      tokens.push(`Removed ${unmatched_prop_other[i]}`);
    }
  }

  // ── Equipment callout changes (DAP IN PIT, TOBY BOX IN PIT, etc.) ──
  const propEqLines = String(prop?.equipmentCallout ?? "").split("\n").map(l => l.trim().toUpperCase()).filter(Boolean);
  const redEqLines  = String(red.equipmentCallout   ?? "").split("\n").map(l => l.trim().toUpperCase()).filter(Boolean);
  const propEqSet   = new Set(propEqLines);
  const addedEq     = redEqLines.filter(l => !propEqSet.has(l));

  const eqHandled = new Set();
  for (const l of addedEq) {
    if (/\bDAP\b/.test(l) && /\bPIT\b/.test(l) && !eqHandled.has("DAP IN PIT")) {
      tokens.push("DAP IN PIT"); eqHandled.add("DAP IN PIT");
    } else if (/\bTOBY\b/.test(l) && /\bPIT\b/.test(l) && !eqHandled.has("TOBY BOX IN PIT")) {
      tokens.push("TOBY BOX IN PIT"); eqHandled.add("TOBY BOX IN PIT");
    } else if (/\bSPLICE\b/.test(l) && /\bPIT\b/.test(l) && !eqHandled.has("SPLICE IN PIT")) {
      tokens.push("SPLICE IN PIT"); eqHandled.add("SPLICE IN PIT");
    } else if (!/\bDAP\b|\bTOBY\b|\bSPLICE\b/.test(l) && l.length > 0) {
      tokens.push(l);
    }
  }

  return tokens;
}

// Build the full per-sheet redline change list
function buildRedlineDiff(sheets) {
  const sheetDiffs = [];
  for (const sheet of sheets) {
    if (!sheet.redlinedRows || sheet.redlinedRows.length === 0) continue;
    const proposed = sheet.rows || [];
    const redlined = sheet.redlinedRows;
    const calloutChanges = [];

    const maxLen = Math.max(proposed.length, redlined.length);
    for (let i = 0; i < maxLen; i++) {
      const prop = proposed[i];
      const red  = redlined[i];
      if (!red) continue;

      const itemLabel = red.item || prop?.item || `Row ${i + 1}`;
      const tokens = buildChangeTokens(prop, red);

      if (tokens.length > 0) {
        calloutChanges.push({ item: itemLabel, summary: tokens.join(", ") });
      }
    }

    if (calloutChanges.length > 0) {
      sheetDiffs.push({ name: sheet.name, calloutChanges });
    }
  }
  return sheetDiffs;
}

function RedlineSummaryPane({ sheets }) {
  const diffs = React.useMemo(() => buildRedlineDiff(sheets), [sheets]);
  const [copied, setCopied] = React.useState(false);

  // Compute total footage from the redlined rows (fall back to proposed rows)
  const { totalFt, boreFt, handDigFt } = React.useMemo(() => {
    let total = 0, bore = 0, handDig = 0;
    for (const sheet of sheets) {
      const rows = (sheet.redlinedRows && sheet.redlinedRows.length > 0) ? sheet.redlinedRows : (sheet.rows || []);
      for (const row of rows) {
        const bc = (row.boreCallout || "").trim();
        const m = bc.match(/\((\d+)'\)/);
        if (!m) continue;
        const ft = parseInt(m[1], 10);
        total += ft;
        if (/HAND DIG|\bHD\b/i.test(bc)) handDig += ft;
        else bore += ft;
      }
    }
    return { totalFt: total, boreFt: bore, handDigFt: handDig };
  }, [sheets]);

  // Build plain text version for copying
  const buildPlainText = () => {
    const lines = [];
    lines.push(`• A total of ${totalFt.toLocaleString()}' length was tallied based on the Construction Drawings, including ${boreFt.toLocaleString()}' Bore tallied in Bore Logs and ${handDigFt.toLocaleString()}' Hand Dig.`);
    lines.push("");
    lines.push("• (CP) Construction Drawings were redlined (in addition to initial redlines) to reflect the following:");
    lines.push("    ○ All Bore Sheets:");
    lines.push("        ▪ Total Bore Lengths");
    lines.push("        ▪ Total Number of Equipment");

    if (diffs.length > 0) {
      lines.push("");
      for (const sheet of diffs) {
        lines.push(`    ○ ${sheet.name}:`);
        for (const callout of sheet.calloutChanges) {
          lines.push(`        ▪ Callout ${callout.item}: ${callout.summary}`);
        }
      }
    }

    return lines.join("\n");
  };

  const handleCopy = () => {
    const text = buildPlainText();
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }).catch(() => {
      // Fallback for older browsers
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  const bullet = "•";

  return (
    <div style={{ padding:"16px 20px", fontFamily:"'Segoe UI', Arial, sans-serif", fontSize:"13px", color:"#333" }}>

      {/* Copy button */}
      <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:"12px" }}>
        <button onClick={handleCopy}
          style={{ padding:"5px 14px", borderRadius:"6px", border:"1px solid #c62828",
            background: copied ? "#c62828" : "white", color: copied ? "white" : "#c62828",
            fontSize:"12px", fontWeight:"600", cursor:"pointer", transition:"all .2s",
            display:"flex", alignItems:"center", gap:"6px" }}>
          {copied ? "✓ Copied!" : "📋 Copy as Plain Text"}
        </button>
      </div>

      {/* Bullet 1: Total length */}
      <div style={{ marginBottom:"10px", lineHeight:"1.6" }}>
        <span style={{ marginRight:"8px" }}>{bullet}</span>
        A total of <strong>{totalFt.toLocaleString()}'</strong> length was tallied based on the Construction Drawings,{" "}
        including <strong>{boreFt.toLocaleString()}'</strong> Bore tallied in Bore Logs{" "}
        and <strong>{handDigFt.toLocaleString()}'</strong> Hand Dig.
      </div>

      {/* Bullet 2: CP redlines header */}
      <div style={{ marginBottom:"4px", lineHeight:"1.6" }}>
        <span style={{ marginRight:"8px" }}>{bullet}</span>
        (CP) Construction Drawings were redlined (in addition to initial redlines) to reflect the following:
      </div>
      <div style={{ paddingLeft:"20px", marginBottom:"8px" }}>
        <div style={{ fontWeight:"bold", fontSize:"13px", color:"#1a1a1a", marginBottom:"3px",
          display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ color:"#888", fontSize:"11px" }}>○</span>
          All Bore Sheets:
        </div>
        <div style={{ paddingLeft:"20px" }}>
          {["Total Bore Lengths", "Total Number of Equipment"].map((item, i) => (
            <div key={i} style={{ display:"flex", gap:"6px", padding:"1px 0", lineHeight:"1.7" }}>
              <span style={{ color:"#555", flexShrink:0, fontSize:"11px", marginTop:"2px" }}>▪</span>
              <span>{item}</span>
            </div>
          ))}
        </div>
      </div>

      {diffs.length === 0 ? (
        <div style={{ paddingLeft:"28px", color:"#aaa", fontStyle:"italic" }}>
          No redline changes recorded.
        </div>
      ) : (
        <div style={{ paddingLeft:"20px" }}>
          {diffs.map((sheet, si) => (
            <div key={si} style={{ marginBottom:"14px" }}>
              <div style={{ fontWeight:"bold", fontSize:"13px", color:"#1a1a1a", marginBottom:"3px",
                display:"flex", alignItems:"center", gap:"6px" }}>
                <span style={{ color:"#888", fontSize:"11px" }}>○</span>
                {sheet.name}:
              </div>
              <div style={{ paddingLeft:"20px" }}>
                {sheet.calloutChanges.map((callout, ci) => (
                  <div key={ci} style={{ display:"flex", gap:"6px", padding:"1px 0", lineHeight:"1.7" }}>
                    <span style={{ color:"#555", flexShrink:0, fontSize:"11px", marginTop:"2px" }}>▪</span>
                    <span>
                      <span style={{ fontWeight:"600", color:"#c62828" }}>Callout {callout.item}:</span>
                      {" "}{callout.summary}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AddToCalloutModal({ sheets, activeSheet, rowItem, onConfirm, onClose }) {
  const defaultSheet = sheets[activeSheet]?.name || (sheets[0]?.name || "");
  const [selSheet,   setSelSheet]   = React.useState(defaultSheet);
  const [calloutNum, setCalloutNum] = React.useState("");

  const targetSheet = sheets.find(s => s.name === selSheet);
  // Use proposed rows (authoritative). Include a callout only if its blockType contains
  // at least one bore keyword. Merged rows with no bore component (e.g. TOBY BOX, DAP)
  // are treated as equipment-only and excluded.
  const hasBoreType = bt => /\bBORE\s*&\s*PLACE\b|\bHAND\s*DIG\b|\bMISSILE\s*&\s*PLACE\b/i.test(bt || "");
  // Exclude the row itself when the target sheet is the same as the source sheet
  const sourceSheetName = sheets[activeSheet]?.name;
  const calloutOptions = targetSheet
    ? [...new Set(
        (targetSheet.rows || [])
          .filter(r => r.item && hasBoreType(r.blockType)
            && !(selSheet === sourceSheetName && String(r.item) === String(rowItem)))
          .map(r => String(r.item))
      )]
    : [];

  // Display name matching the main tab bar format exactly:
  //   With label:    "Sheet C-14 (Pg 7, 8)"
  //   Without label: "Page 7"
  const sheetDisplayName = s => s.sheetLabel
    ? `Sheet ${s.sheetLabel}${s.pageNames ? ` (Pg ${s.pageNames.replace(/Page\s*/gi,"").replace(/,\s*/g,", ")})` : ""}`
    : s.name;

  // Stamp label uses sheetLabel when available, otherwise falls back to sheet.name
  const stampRef = targetSheet?.sheetLabel
    ? `Sheet ${targetSheet.sheetLabel}`
    : selSheet;
  const label = selSheet && calloutNum.trim()
    ? `Added in ${stampRef} Callout ${calloutNum.trim()}`
    : "";

  return (
    <div style={{...overlay, zIndex:210}}>
      <div style={{...mbox("440px")}}>
        <div style={mhdr}>
          <span style={{fontWeight:"bold",fontSize:"15px"}}>➕ Add to Callout</span>
          <CloseBtn onClick={onClose}/>
        </div>
        <div style={{padding:"20px"}}>
          <p style={{margin:"0 0 14px",fontSize:"13px",color:"#555"}}>
            Callout <strong>{rowItem}</strong> will be marked as added into another callout.
            The content, bore callout, line type, and line type code will be updated.
          </p>

          {/* Sheet selector */}
          <div style={{marginBottom:"12px"}}>
            <label style={{display:"block",fontSize:"12px",fontWeight:"600",color:"#333",marginBottom:"4px"}}>Target Sheet</label>
            <select value={selSheet} onChange={e=>{ setSelSheet(e.target.value); setCalloutNum(""); }}
              style={{width:"100%",padding:"7px 10px",fontSize:"13px",border:"1px solid #ccc",borderRadius:"6px",background:"white"}}>
              {sheets.map(s=>(
                <option key={s.name} value={s.name}>{sheetDisplayName(s)}</option>
              ))}
            </select>
          </div>

          {/* Callout number */}
          <div style={{marginBottom:"16px"}}>
            <label style={{display:"block",fontSize:"12px",fontWeight:"600",color:"#333",marginBottom:"4px"}}>Callout Number</label>
            <input
              list="atc-callout-options"
              value={calloutNum}
              onChange={e=>setCalloutNum(e.target.value)}
              placeholder="e.g. 27"
              autoFocus
              style={{width:"100%",padding:"7px 10px",fontSize:"13px",border:"1px solid #ccc",borderRadius:"6px",boxSizing:"border-box"}}
            />
            <datalist id="atc-callout-options">
              {calloutOptions.map(opt=><option key={opt} value={opt}/>)}
            </datalist>
          </div>

          {/* Preview */}
          {label && (
            <div style={{padding:"10px 12px",background:"#f3e8ff",border:"1px solid #c084fc",borderRadius:"6px",marginBottom:"16px",fontSize:"12px",color:"#6b21a8"}}>
              <div style={{fontWeight:"600",marginBottom:"4px"}}>Preview:</div>
              <div>Content → <strong>{label}</strong></div>
              <div>Bore Callout → <strong>{label}</strong></div>
              {(()=>{
                const pRow=(targetSheet?.redlinedRows||targetSheet?.rows||[]).find(r=>String(r.item)===String(calloutNum.trim()));
                return (<>
                  {pRow?.blockType ? <div style={{color:"#7c3aed",marginTop:"3px",fontWeight:"600"}}>Block Type → <strong>{pRow.blockType}</strong> <span style={{fontWeight:"normal",fontStyle:"italic"}}>(inherited from parent)</span></div> : null}
                  {pRow?.lineType  ? <div style={{color:"#7c3aed",marginTop:"3px",fontWeight:"600"}}>Line Type → <strong>{pRow.lineType}</strong> <span style={{fontWeight:"normal",fontStyle:"italic"}}>(inherited from parent)</span></div> : <div style={{color:"#aaa",marginTop:"3px",fontStyle:"italic"}}>Line Type → cleared</div>}
                  {pRow?.lineTypeCode ? <div style={{color:"#7c3aed",marginTop:"3px",fontWeight:"600"}}>Line Type Code → <strong>{pRow.lineTypeCode}</strong> <span style={{fontWeight:"normal",fontStyle:"italic"}}>(inherited from parent)</span></div> : <div style={{color:"#aaa",marginTop:"3px",fontStyle:"italic"}}>Line Type Code → cleared</div>}
                </>);
              })()}
            </div>
          )}

          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
            <button onClick={onClose} style={btn("#888")}>Cancel</button>
            <button
              disabled={!label}
              onClick={()=>onConfirm(selSheet, calloutNum.trim())}
              style={{...btn(label?"#7B1FA2":"#ccc",!label),fontWeight:"bold"}}>
              ✓ Apply
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

  const [annotateModal, setAnnotateModal] = useState(null);
  const [annotateMode,  setAnnotateMode]  = useState(null); // null | 'pick' | 'textbox' | 'callout'
  const [annotateTableSource, setAnnotateTableSource] = useState('proposed'); // 'proposed' | 'redlined'
  const [cancelManualConfirm, setCancelManualConfirm] = useState(false); // show confirm dialog when manual placement is active and user tries to annotate again
  const [calloutModal,  setCalloutModal]  = useState(null); // interactive callout placement state
  const [selectedPages, setSelectedPages] = useState(new Set()); // empty = extract all
  const [siteName,    setSiteName]    = useState("");
  const [exportedAll, setExportedAll] = useState(false);
  const [showExportMenu, setShowExportMenu] = useState(false);
  const [copied,      setCopied]      = useState(false);
  const [showModal,   setShowModal]   = useState(false);
  const [showGuide,   setShowGuide]   = useState(false);
  const [showSummary, setShowSummary] = useState(false);
  const [newSheets,   setNewSheets]   = useState([{ ...EMPTY_NS }]);
  const [activeNew,   setActiveNew]   = useState(0);
  const [dragIdx,     setDragIdx]     = useState(null);
  const [editingTab,  setEditingTab]  = useState(null); // index of tab being renamed
  const [dupTabIds,   setDupTabIds]   = useState(new Set()); // sheet ids flagged as name-duplicate after import
  const [selectedRows, setSelectedRows] = useState(new Set()); // row indices selected for merge (max 2)
  const [tabCtxMenu,  setTabCtxMenu]  = useState(null); // { idx, x, y } — right-click context menu
  const [mergeModal,  setMergeModal]  = useState(null); // { targetIdx } — pick tabs to merge into targetIdx
  const [mergePickedIdxs, setMergePickedIdxs] = useState([]); // tab indices picked in merge modal
  const [dropHover,   setDropHover]   = useState(false);
  const [staging,     setStaging]     = useState(null);
  const [pdfStaging,  setPdfStaging]  = useState(null);
  const [addImgModal, setAddImgModal] = useState(null);

  const newTabsRef        = useRef(null);
  const mainFileRef       = useRef(null);
  const pdfFileRef        = useRef(null);
  const addImgRef         = useRef(null);
  const annotatePdfRef    = useRef(null); // holds raw File for annotation — avoids ArrayBuffer detach in state
  const canvasScrollRef   = useRef(null); // for non-passive wheel listener
  const calloutModalRef   = useRef(null); // always holds latest calloutModal state
  const xlsxImportRef     = useRef(null); // hidden input for xlsx import
  const dragFill          = useRef(null); // { ci, ri, value, field } — active drag-fill operation

  const hasSheets = sheets.length > 0;
  const curSheet  = sheets[activeSheet] || null;

  // ── Drag-fill state (Excel-style fill handle) ──
  const [redlineMode,  setRedlineMode]  = useState(false);
  const [showRedlineNotice, setShowRedlineNotice] = useState(false);
  const redlineNoticeSuppressed = React.useRef(false); // session-only "don't show again"
  const [dragFillRange, setDragFillRange] = useState(null); // { ci, fromRi, toRi } while dragging
  const [addToCalloutModal, setAddToCalloutModal] = useState(null); // { ri, rowItem } — for "Added in Sheet X Callout Y" flow
  const toggleRow = useCallback(ri => {
    setSelectedRows(prev => {
      const n = new Set(prev);
      if (n.has(ri)) n.delete(ri);
      else n.add(ri);
      return n;
    });
  }, []);

  const activeSheetRef = useRef(activeSheet);
  const pdfCancelRef = useRef(false); // set to true to abort in-progress PDF extraction
  const pdfStagingRef = useRef(null); // always reflects latest pdfStaging for use in closures
  useEffect(() => { activeSheetRef.current = activeSheet; }, [activeSheet]);
  useEffect(() => { pdfStagingRef.current = pdfStaging; }, [pdfStaging]);

  useEffect(() => {
    const onMouseUp = () => {
      if (!dragFill.current) return;
      const { field, fromRi, toRi, value } = dragFill.current;
      dragFill.current = null;
      setDragFillRange(null);
      if (toRi === null || toRi === fromRi) return;
      const lo = Math.min(fromRi, toRi), hi = Math.max(fromRi, toRi);
      const idx = activeSheetRef.current;
      const isSharedField = field === "eop" || field === "date";
      const applyFill = (sourceRows) => sourceRows.map((r, j) => {
        if (j < lo || j > hi || j === fromRi) return r;
        const updated = { ...r, [field]: value };
        if (field === "content") {
          const contentLines = value.split("\n").map(l => normalizeContent(l.trim())).filter(Boolean);
          const normalizedValue = contentLines.join("\n");
          const reprocessed = processRow({ item: r.item, content: contentLines });
          return { ...updated, content: normalizedValue, blockType: reprocessed.blockType, equipmentCallout: reprocessed.equipmentCallout, coordinates: reprocessed.coordinates, boreCallout: reprocessed.boreCallout, lineType: reprocessed.lineType, lineTypeCode: reprocessed.lineTypeCode, depth: reprocessed.depth };
        }
        return updated;
      });
      setSheets(prev => prev.map((s, i) => {
        if (i !== idx) return s;

        const pdfU8 = new Uint8Array(await annotatePdfRef.current.arrayBuffer());
        const pdf = await window.pdfjsLib.getDocument({ data: pdfU8 }).promise;
        const page = await pdf.getPage(pageIdx + 1);
        const vp = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        // Store the viewport transform so we can invert it to get PDF coords from click pixels
        // transform = [a,b,c,d,e,f] maps PDF user-space → canvas pixels
        const transform = vp.transform;
        const pageRot = page.rotate ?? 0;  // pdf.js uses page.rotate, not getRotation()
        setCalloutModal(prev => {
          if (!prev) return prev;
          const newCache = { ...prev.pageCache, [pageIdx]: { dataUrl, vw: vp.width, vh: vp.height, transform, pageRot } };
          // Center scroll at 100% zoom
          const el = canvasScrollRef.current;
          if (el) {
            requestAnimationFrame(() => {
              el.scrollLeft = Math.max(0, (vp.width  - el.clientWidth)  / 2);
              el.scrollTop  = Math.max(0, (vp.height - el.clientHeight) / 2);
            });
          }
          return { ...prev, pageCache: newCache, zoom: 1 };
        });
      } catch(e) { console.warn('[callout render]', e); }
    };
    renderPage();
  }, [calloutModal?.currentPageIdx, calloutModal?.phase]);



  // Run the actual pdf-lib annotation
  const runPdfAnnotation = async () => {
    const { sheetTargets } = annotateModal;
    try {
      // ── Load pdf-lib ──
      if (!window.PDFLib) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
          s.onload = () => window.PDFLib ? res() : rej(new Error('PDFLib not defined after load'));
          s.onerror = () => rej(new Error('Failed to load pdf-lib'));
          document.head.appendChild(s);
        });
      }
      const { PDFDocument, PDFName, PDFArray, PDFString } = window.PDFLib;

      // Always read fresh copy from ref to avoid ArrayBuffer detach
      const pdfU8 = new Uint8Array(await annotatePdfRef.current.arrayBuffer());
      const pdfDoc = await PDFDocument.load(pdfU8, { ignoreEncryption: true });
      const ctx    = pdfDoc.context;
      const pages  = pdfDoc.getPages();

      // ── Fill color lookup ──
      const fillColor = (bt) => {
        if (/\bHH\b|\bFDH\b/i.test(bt||''))                                return [0, 1, 0];               // rgb(0,255,0)
        if (/\bDAP\b|\bTOBY\s*BOX\b/i.test(bt||''))                        return [0, 1, 1];               // rgb(0,255,255)
        if (/\bBORE\s*&\s*PLACE\b|\bMISSILE\s*&\s*PLACE\b/i.test(bt||'')) return [1, 1, 170/255];         // rgb(255,255,170)
        if (/\bHAND\s*DIG\b/i.test(bt||''))                                return [1, 191/255, 170/255];   // rgb(255,191,170)
        return [0.85, 0.85, 0.85];
      };

      // ── Shared font resource dict ──
      const fontRes = ctx.obj({
        Font: ctx.obj({
          F1: ctx.obj({ Type: 'Font', Subtype: 'Type1', BaseFont: 'Helvetica',      Encoding: 'WinAnsiEncoding' }),
          F2: ctx.obj({ Type: 'Font', Subtype: 'Type1', BaseFont: 'Helvetica-Bold', Encoding: 'WinAnsiEncoding' }),
        })
      });

      // ── Build appearance stream ──
      // Applies a counter-rotation cm matrix inside the stream so text appears
      // upright to the viewer regardless of the page's /Rotate value.
      // The /Rotate key on the annotation dict tells Acrobat's editor to match
      // the same orientation when editing.
      const buildAppearance = (lines, boxW, boxH, fc, pageRot) => {
        const [r,g,b] = fc;
        const pad=1, fontSize=6, lineH=7;
        const maxLinesInBox = Math.floor((boxH - pad * 2) / lineH);

        // Counter-rotation matrix: rotates content by -pageRot around box center
        // so text reads left-to-right as seen by the viewer
        const cx = boxW / 2, cy = boxH / 2;
        let cm;
        if      (pageRot === 90)  cm = `0 1 -1 0 ${boxH} 0`;
        else if (pageRot === 180) cm = `-1 0 0 -1 ${boxW} ${boxH}`;
        else if (pageRot === 270) cm = `0 -1 1 0 0 ${boxW}`;
        else                      cm = null;

        let ap = 'q\n';
        if (cm) ap += `${cm} cm\n`;
        // Fill background
        ap += `${r.toFixed(4)} ${g.toFixed(4)} ${b.toFixed(4)} rg\n`;
        ap += `0 0 ${boxW.toFixed(2)} ${boxH.toFixed(2)} re f\n`;
        // Red border
        ap += `1 0 0 RG\n1 w\n`;
        ap += `0 0 ${boxW.toFixed(2)} ${boxH.toFixed(2)} re S\n`;
        // Text in red
        ap += `BT\n1 0 0 rg\n`;
        let drawn = 0;
        lines.forEach((line) => {
          if (!line || drawn >= maxLinesInBox) return;
          const safe = line.substring(0,40)
            .replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
          const lx = pad;
          const ly = boxH - pad - (drawn + 1) * lineH + 2;
          if (ly < pad) return;
          ap += `${'/F1'} ${fontSize} Tf\n`;
          ap += `1 0 0 1 ${lx.toFixed(2)} ${ly.toFixed(2)} Tm\n`;
          ap += `(${safe}) Tj\n`;
          drawn++;
        });
        ap += 'ET\nQ\n';
        return ap;
      };

      let totalPlaced = 0;

      // Merge targets that share the same pageIdx (e.g. Page 5.1 + Page 5.2 → both on page 5)
      // so their callout boxes form a single grid and don't overlap.
      const pageTargetMap = new Map();
      for (const target of sheetTargets) {
        if (target.pageIdx === null || target.pageIdx >= pages.length) continue;
        const sheetObj = sheets.find(s => s.name === target.sheetName);
        if (!sheetObj) continue;
        if (!pageTargetMap.has(target.pageIdx)) {
          pageTargetMap.set(target.pageIdx, { pageIdx: target.pageIdx, sheetObj, rows: [] });
        }
        const merged = pageTargetMap.get(target.pageIdx);
        (target.rows || sheetObj.rows).forEach(row => {
          const type = classifyBlockType(row.blockType);
          if (!type) return;
          if (type === 'equipment' && !row.equipmentCallout?.trim() && !row.coordinates?.trim()) return;
          merged.rows.push({ ...row, annotationType: type });
        });
      }

      for (const { pageIdx, sheetObj, rows } of pageTargetMap.values()) {
        if (!rows.length) continue;

        const page    = pages[pageIdx];
        const { width: RW, height: RH } = page.getSize();
        const pageRot = page.getRotation()?.angle ?? 0;

        // Visual dimensions — what the viewer sees after applying /Rotate
        // For /Rotate 90 or 270, width and height are swapped visually
        const swapped = pageRot === 90 || pageRot === 270;
        const VW = swapped ? RH : RW;   // visual width  (landscape → wider)
        const VH = swapped ? RW : RH;   // visual height (landscape → shorter)

        // This ensures boxes always appear upright regardless of page /Rotate
        const lineH=9, pad=4;
        const boxW    = 70;
        const boxH    = 70;
        const gapX    = 4;
        const gapY    = 4;
        // Cap each row to 15 boxes max — number of rows = ceil(total / 15)

          if (pageRot === 90)  return [RW - vy,  vx];
          if (pageRot === 180) return [RW - vx,  vy];

        };

        // Get or create /Annots array
        const pageNode = page.node;
        let annotsArray = pageNode.lookupMaybe(PDFName.of('Annots'), PDFArray);
        if (!annotsArray) {
          annotsArray = ctx.obj([]);
          pageNode.set(PDFName.of('Annots'), annotsArray);
        }

        rows.forEach((row, i) => {
          // Column-major: fill top-to-bottom first, then move to next column
          // Pattern: 1 4 7 ...
          //          2 5 8 ...
          //          3 6 9 ...
          const col    = Math.floor(i / maxRows);
          const rowIdx = i % maxRows;

          // Box top-left in visual space (y↓)
          const vx   = gridL + col    * (boxW + gapX);
          const vyT  = gridT + rowIdx * (boxH + gapY);  // visual top of box

          const fc    = fillColor(row.blockType);
          const text  = buildAnnotationText(row, row.annotationType);
          const lines = text.split('\n').filter(Boolean);

          // All 4 corners → PDF coords → axis-aligned bounding /Rect
          const corners = [
            visToPdf(vx,       vyT),
            visToPdf(vx+boxW,  vyT),
            visToPdf(vx,       vyT+boxH),
            visToPdf(vx+boxW,  vyT+boxH),
          ];
          const xs = corners.map(c=>c[0]), ys = corners.map(c=>c[1]);
          const x1  = Math.min(...xs), y1  = Math.min(...ys);
          const rx2 = Math.max(...xs), ry2 = Math.max(...ys);

          // AP stream always drawn upright — no Matrix rotation.
          // /Rotate on the annotation dict tells Acrobat to rotate the content
          // inside the /Rect by that angle. This works both visually AND in edit mode.
          const ap = buildAppearance(lines, boxW, boxH, fc, pageRot);

          const apStream = ctx.stream(ap, {
            Type:      'XObject',
            Subtype:   'Form',
            FormType:  1,
            BBox:      [0, 0, boxW, boxH],
            Resources: fontRes,
          });
          const apRef = ctx.register(apStream);

          const [r,g,b] = fc;
          const annotDict = ctx.obj({
            Type:     'Annot',
            Subtype:  'FreeText',
            Rect:     [x1, y1, rx2, ry2],
            Contents: PDFString.of(text),
            Rotate:   pageRot,
            // /DA: font + red text color
            DA:       PDFString.of('/F1 6 Tf 1 0 0 rg'),
            DS:       PDFString.of(`font: Helvetica,sans-serif 6pt; color: #ff0000; background-color: rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`),
            // /IC = interior fill color (what Acrobat shows as Fill Color in properties)
            IC:       [r, g, b],
            // /C = set to fill color (not red) so Acrobat properties panel shows correct fill
            // The red border is drawn only inside the AP stream appearance
            C:        [r, g, b],
            BS:       ctx.obj({ W: 1, S: 'S' }),
            // /MK /BG reinforces fill color in Acrobat's property panel
            MK:       ctx.obj({ BG: ctx.obj([r, g, b]) }),
            F:        4,
            Q:        0,
            AP:       ctx.obj({ N: apRef }),
          });
          annotsArray.push(ctx.register(annotDict));
          totalPlaced++;
        });

        // ── Summary callout box (placed right after the last regular box) ──
        (() => {
