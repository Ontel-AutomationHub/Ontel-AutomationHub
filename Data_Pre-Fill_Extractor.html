function EC({ value, onChange, className = "" }) {
  const [e, setE] = useState(false);
  const [t, setT] = useState(value);
  if (e) return <input className={`w-full px-2 py-1 text-sm border-2 border-pink-400 rounded-lg outline-none focus:border-pink-600 ${className}`} value={t} onChange={ev => setT(ev.target.value)} onBlur={() => { onChange(t); setE(false); }} onKeyDown={ev => { if (ev.key === "Enter") { onChange(t); setE(false); } if (ev.key === "Escape") { setT(value); setE(false); }}} autoFocus />;
  return <span className={`cursor-pointer hover:bg-gradient-to-r hover:from-pink-50 hover:to-purple-50 px-2 py-1 rounded-lg text-sm block min-h-[24px] transition-all ${className}`} onClick={() => { setT(value); setE(true); }} title="Click to edit">{value || "\u2212"}</span>;
}

// CSV-safe: wrap in quotes if value contains comma, quote, or newline
function esc(v) {
  const s = String(v ?? "");
  if (s.includes(",") || s.includes('"') || s.includes("\n")) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

// Returns CSV string from current state - called both for download and for preview
function buildCSV(si, mt, tt, gr, cs, sectors, sc) {
  let c = "[EMAIL_DATA_ENTRY]\nField,Value\n";
  Object.entries(si).forEach(([k, v]) => { c += `${esc(k)},${esc(v)}\n`; });
  c += "\n[SOW_MOUNT]\nAction,Qty,Mount Type,Model,Details\n";
  c += `${esc(mt.action)},${esc(mt.qty)},${esc(mt.mountType)},${esc(mt.model)},${esc(mt.details)}\n`;
  c += "\n[SOW_TOWERTOP]\nAction,Equipment,Alpha,Beta,Gamma,Delta,Epsilon,Zeta\n";
  tt.forEach(r => { 
    const total = Number(r.alpha||0)+Number(r.beta||0)+Number(r.gamma||0)+Number(r.delta||0)+Number(r.epsilon||0)+Number(r.zeta||0);
    if (total > 0) c += `${esc(r.action)},${esc(r.equipment)},${esc(r.alpha)},${esc(r.beta)},${esc(r.gamma)},${esc(r.delta)},${esc(r.epsilon)},${esc(r.zeta)}\n`; 
  });
  c += "\n[SOW_GROUND]\nAction,Qty,Equipment\n";
  gr.forEach(r => { c += `${esc(r.action)},${esc(r.qty)},${esc(r.equipment)}\n`; });
  c += `\n[COP_STRUCTURE]\nOverall Height,${esc(cs.overallHeight)}\nStructure Height,${esc(cs.structureHeight)}\n`;
  for (let i = 0; i < sc; i++) {
    c += `\n[COP_${SN[i]}]\nTech,Manufacturer,Model,Status,Position,RadCenter,Azimuth,MDT,Roll,RET,RRH\n`;
    sectors[i].forEach(r => { if (r.active) c += `${esc(r.tech)},${esc(r.manufacturer)},${esc(r.model)},${esc(r.status)},${esc(r.position)},${esc(r.radCenter)},${esc(r.azimuth)},${esc(r.mdt)},${esc(r.roll)},${esc(r.ret)},${esc(r.rrh)}\n`; });
  }
  return c;
}

    const key = `${s}-${r}`;
    const current = cop[s][r];
    if (current.active) {
      setRowBackup(p => ({...p, [key]: {...current}}));
      setCop(p => { const n = p.map(x => x.map(y => ({...y}))); const t = n[s][r].tech; n[s][r] = { tech: t, manufacturer: "", model: "", status: "", position: "", radCenter: "", azimuth: "", mdt: "", roll: "", ret: "", rrh: "", active: false }; return n; });
    } else if (rowBackup[key]) {
      setCop(p => { const n = p.map(x => x.map(y => ({...y}))); n[s][r] = {...rowBackup[key]}; return n; });
      setRowBackup(p => { const n = {...p}; delete n[key]; return n; });
    }
  };
  const vis = cop.slice(0, si.sectorCount);

  // Normalize a sector array from API to exactly 12 techs in TECH_ORDER
  const normalizeSector = (rawSector) => {

      const row = techMap[t];
      if (!row) return { tech: t, manufacturer: "", model: "", status: "", position: "", radCenter: "", azimuth: "", mdt: "", roll: "", ret: "", rrh: "", active: false };

        roll: String(row.roll || ""),
        ret: String(row.ret || ""),
        rrh: String(row.rrh || ""),
        active: row.active === true || row.active === "true" || !!(row.manufacturer || row.model),

    });

- Only use the model from the MAIN mount callout (e.g., "PROPOSED T-MOBILE SECTOR MOUNT (SITE PRO P/N: VFA12-HD)")
- If CDs show "PROPOSED T-MOBILE SECTOR MOUNT" or similar → action is "New Mount" or "Mount Swap", NEVER "Retain"

EXTRACTION RULES:

## SITE INFO (from RFDS Section 1):
- siteName: Extract from "Site Name" field
- siteId: Extract from "Site ID" field  
- siteAddress: From RFDS "Address" + "City, State" fields combined
- cdAddress: From Construction Drawings title sheet address (if different from RFDS)
- landlord: Crown Castle, SBA, American Tower, Phoenix Tower International (PTI), etc.
- project: Determine from Existing vs Proposed tech comparison
- structureType: Monopole, Self Support Tower, Monopine, Rooftop, etc.
- market: Extract from "Market" field and NORMALIZE using the market mapping below
- marketPoc: Map normalized market to POC (see mapping below)
- gcName: ALWAYS leave as empty string "" — cannot be read from RFDS or CDs
- decom: "YES" if equipment removal mentioned, else "NO"
- vendor: Ericsson, Nokia, Samsung, etc.
- towerHeight: From Construction Drawings — use "Overall Height of Existing Structure" or "Top of Existing Tower" notation
- buNumber: Extract BU number if present
- region: SOUTH, NORTHEAST, WEST, etc.
- sectorCount: Count physical sectors (typically 3 or 6)

## MARKET NORMALIZATION — CRITICAL:
The RFDS may use various names for the same market. Always normalize to the standard short code:
- "UPSTATE NY", "Upstate New York", "UPNY", "New York" → market: "UPSTATE NY" (short: UPNY)
- "MIAMI", "South Florida", "SFL", "FL-Miami" → market: "MIAMI FL" (short: SFL)
- "ORLANDO", "Central Florida", "CFL", "FL-Orlando" → market: "ORLANDO FL" (short: CFL-Orlando)
- "TAMPA", "CFL Tampa", "FL-Tampa" → market: "TAMPA FL" (short: CFL-Tampa)
- "JACKSONVILLE", "North Florida", "NFL", "FL-Jacksonville" → market: "JACKSONVILLE FL" (short: NFL)
- "BAWA", "Baltimore", "Washington", "Baltimore-Washington" → market: "BAWA"
- "CAROLINAS", "North Carolina", "South Carolina", "CAR" → market: "CAROLINAS"
- "GEORGIA", "GA", "Atlanta" → market: "GEORGIA"
- "VIRGINIA", "VA", "Richmond" → market: "VIRGINIA"
- "SOVA", "Southern Virginia" → market: "SOVA"
- "WEST VIRGINIA", "WV" → market: "WEST VIRGINIA"
- "PENNSYLVANIA", "PA", "Philadelphia" → market: "PENNSYLVANIA"
- "NORTHEAST", "NE", "New England" → market: "NORTHEAST"
- "ALABAMA", "LA-AL" → market: "ALABAMA"

## PROJECT TYPE DETERMINATION:
You MUST compare Existing Config vs Proposed Config tech-by-tech to find what is truly NEW:
- A tech is "new" ONLY if it has NO entry in the Existing Config but HAS an entry in Proposed Config
- A tech that exists in BOTH Existing and Proposed is NOT new, even if the antenna model changes
- Check EACH tech: L700, L600, N600, G1900, L1900, U1900, N1900, LAWS3, L2100, U2100, L2500, N2500
- Example: If Existing has L700, L600, N600, G1900, L1900, N1900 and Proposed ADDS L2100, LAWS3, N2500 → new techs are L2100, LAWS3, N2500. L600 is NOT new because it already existed.

Project naming:
- If N2500 is the ONLY new tech → "Anchor"
- If N2500 + other new techs → "Anchor / [new tech]" e.g., "Anchor / L2100"
- L2100 added (without N2500) → "L2100"
- L1900 added (without N2500) → "L1900"
- L600 added (without N2500) → "L600"
- Multiple new techs without N2500 → combine: "L2100 / L1900"
- New sectors added → "Sector Add"
- Brand new site → "NSB"
- Complete replacement → "Market Swap"
- Same antennas, radio changes → "Radio Upgrade"
- Hardware upgrades no new spectrum → "Equipment Upgrade"
- Additional capacity on existing techs → "Capacity Add"

## MOUNT:
See CRITICAL RULES above. Extract from CDs PROPOSED ANTENNA PLAN (elevation/top view), NOT from antenna mounting details.
- mountType: Sector Mount, Pipe Mount, Platform Mount, Collar Mount, etc.
- model: The P/N after "SITE PRO P/N:" in CDs (e.g., "VFA12-HD")
- qty: Total count (e.g., "1/SECTOR-3 TOTAL" → qty: "3")
- details: Summary including quantities and components

## TOWERTOP:
See CRITICAL RULES above for towertop vs ground distinction.
- Actions: Install, Remove, Retain, Relocate
- Equipment types: antenna, RRH, TMA, diplexer, combiner
- COMBINE by equipment type — do NOT list individual models. Count ALL antennas together: if a sector gets 1 new FFVV + 1 new AIR6419, that's "Install antenna = 2 per sector". If a sector retains 2 existing antennas, that's "Retain antenna = 2 per sector". Same for RRH — count all radios together.
- Skip rows where ALL sector counts are 0
- Equipment in BOTH Existing AND Proposed = "Retain", NOT "Remove"

## GROUND — CRITICAL RULES:
List ALL ground equipment changes with Action + Qty + Equipment name.

**PRIMARY SOURCE: RFDS** — Use RFDS Existing RAN vs Proposed RAN tables as the main source for ground equipment. Everything listed under "Existing RAN Equipment" and "Proposed RAN Equipment" tables in RFDS is ground equipment.

**Counting rules:**
- Combine same equipment TYPE regardless of sub-model. Example: 2x RP 6651 (even if different variants) = qty 2 as "RP 6651"
- Do NOT over-specify model variants — use the base equipment name (BB 6630, RP 6651, RUS01, CSR 7705 SAR M, etc.)

**Action determination by comparing RFDS Existing vs Proposed:**
- In Proposed but NOT in Existing → "Install"
- In Existing but NOT in Proposed → "Remove"
- In BOTH but marked as relocated or position changes → "Relocate" (NOT "Retain")
- In BOTH with no changes → "Retain"
- If equipment like BB 6630 or CSR 7705 SAR M shows relocation notes → action is "Relocate"

**CDs cross-reference:**
- If CDs show ground items NOT in RFDS (e.g., Generator, Hybrid Trunk), add them to ground list AND flag as discrepancy: "Generator shown in CDs but not in RFDS"
- RFDS is the authority for ground equipment; CDs supplements it

**Ground equipment includes:** BB (Baseband), RP (Radio Processor), RUS, RRU, PSU, rectifier, battery cabinet, surge suppressor, fiber panel, GPS, Hybrid Trunk cables, CSR/router, power cables, generator

## COP_STRUCTURE — CRITICAL:
- overallHeight: The OVERALL height of existing structure INCLUDING appurtenances (lightning rod, antenna extensions). In CDs look for "OVERALL HEIGHT OF EXISTING STRUCTURE", "HEIGHT OF GREATEST APPURTENANCE", or the tallest measurement shown. This is typically the LARGER number (e.g., 170').
- structureHeight: The bare structure/tower height ONLY, WITHOUT appurtenances. In CDs look for "TOP OF EXISTING TOWER", "TOP OF STRUCTURE", "STRUCTURE HEIGHT". This is typically the SMALLER number (e.g., 152').
- These two values are usually DIFFERENT — overallHeight >= structureHeight. If you only find one measurement, use it for both but flag as a discrepancy.
- Do NOT use the proposed antenna rad center height (e.g., 148') as either value — those are mounting positions, not structure heights.
- If RFDS shows a different height than CDs, prefer CDs values for structure measurements.

## ANTENNA STATUS:
See CRITICAL RULES above. NEVER use "PROPOSED" — only "NEW", "EXISTING", or "RELOCATE".

## SECTORS - CRITICAL RULES:
1. Each sector array MUST have EXACTLY 12 objects, one for each tech in order
2. Technologies sharing the same antenna get identical properties (manufacturer, model, position, radCenter, azimuth, mdt, roll, ret)
3. Only the FIRST tech in each antenna group gets the RRH value
4. Manufacturer mapping: FFVV/HBXX/APXV = "CommScope", AIR models = "Ericsson"
5. Set active: true for all populated techs, active: false for unused

              <div className="p-6 grid grid-cols-2 gap-5">
                {[["Action",<select className="w-full text-sm bg-transparent outline-none cursor-pointer border-2 border-blue-200 rounded-lg px-2 py-1 hover:border-blue-400" value={mt.action} onChange={e=>setMt(p=>({...p,action:e.target.value}))}><option>Retain</option><option>Mount Swap</option><option>Mount Mod</option><option>New Mount</option></select>],["Qty",<EC value={mt.qty} onChange={v=>setMt(p=>({...p,qty:v}))}/>],["Mount Type",<EC value={mt.mountType} onChange={v=>setMt(p=>({...p,mountType:v}))}/>],["Model",<EC value={mt.model} onChange={v=>setMt(p=>({...p,model:v}))}/>],["Details",<EC value={mt.details} onChange={v=>setMt(p=>({...p,details:v}))}/>]].map(([l,c],i)=>(
                  <div key={i} className="flex items-center gap-3"><span className="text-sm font-semibold text-gray-600 w-28 shrink-0">{l}:</span><div className="flex-1 bg-gradient-to-r from-blue-50 to-cyan-50 border-2 border-blue-200 rounded-lg px-2 py-1 hover:border-blue-300">{c}</div></div>
                ))}
              </div>
            </div>
            <div className="bg-white rounded-2xl shadow-xl border border-purple-100">
              <div className="px-6 py-4 border-b bg-gradient-to-r from-green-50 to-emerald-50 rounded-t-2xl flex items-center justify-between">
                <h2 className="font-bold text-gray-800 text-lg flex items-center gap-2"><Icon type="signal" size={20} /> II. TOWERTOP</h2>
                <button onClick={() => setTt(p => [...p, {action:"Install",equipment:"antenna",alpha:0,beta:0,gamma:0,delta:0,epsilon:0,zeta:0}])} className="px-4 py-1.5 text-xs font-bold rounded-lg bg-gradient-to-r from-green-500 to-emerald-600 text-white hover:from-green-600 hover:to-emerald-700 shadow transition-all">+ Add Row</button>
              </div>
              <div className="p-5 overflow-x-auto">
                <table className="w-full text-sm border-collapse"><thead><tr className="bg-gradient-to-r from-green-100 to-emerald-100"><th className="text-left p-3 font-bold">Action</th><th className="text-left p-3 font-bold">Equipment</th>{SN.slice(0,si.sectorCount).map((s,i)=><th key={s} className="text-center p-3 font-bold" style={{color:SC[i]}}>{s.charAt(0)}</th>)}<th className="p-3 w-10"></th></tr></thead>
                <tbody>{tt.map((r,ri)=><tr key={ri} className="border-b hover:bg-gradient-to-r hover:from-green-50 hover:to-emerald-50 transition-colors"><td className="p-3"><select className="w-full text-sm bg-transparent outline-none cursor-pointer border-2 border-green-200 rounded-lg px-2 py-1 hover:border-green-400 font-semibold" value={r.action} onChange={e=>{const n=[...tt];n[ri]={...n[ri],action:e.target.value};setTt(n);}} style={{color:r.action==="Install"?"#16A34A":r.action==="Remove"?"#DC2626":r.action==="Relocate"?"#D97706":"#6B7280"}}><option>Install</option><option>Remove</option><option>Retain</option><option>Relocate</option></select></td><td className="p-3"><EC value={r.equipment} onChange={v=>{const n=[...tt];n[ri]={...n[ri],equipment:v};setTt(n);}}/></td>{["alpha","beta","gamma","delta","epsilon","zeta"].slice(0,si.sectorCount).map(s=><td key={s} className="text-center p-3"><input type="number" min="0" className="w-14 text-center font-mono font-semibold border-2 border-green-200 rounded-lg py-1 hover:border-green-400 focus:outline-none focus:border-green-500" value={r[s]||0} onChange={e=>{const n=[...tt];n[ri]={...n[ri],[s]:Number(e.target.value)||0};setTt(n);}}/></td>)}<td className="p-3 text-center"><button onClick={()=>{const n=[...tt];n.splice(ri,1);setTt(n);}} className="text-red-400 hover:text-red-600 font-bold text-lg" title="Remove row">{"\u00D7"}</button></td></tr>)}</tbody></table>
                {tt.length===0&&<div className="text-center py-6 text-gray-400 text-sm">No towertop entries. Click "+ Add Row" to add.</div>}
              </div>
            </div>
            <div className="bg-white rounded-2xl shadow-xl border border-purple-100">
              <div className="px-6 py-4 border-b bg-gradient-to-r from-orange-50 to-amber-50 rounded-t-2xl flex items-center justify-between">
                <h2 className="font-bold text-gray-800 text-lg flex items-center gap-2"><Icon type="zap" size={20} /> III. GROUND</h2>
                <button onClick={() => setGr(p => [...p, {action:"Install",qty:1,equipment:""}])} className="px-4 py-1.5 text-xs font-bold rounded-lg bg-gradient-to-r from-green-500 to-emerald-600 text-white hover:from-green-600 hover:to-emerald-700 shadow transition-all">+ Add Row</button>
              </div>
              <div className="p-5"><table className="w-full text-sm border-collapse"><thead><tr className="bg-gradient-to-r from-orange-100 to-amber-100"><th className="text-left p-3 font-bold">Action</th><th className="text-left p-3 font-bold">Qty</th><th className="text-left p-3 font-bold">Equipment</th><th className="p-3 w-10"></th></tr></thead>
              <tbody>{gr.map((r,i)=><tr key={i} className="border-b hover:bg-gradient-to-r hover:from-orange-50 hover:to-amber-50 transition-colors"><td className="p-3"><select className="w-full text-sm bg-transparent outline-none cursor-pointer border-2 border-orange-200 rounded-lg px-2 py-1 hover:border-orange-400 font-semibold" value={r.action} onChange={e=>{const n=[...gr];n[i]={...n[i],action:e.target.value};setGr(n);}} style={{color:r.action==="Install"?"#16A34A":r.action==="Remove"?"#DC2626":"#6B7280"}}><option>Install</option><option>Remove</option><option>Retain</option><option>Relocate</option></select></td><td className="p-3"><EC value={String(r.qty)} onChange={v=>{const n=[...gr];n[i]={...n[i],qty:v};setGr(n);}}/></td><td className="p-3"><EC value={r.equipment} onChange={v=>{const n=[...gr];n[i]={...n[i],equipment:v};setGr(n);}}/></td><td className="p-3 text-center"><button onClick={()=>{const n=[...gr];n.splice(i,1);setGr(n);}} className="text-red-400 hover:text-red-600 font-bold text-lg" title="Remove row">{"\u00D7"}</button></td></tr>)}</tbody></table>
              {gr.length===0&&<div className="text-center py-6 text-gray-400 text-sm">No ground equipment. Click "+ Add Row" to add.</div>}
              </div>
            </div>
          </div>
        )}
        
        {sec==="cop"&&(
          <div className="space-y-5">
            <div className="bg-white rounded-2xl shadow-xl border border-purple-100">
              <div className="px-6 py-4 border-b bg-gradient-to-r from-indigo-50 to-purple-50"><h2 className="font-bold text-gray-800 text-lg flex items-center gap-2"><Icon type="tower" size={20} /> Structure Info</h2></div>
              <div className="grid grid-cols-3 gap-5 p-6">
                <div className="flex items-center gap-3"><span className="text-sm font-semibold text-gray-600 w-40 shrink-0">Overall Height:</span><div className="flex-1 bg-gradient-to-r from-indigo-50 to-purple-50 border-2 border-indigo-200 rounded-lg px-2"><EC value={cs.overallHeight} onChange={v=>setCs(p=>({...p,overallHeight:v}))}/></div></div>
                <div className="flex items-center gap-3"><span className="text-sm font-semibold text-gray-600 w-40 shrink-0">Structure Height:</span><div className="flex-1 bg-gradient-to-r from-indigo-50 to-purple-50 border-2 border-indigo-200 rounded-lg px-2"><EC value={cs.structureHeight} onChange={v=>setCs(p=>({...p,structureHeight:v}))}/></div></div>
                <div className="flex items-center gap-3"><span className="text-sm font-semibold text-gray-600 w-40 shrink-0">Tape Drop:</span><div className="flex-1 bg-gray-100 border-2 border-gray-300 rounded-lg px-2"><span className="text-sm text-gray-500 px-2 py-1 block">Post-Fill</span></div></div>
              </div>
            </div>
            <div className="bg-white rounded-2xl shadow-xl border border-purple-100">
              <div className="px-6 py-4 border-b bg-gradient-to-r from-purple-50 to-pink-50"><h2 className="font-bold text-gray-800 text-lg flex items-center gap-2"><Icon type="signal" size={20} /> COP DATA ENTRY</h2><p className="text-sm text-gray-600 mt-1">All fields editable {"\u2022"} Active techs highlighted</p></div>
              <div className="flex border-b px-3 pt-3 bg-gradient-to-r from-purple-50/30 to-pink-50/30">{vis.map((_,i)=><button key={i} onClick={()=>setTab(i)} className={`px-5 py-2.5 text-sm font-bold rounded-t-xl border-b-4 transition-all transform hover:scale-105 ${tab===i?"bg-white shadow-lg":"text-gray-500 border-transparent hover:text-gray-700 hover:bg-white/50"}`} style={tab===i?{color:SC[i],borderColor:SC[i]}:{}}>{SN[i]}<span className="ml-2 text-gray-400 font-normal text-xs">(S{i+1})</span></button>)}</div>
              <div className="overflow-x-auto p-3">
                <table className="w-full text-sm border-collapse">
                  <thead><tr className="bg-gradient-to-r from-gray-800 to-gray-900 text-white"><th className="p-2 text-left w-20">Tech</th><th className="p-2 text-left">Manufacturer</th><th className="p-2 text-left">Model</th><th className="p-2 text-center w-24">Status</th><th className="p-2 text-center w-16">Pos</th><th className="p-2 text-center w-20">Rad Ctr</th><th className="p-2 text-center w-20">Azimuth</th><th className="p-2 text-center w-16">MDT</th><th className="p-2 text-center w-16">Roll</th><th className="p-2 text-center w-16">RET</th><th className="p-2 text-left">RRH</th><th className="p-2 text-center w-10"></th></tr></thead>
                  <tbody>{vis[tab]?.map((r,ri)=>{const prev=ri>0?vis[tab][ri-1]:null;const ng=prev&&r.active&&prev.active&&r.model!==prev.model;return(
                    <tr key={ri} className={`${r.active?"bg-gradient-to-r from-yellow-50 to-amber-50":"bg-gray-50"} ${ng?"border-t-4 border-pink-400":"border-b border-gray-200"} hover:from-yellow-100 hover:to-amber-100 transition-all`}>
                      <td className="p-2 font-bold text-base" style={{color:r.active?SC[tab]:"#D1D5DB"}}>{r.tech}</td>
                      <td className="p-2"><EC value={r.manufacturer} onChange={v=>uCop(tab,ri,"manufacturer",v)}/></td>
                      <td className="p-2"><EC value={r.model} onChange={v=>uCop(tab,ri,"model",v)}/></td>
                      <td className="p-2 text-center"><EC value={r.status} onChange={v=>uCop(tab,ri,"status",v)} className={`text-center font-bold ${r.status==="NEW"?"text-green-600":r.status==="EXISTING"?"text-blue-600":r.status==="RELOCATE"?"text-orange-600":""}`}/></td>
                      <td className="p-2 text-center"><EC value={String(r.position)} onChange={v=>uCop(tab,ri,"position",v)}/></td>
                      <td className="p-2 text-center"><EC value={String(r.radCenter)} onChange={v=>uCop(tab,ri,"radCenter",v)}/></td>
                      <td className="p-2 text-center"><EC value={String(r.azimuth)} onChange={v=>uCop(tab,ri,"azimuth",v)}/></td>
                      <td className="p-2 text-center"><EC value={String(r.mdt)} onChange={v=>uCop(tab,ri,"mdt",v)}/></td>
                      <td className="p-2 text-center"><EC value={String(r.roll)} onChange={v=>uCop(tab,ri,"roll",v)}/></td>
                      <td className="p-2 text-center"><EC value={String(r.ret)} onChange={v=>uCop(tab,ri,"ret",v)}/></td>
                      <td className="p-2"><EC value={r.rrh} onChange={v=>uCop(tab,ri,"rrh",v)}/></td>
                      <td className="p-2 text-center">{r.active ? <button onClick={()=>clearRow(tab,ri)} className="text-red-300 hover:text-red-500 transition-colors" title="Clear row"><Icon type="eraser" size={14}/></button> : rowBackup[`${tab}-${ri}`] ? <button onClick={()=>clearRow(tab,ri)} className="text-blue-400 hover:text-blue-600 transition-colors" title="Restore row"><Icon type="undo" size={14}/></button> : null}</td>
                    </tr>);})}</tbody>
                </table>
              </div>
              <div className="px-6 py-4 bg-gradient-to-r from-gray-50 to-purple-50 rounded-b-2xl border-t text-sm text-gray-600 flex gap-6 flex-wrap">
                <span className="flex items-center gap-2"><span className="inline-block w-4 h-4 bg-gradient-to-r from-yellow-100 to-amber-100 border-2 border-yellow-300 rounded"/> Active tech</span>
                <span className="flex items-center gap-2"><span className="inline-block w-4 h-4 bg-gray-100 border-2 border-gray-300 rounded"/> Inactive</span>
                <span className="flex items-center gap-2"><span className="inline-block w-4 h-2 bg-pink-400 rounded"/> Antenna group separator</span>
                <span className="flex items-center gap-2"><span className="text-red-400"><Icon type="eraser" size={14}/></span> Clear row</span>
                <span className="flex items-center gap-2"><span className="text-blue-400"><Icon type="undo" size={14}/></span> Restore cleared row</span>
              </div>
            </div>
          </div>
        )}
        
        {csvReady && (
          <div className="mt-6 bg-white rounded-2xl shadow-xl border-2 border-green-300 overflow-hidden">
            <div className="px-6 py-4 bg-gradient-to-r from-green-500 to-emerald-500 flex items-center justify-between">
              <h2 className="font-bold text-white text-lg flex items-center gap-2">
                <Icon type="check" size={20} /> CSV Ready {si.siteId ? `- ${si.siteId}` : ""}
              </h2>
              <div className="flex items-center gap-2">
                <button onClick={() => {
                  navigator.clipboard.writeText(csvContent);
                  setCopied(true);
                  setTimeout(() => setCopied(false), 2000);
                }} className="px-4 py-2 text-sm font-bold rounded-lg bg-white text-green-700 hover:bg-green-50 shadow transition-all flex items-center gap-2">
                  {copied ? <><Icon type="check" size={14} /> Copied!</> : <><Icon type="copy" size={14} /> Copy CSV</>}
                </button>
                <button onClick={() => {
                  try {
                    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `${si.siteId || "Site"} - Extracted Data.csv`;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                      document.body.removeChild(a);
                      URL.revokeObjectURL(url);
                    }, 100);
                  } catch(e) {
                    navigator.clipboard.writeText(csvContent);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                  }
                }} className="px-4 py-2 text-sm font-bold rounded-lg bg-white text-green-700 hover:bg-green-50 shadow transition-all flex items-center gap-2">
                  <Icon type="download" size={14} /> Download
                </button>
                <button onClick={() => setCsvReady(false)} className="px-3 py-2 text-sm font-bold rounded-lg bg-white/30 text-white hover:bg-white/50 transition-all">X</button>
              </div>
            </div>
            <div className="p-4">
              <textarea
                className="w-full font-mono text-xs p-4 border-2 border-green-200 rounded-xl bg-green-50 focus:outline-none focus:border-green-400 resize-y shadow-inner"
                rows={12}
                value={csvContent}
                readOnly
                onFocus={e => e.target.select()}
              />
              <p className="text-sm text-gray-500 mt-2">If the download didn't start automatically, click <strong>Copy CSV</strong> then paste into a new .csv file, or click <strong>Download</strong> to retry.</p>
            </div>
          </div>
        )}
        
        <div className="mt-8 p-6 bg-gradient-to-r from-blue-100 via-purple-100 to-pink-100 rounded-2xl border-2 border-purple-200 shadow-lg text-sm text-gray-700">
          <div className="flex items-center gap-3">
            <Icon type="target" size={28} />
            <div>
              <strong className="text-base">Export Instructions:</strong> Click the green <strong>Export CSV</strong> button in the header, then import into your DEF using the Control Panel import button.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
